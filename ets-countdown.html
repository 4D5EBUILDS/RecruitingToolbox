<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS COUNTDOWN | TACTICAL OPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;500&display=swap');

        :root {
            --amber: #ffcc00;
            --cyan: #00f0ff;
            --dark: #0a0f0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0f0a 0%, #1a2a1f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Grid */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1280px;
            margin: 40px;
            background: rgba(15, 23, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--amber);
            border-radius: 20px;
            box-shadow: 0 0 80px rgba(255, 204, 0, 0.4),
                        inset 0 0 60px rgba(0, 240, 255, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, #111, #1a2a1f);
            padding: 30px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(255,204,0,0.3);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            letter-spacing: 6px;
            color: var(--amber);
            text-shadow: 0 0 30px var(--amber);
        }

        .header p {
            font-size: 1.4rem;
            color: var(--cyan);
            margin-top: 8px;
        }

        .content {
            padding: 50px 60px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
        }

        .input-panel {
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--cyan);
        }

        .countdown-panel {
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--cyan);
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--cyan);
            font-size: 1.1rem;
        }

        input {
            width: 100%;
            padding: 16px;
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 3px solid var(--amber);
            color: var(--amber);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 8px;
        }

        button:hover {
            background: var(--amber);
            color: #000;
            transform: translateY(-2px);
        }

        .timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.8rem;
            letter-spacing: 12px;
            color: var(--amber);
            text-shadow: 0 0 40px var(--amber);
            margin: 30px 0;
        }

        .progress-container {
            margin: 40px 0;
        }

        .progress {
            height: 26px;
            background: #222;
            border-radius: 50px;
            overflow: hidden;
            border: 2px solid var(--cyan);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--amber));
            transition: width 0.8s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: var(--cyan);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
        }

        .footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>TACTICAL OPS</h1>
            <p>END OF SERVICE COUNTDOWN PROTOCOL</p>
        </div>

        <div class="content">
            <!-- Input Panel -->
            <div class="input-panel" id="input-screen">
                <h2 style="margin-bottom: 25px; color: var(--amber);">MISSION PARAMETERS</h2>
                
                <label>SOLDIER CALLSIGN</label>
                <input type="text" id="name" value="SPC KRAAT">

                <label>BASIC ACTIVE SERVICE DATE (BASD)</label>
                <input type="date" id="basd">

                <button onclick="startCountdown()">ACTIVATE COUNTDOWN</button>
            </div>

            <!-- Countdown Panel -->
            <div class="countdown-panel" id="countdown-screen" style="display: none;">
                <div id="soldier-name" style="font-size: 1.8rem; color: var(--cyan); margin-bottom: 15px;"></div>
                <div id="timer" class="timer">0000 : 00 : 00 : 00</div>

                <div class="progress-container">
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">TIME SERVED</div>
                        <div id="time-served" class="stat-value">0 YRS</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">REMAINING</div>
                        <div id="remaining-years" class="stat-value">20 YRS</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">PROGRESS</div>
                        <div id="progress-text" class="stat-value">0%</div>
                    </div>
                </div>

                <button onclick="resetToInput()" style="margin-top: 40px;">RECONFIGURE MISSION</button>
            </div>
        </div>

        <div class="footer">
            UNITED STATES ARMY • RECRUITING COMMAND
        </div>
    </div>

    <script>
        let interval;

        function startCountdown() {
            const name = document.getElementById('name').value.trim() || "UNKNOWN OPERATOR";
            const basdStr = document.getElementById('basd').value;
            if (!basdStr) {
                alert("ENTER BASD, TROOPER.");
                return;
            }

            const basd = new Date(basdStr);
            const ets = new Date(basd);
            ets.setFullYear(ets.getFullYear() + 20);

            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'block';
            document.getElementById('soldier-name').textContent = name.toUpperCase();

            if (interval) clearInterval(interval);

            interval = setInterval(() => {
                const now = new Date();
                const diff = ets - now;

                if (diff <= 0) {
                    document.getElementById('timer').innerHTML = `<span style="color:#ff0033; font-size:3.5rem;">FREEDOM ACHIEVED</span>`;
                    document.getElementById('progress-bar').style.width = '100%';
                    clearInterval(interval);
                    return;
                }

                const days = Math.floor(diff / (1000*60*60*24));
                const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
                const seconds = Math.floor((diff % (1000*60)) / 1000);

                document.getElementById('timer').textContent = `${days.toString().padStart(4,'0')} : ${hours.toString().padStart(2,'0')} : ${minutes.toString().padStart(2,'0')} : ${seconds.toString().padStart(2,'0')}`;

                const totalMs = 20 * 365.25 * 24 * 60 * 60 * 1000;
                const elapsed = now - basd;
                let progress = (elapsed / totalMs) * 100;
                progress = Math.min(100, Math.max(0, progress));

                document.getElementById('progress-bar').style.width = `${progress}%`;
                document.getElementById('progress-text').textContent = `${progress.toFixed(1)}%`;

                const yearsServed = (elapsed / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
                const yearsRemaining = (20 - parseFloat(yearsServed)).toFixed(1);
                document.getElementById('time-served').textContent = `${yearsServed} YRS`;
                document.getElementById('remaining-years').textContent = `${yearsRemaining} YRS`;
            }, 1000);
        }

        function resetToInput() {
            if (interval) clearInterval(interval);
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('input-screen').style.display = 'block';
        }

        // Set default date
        document.getElementById('basd').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
