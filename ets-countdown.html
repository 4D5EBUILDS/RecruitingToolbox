<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTICAL CYBER OPS // ETS PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=VT323&display=swap');
        :root {
            --amber: #ffcc00;
            --cyan: #00f0ff;
            --dark: #0a0f0a;
            --glass: rgba(15, 23, 18, 0.95);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; height: 100vh;
            background: linear-gradient(rgba(10,15,10,0.85), rgba(5,10,5,0.95)), url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            color: var(--amber);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0,255,100,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,255,100,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridmove 40s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes gridmove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .hud {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 2px solid var(--amber);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 0 60px rgba(255,204,0,0.6), inset 0 0 40px rgba(0,240,255,0.25);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.2rem;
            margin: 0;
            text-shadow: 0 0 20px var(--amber);
        }
        .subtitle {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: var(--cyan);
            margin: 10px 0 30px;
        }
        .input-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--cyan);
            font-size: 1.1rem;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--amber);
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan);
            transform: translateY(-2px);
        }
        button {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 3px solid var(--amber);
            color: var(--amber);
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            background: var(--amber);
            color: black;
            box-shadow: 0 0 30px var(--amber);
        }
        .timer {
            font-size: 4.8rem;
            font-family: 'VT323', monospace;
            text-align: center;
            letter-spacing: 8px;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hud">
            <div class="header">
                <h1>TACTICAL CYBER OPS</h1>
                <div class="subtitle">END OF SERVICE PROTOCOL</div>
            </div>
            <div id="input-screen">
                <div class="input-group">
                    <label>SOLDIER CALLSIGN</label>
                    <input type="text" id="name" value="SPC KRAAT">
                </div>
                <div class="input-group">
                    <label>BASIC ACTIVE SERVICE DATE (BASD)</label>
                    <input type="date" id="basd">
                </div>
                <button onclick="startCountdown()">INITIALIZE MISSION CLOCK</button>
            </div>
            <div id="countdown-screen" style="display: none;">
                <div id="soldier-name" style="text-align:center; font-size:2rem; color:#0ff; margin-bottom:15px;"></div>
                <div id="timer" class="timer">0000 : 00 : 00 : 00</div>
                <div class="progress">
                    <div id="progress-bar" class="progress-bar" style="width:0%"></div>
                </div>
                <div class="stats">
                    <div class="stat"><div class="stat-label">TIME SERVED</div><div id="time-served" class="stat-value">0 YRS</div></div>
                    <div class="stat"><div class="stat-label">REMAINING</div><div id="remaining-years" class="stat-value">20 YRS</div></div>
                    <div class="stat"><div class="stat-label">PROGRESS TO FREEDOM</div><div id="progress-text" class="stat-value">0%</div></div>
                </div>
                <button onclick="resetToInput()">RECONFIGURE MISSION</button>
            </div>
        </div>
    </div>
    <script>
        let interval;
        function startCountdown() {
            const name = document.getElementById('name').value.trim() || "UNKNOWN OPERATOR";
            const basdStr = document.getElementById('basd').value;
            if (!basdStr) { alert("ENTER BASD, TROOPER."); return; }
            const basd = new Date(basdStr);
            const ets = new Date(basd);
            ets.setFullYear(ets.getFullYear() + 20);
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'block';
            document.getElementById('soldier-name').textContent = name.toUpperCase();
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                const now = new Date();
                const diff = ets - now;
                if (diff <= 0) {
                    document.getElementById('timer').innerHTML = `<span style="color:#ff0033;">FREEDOM ACHIEVED</span>`;
                    document.getElementById('progress-bar').style.width = '100%';
                    clearInterval(interval);
                    return;
                }
                const days = Math.floor(diff / (1000*60*60*24));
                const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
                const seconds = Math.floor((diff % (1000*60)) / 1000);
                document.getElementById('timer').textContent = `${days.toString().padStart(4,'0')} : ${hours.toString().padStart(2,'0')} : ${minutes.toString().padStart(2,'0')} : ${seconds.toString().padStart(2,'0')}`;
                const totalMs = 20 * 365.25 * 24 * 60 * 60 * 1000;
                const elapsed = now - basd;
                let progress = (elapsed / totalMs) * 100;
                progress = Math.min(100, Math.max(0, progress));
                document.getElementById('progress-bar').style.width = `${progress}%`;
                document.getElementById('progress-text').textContent = `${progress.toFixed(1)}%`;
                const yearsServed = (elapsed / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
                const yearsRemaining = (20 - parseFloat(yearsServed)).toFixed(1);
                document.getElementById('time-served').textContent = `${yearsServed} YRS`;
                document.getElementById('remaining-years').textContent = `${yearsRemaining} YRS`;
            }, 1000);
        }
        function resetToInput() {
            if (interval) clearInterval(interval);
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('input-screen').style.display = 'block';
        }
        document.getElementById('basd').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
