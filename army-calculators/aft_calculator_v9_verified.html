function fmtTime(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;}
function parseTime(str){str=(str||'').trim();if(str.includes(':')){const p=str.split(':');return parseInt(p[0]||0)*60+(parseInt(p[1]||0)||0);}return parseInt(str)||0;}

function interp(table,val,hi,minT,maxT){
  if(hi&&minT!=null&&val<minT) return 0;
  if(!hi&&maxT!=null&&val>maxT) return 0;
  const s=[...table].sort((a,b)=>hi?a[0]-b[0]:b[0]-a[0]);
  if(hi&&val>=s[s.length-1][0]) return s[s.length-1][1];
  if(!hi&&val<=s[s.length-1][0]) return s[s.length-1][1];
  for(let i=0;i<s.length-1;i++){
    if(hi&&val>=s[i][0]&&val<=s[i+1][0]){const t=(val-s[i][0])/(s[i+1][0]-s[i][0]);return Math.min(100,Math.max(0,Math.round(s[i][1]+t*(s[i+1][1]-s[i][1]))));}
    if(!hi&&val<=s[i][0]&&val>=s[i+1][0]){const t=(s[i][0]-val)/(s[i][0]-s[i+1][0]);return Math.min(100,Math.max(0,Math.round(s[i][1]+t*(s[i+1][1]-s[i][1]))));}
  }
  return 0;
}

  if(id==='mdl') return interp(MDL[ai],val,true,MDL_MIN[ai],null);
  if(id==='hrp') return interp(HRP[ai],val,true,HRP_MIN[ai],null);
  if(id==='sdc') return interp(SDC[ai],val,false,null,SDC_MAX[ai]);
  if(id==='plk') return interp(PLK[ai],val,true,PLK_MIN_S[ai],null);
  if(id==='run') return interp(RUN[ai],val,false,null,RUN_MAX[ai]);
  return 0;
}
const EVTS=[
  {id:'mdl',label:'Max Deadlift (MDL)',isTime:false,unit:'lbs',min:60,max:400,step:10,def:240},
  {id:'hrp',label:'Push-ups (HRP)',isTime:false,unit:'reps',min:1,max:65,step:1,def:35},
  {id:'sdc',label:'Sprint-Drag-Carry (SDC)',isTime:true,min:88,max:230,step:1,def:135},
  {id:'plk',label:'Plank (PLK)',isTime:true,min:30,max:220,step:1,def:120},
  {id:'run',label:'2-Mile Run (2MR)',isTime:true,min:700,max:1500,step:1,def:1150},
];
const pc=p=>p>=90?'#1D9E75':p>=60?'#378ADD':'#E24B4A';
const vals={};EVTS.forEach(e=>vals[e.id]=e.def);
function toDisplay(ev,v){return ev.isTime?fmtTime(v):String(v);}
function fromInput(ev,str){let v=ev.isTime?parseTime(str):parseInt((str||'').replace(/[^0-9]/g,'')||'0');return Math.max(ev.min,Math.min(ev.max,isNaN(v)?ev.def:v));}

function buildGrid(){
  const container=document.getElementById('ev-container');container.innerHTML='';
  const ai=parseInt(document.getElementById('sel-age').value);
  EVTS.forEach(ev=>{
    const v=vals[ev.id];const pts=getScore(ev.id,v,ai);const col=pc(pts);
    const div=document.createElement('div');
    div.className='ev '+(pts>=60?'pass':'fail');div.id='card-'+ev.id;
    div.innerHTML=`<p class="ev-name">${ev.label}</p>
      <p class="ev-score" id="sc-${ev.id}" style="color:${col}">${pts}</p>
      <div class="bar-bg"><div class="bar-fg" id="br-${ev.id}" style="width:${Math.min(pts,100)}%;background:${col}"></div></div>
      <div class="slider-row"><input type="range" id="rng-${ev.id}" min="${ev.min}" max="${ev.max}" step="${ev.step}" value="${v}"><span class="range-disp" id="rd-${ev.id}">${toDisplay(ev,v)}</span></div>
      <div class="manual-row"><label for="txt-${ev.id}">${ev.isTime?'M:SS':ev.unit}</label><input type="text" class="manual" id="txt-${ev.id}" value="${toDisplay(ev,v)}" placeholder="${ev.isTime?'M:SS':ev.unit}"></div>`;
    container.appendChild(div);
    div.querySelector('#rng-'+ev.id).addEventListener('input',function(){
      vals[ev.id]=parseInt(this.value);
      const d=toDisplay(ev,vals[ev.id]);
      document.getElementById('rd-'+ev.id).textContent=d;
      document.getElementById('txt-'+ev.id).value=d;
      refreshCard(ev.id);refreshTotals();
    });
    const txt=div.querySelector('#txt-'+ev.id);
    const commit=function(){
      const v2=fromInput(ev,this.value);vals[ev.id]=v2;
      this.value=toDisplay(ev,v2);
      document.getElementById('rng-'+ev.id).value=v2;
      document.getElementById('rd-'+ev.id).textContent=toDisplay(ev,v2);
      refreshCard(ev.id);refreshTotals();
    };
    txt.addEventListener('blur',commit);
    txt.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();this.blur();}});
  });
}
function refreshCard(id){
  const ai=parseInt(document.getElementById('sel-age').value);
  const pts=getScore(id,vals[id],ai);const col=pc(pts);
  const sc=document.getElementById('sc-'+id);const br=document.getElementById('br-'+id);const card=document.getElementById('card-'+id);
  if(sc){sc.textContent=pts;sc.style.color=col;}
  if(br){br.style.width=Math.min(pts,100)+'%';br.style.background=col;}
  if(card){card.className='ev '+(pts>=60?'pass':'fail');}
}
function refreshTotals(){
  const ai=parseInt(document.getElementById('sel-age').value);
  const scores={};EVTS.forEach(ev=>scores[ev.id]=getScore(ev.id,vals[ev.id],ai));
  const total=Object.values(scores).reduce((a,b)=>a+b,0);
  const req=parseInt(document.getElementById('sel-std').value);
  const anyFail=Object.values(scores).some(s=>s<60);
  const pass=total>=req&&!anyFail;
  document.getElementById('out-total').textContent=total;
  document.getElementById('out-total').style.color=pass?'#1D9E75':'#E24B4A';
  document.getElementById('out-req').textContent=req;
  document.getElementById('out-status').textContent=pass?'PASS':'FAIL';
  const badge=document.getElementById('out-badge');
  badge.textContent=anyFail?'Event below 60':pass?(total>=400?'Excellent':total>=350?'Strong':'Meets standard'):'Below total min';
  badge.style.cssText=`background:var(--color-background-${pass?'success':'danger'});color:var(--color-text-${pass?'success':'danger'});`;
  if(window._c)window._c.destroy();
  window._c=new Chart(document.getElementById('bar-chart'),{
    type:'bar',
    data:{labels:EVTS.map(e=>e.id.toUpperCase()),datasets:[{data:EVTS.map(e=>scores[e.id]),backgroundColor:EVTS.map(e=>pc(scores[e.id]))}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Score: '+c.parsed.y+' pts'}}},
      scales:{x:{ticks:{color:'#888'},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#888'},grid:{color:'rgba(128,128,128,0.1)'}}}}
  });
}
['sel-age','sel-std'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{buildGrid();refreshTotals();}));
buildGrid();refreshTotals();
</script>
