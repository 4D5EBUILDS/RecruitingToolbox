<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Moral Waiver Builder — Recruiter Toolbox 4D5E</title>
<style>
@font-face{font-family:"GI";src:url("../fonts/G.I.-400.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-530.ttf");font-weight:500;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-750.ttf");font-weight:700;font-display:swap}

:root,[data-theme="dark"]{
  --bg:#0f0c10;--bg-s:#1a1719;--bg-c:#201d22;--bg-h:rgba(255,204,1,.04);
  --fg:#FFCC01;--fg2:#F0EDF0;--fg-m:#8A878A;--fg-d:#444;
  --bd:rgba(255,204,1,.09);--bd-m:rgba(255,204,1,.16);--bd-s:rgba(255,204,1,.3);
  --gold:#FFCC01;--danger:#CF0000;--green:#2d7a4f;--blue:#1a5fa8;--amber:#b07800;
  --in-bg:rgba(255,255,255,.04);--in-bd:rgba(255,204,1,.2);
  --sidebar-w:260px;--ref-w:300px;
}
[data-theme="light"]{
  --bg:#F1E4C7;--bg-s:#fff;--bg-c:#fff;--bg-h:rgba(34,31,32,.03);
  --fg:#221F20;--fg2:#221F20;--fg-m:#565557;--fg-d:#BBB;
  --bd:rgba(34,31,32,.1);--bd-m:rgba(34,31,32,.2);--bd-s:rgba(34,31,32,.3);
  --gold:#c9900a;--danger:#B00000;--green:#1a6338;--blue:#0d4a8f;--amber:#8a5e00;
  --in-bg:rgba(34,31,32,.04);--in-bd:rgba(34,31,32,.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"GI",Arial,sans-serif;background:var(--bg);color:var(--fg2);font-weight:500;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,select,textarea,input{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd-s)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.4) rotate(-5deg)}60%{transform:scale(.97) rotate(.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes progressFill{from{width:0}to{width:var(--target-w,0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.fade-up{animation:fadeUp .28s ease both}
.fade-in{animation:fadeIn .2s ease both}
.slide-left{animation:slideInLeft .2s ease both}

/* ── LAYOUT ────────────────────────────────────────────────── */
#root{height:100%;display:flex;flex-direction:column}
.app-shell{flex:1;display:flex;overflow:hidden}

/* ── TOP BAR ───────────────────────────────────────────────── */
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg-s);border-bottom:1px solid var(--bd);z-index:20}
.topbar-badge{background:var(--gold);color:#000;font-weight:700;font-size:9px;padding:2px 7px;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
.topbar-title{font-size:13px;font-weight:700;color:var(--fg);letter-spacing:.04em;text-transform:uppercase}
.topbar-sub{font-size:10px;color:var(--fg-m)}
.topbar-center{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
.topbar-actions{display:flex;gap:6px;align-items:center}
.topbar-btn{background:none;border:1px solid var(--bd-m);color:var(--fg-m);padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.topbar-btn:hover{border-color:var(--bd-s);color:var(--fg2)}
.topbar-btn.active{background:var(--gold);border-color:var(--gold);color:#000}

/* ── READINESS RING ────────────────────────────────────────── */
.readiness-wrap{display:flex;align-items:center;gap:10px}
.readiness-ring{position:relative;width:36px;height:36px;flex-shrink:0}
.readiness-ring svg{transform:rotate(-90deg)}
.readiness-ring .ring-bg{fill:none;stroke:var(--bd-m);stroke-width:3}
.readiness-ring .ring-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke .3s}
.readiness-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.readiness-label{font-size:10px;color:var(--fg-m)}
.readiness-pct-big{font-size:12px;font-weight:700;color:var(--fg)}

/* Authority Badge */
.auth-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.auth-BN{background:rgba(26,95,168,.2);border:1px solid rgba(26,95,168,.4);color:#5b9fd4}
.auth-USAREC{background:rgba(255,204,1,.12);border:1px solid rgba(255,204,1,.3);color:var(--gold)}
.auth-DMPM{background:rgba(207,0,0,.15);border:1px solid rgba(207,0,0,.3);color:#ff6b6b}
.auth-NONE{background:rgba(255,255,255,.06);border:1px solid var(--bd-m);color:var(--fg-m)}

/* ── SIDEBAR ───────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg-s);overflow:hidden;transition:width .25s ease}
.sidebar.collapsed{width:0}
.sidebar-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m);flex:1}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--bd);flex-shrink:0}

/* Applicant Cards */
.appl-card{border:1px solid var(--bd);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s;position:relative}
.appl-card:hover{border-color:var(--bd-s);background:var(--bg-h)}
.appl-card.active{border-color:var(--gold);background:rgba(255,204,1,.05)}
.appl-card-name{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appl-card-meta{font-size:10px;color:var(--fg-m)}
.appl-card-status{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.status-green{background:#5bc989}
.status-yellow{background:var(--gold)}
.status-red{background:#ff5555}
.status-gray{background:var(--fg-d)}

/* ── MAIN ──────────────────────────────────────────────────── */
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tab-nav{flex-shrink:0;display:flex;background:var(--bg-s);border-bottom:1px solid var(--bd);padding:0 16px}
.tab-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border:none;background:none;color:var(--fg-m);font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:disabled{opacity:.3;cursor:not-allowed}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-btn:not(:disabled):hover:not(.active){color:var(--fg2);border-bottom-color:var(--bd-m)}
.tab-num{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.tab-btn.active .tab-num{background:var(--gold);border-color:var(--gold);color:#000}
.tab-btn.done .tab-num{background:var(--green);border-color:var(--green);color:#fff}
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}

/* ── RIGHT PANEL ───────────────────────────────────────────── */
.ref-panel{width:var(--ref-w);flex-shrink:0;border-left:1px solid var(--bd);background:var(--bg-s);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease}
.ref-panel.collapsed{width:0}
.ref-panel-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ref-panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m);flex:1}
.ref-panel-body{flex:1;overflow-y:auto;padding:12px}
.ref-entry{padding:10px 12px;border:1px solid var(--bd);margin-bottom:8px;background:rgba(255,204,1,.02)}
.ref-para-id{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.ref-para-text{font-size:11px;color:var(--fg2);line-height:1.6}
.ref-tip{font-size:10px;color:var(--fg-m);padding:6px 8px;background:rgba(255,204,1,.04);border-left:2px solid var(--bd-m);margin-top:6px;line-height:1.5}

/* ── CARDS ─────────────────────────────────────────────────── */
.card{background:var(--bg-c);border:1px solid var(--bd);padding:20px}
.card+.card{margin-top:14px}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em}
.card-sub{font-size:11px;color:var(--fg-m);margin-top:2px}
.section-bar{width:3px;align-self:stretch;min-height:16px;background:var(--gold);flex-shrink:0}

/* ── OFFENSE GRID ──────────────────────────────────────────── */
.offense-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-m);padding:8px 4px 4px;margin-top:4px}
.offense-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-bottom:2px}
.offense-card{background:var(--bg-s);border:1px solid var(--bd);padding:11px 13px;cursor:pointer;transition:all .15s;text-align:left}
.offense-card:hover{border-color:var(--bd-s);background:var(--bg-h)}
.offense-card.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.offense-card.bar{border-color:rgba(207,0,0,.25)}
.offense-card.bar:hover{border-color:rgba(207,0,0,.6);background:rgba(207,0,0,.04)}
.offense-card.bar.selected{border-color:var(--danger);background:rgba(207,0,0,.07)}
.offense-card.no-waiver{border-color:rgba(26,95,168,.25)}
.offense-card.no-waiver.selected{border-color:rgba(26,95,168,.6);background:rgba(26,95,168,.07)}
.offense-label{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:3px}
.offense-sub{font-size:10px;color:var(--fg-m);line-height:1.35}
.offense-level-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.lvl-MAJOR{background:rgba(207,0,0,.2);color:#ff6b6b}
.lvl-MISC{background:rgba(255,204,1,.15);color:var(--gold)}
.lvl-TRAFFIC{background:rgba(80,160,255,.15);color:#7eb8ff}
.lvl-VARIES{background:rgba(160,80,255,.15);color:#cc99ff}
.lvl-BAR{background:rgba(207,0,0,.3);color:#ff4444}
.lvl-NO-WAIVER{background:rgba(26,95,168,.2);color:#5b9fd4}

/* ── MULTI-OFFENSE SCREENER ────────────────────────────────── */
.offense-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.offense-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-s);border:1px solid var(--bd-m);position:relative;transition:background .2s,transform .2s;}
.offense-chip.bar{border-color:rgba(207,0,0,.4);background:rgba(207,0,0,.05)}
.offense-chip.waivable{border-color:rgba(45,122,79,.3);background:rgba(45,122,79,.04)}
.offense-chip.waiting{border-color:rgba(176,120,0,.3);background:rgba(176,120,0,.04)}
.offense-chip.etp{border-color:rgba(176,120,0,.3);background:rgba(176,120,0,.04)}
.offense-chip.no-waiver{border-color:rgba(26,95,168,.3);background:rgba(26,95,168,.04)}
.offense-chip.dragging{opacity:0.6;border-style:dashed;transform:scale(0.98);transition:transform .2s;}

/* Tooltip for offense chips using title attribute */
.offense-chip[title]:hover::after {
  content: attr(title);
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  white-space: nowrap;
  z-index: 1000;
}
.chip-verdict{font-size:9px;font-weight:700;padding:2px 6px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.chip-v-bar{background:rgba(207,0,0,.2);color:#ff5555}
.chip-v-waivable{background:rgba(45,122,79,.2);color:#5bc989}
.chip-v-waiting{background:rgba(176,120,0,.2);color:#ffb84d}
.chip-v-etp{background:rgba(176,120,0,.2);color:#ffb84d}
.chip-v-no-waiver{background:rgba(26,95,168,.2);color:#5b9fd4}
.chip-v-unknown{background:rgba(255,255,255,.06);color:var(--fg-m)}
.chip-label{flex:1;font-size:12px;color:var(--fg2);font-weight:600}
.chip-auth{font-size:10px;color:var(--fg-m)}
.chip-del{background:none;border:none;cursor:pointer;color:var(--fg-m);padding:4px;display:flex;align-items:center}
.chip-del:hover{color:#ff6b6b}

/* ── QUESTIONS ─────────────────────────────────────────────── */
.q-wrap{max-width:560px}
.q-card{background:var(--bg-c);border:1px solid var(--bd);padding:24px;animation:fadeUp .25s ease both}
.q-num{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.q-text{font-size:15px;font-weight:700;color:var(--fg2);margin-bottom:6px;line-height:1.4}
.q-hint{font-size:11px;color:var(--fg-m);margin-bottom:16px;padding:8px 10px;background:rgba(255,255,255,.03);border-left:2px solid var(--bd-m);line-height:1.5}
.q-options{display:flex;flex-direction:column;gap:5px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg-s);border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.q-opt:hover{border-color:var(--bd-s);background:var(--bg-h)}
.q-opt.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.q-opt-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd-s);flex-shrink:0;margin-top:1px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.q-opt.selected .q-opt-dot{border-color:var(--gold);background:var(--gold)}
.q-opt-dot-inner{width:6px;height:6px;border-radius:50%;background:#000}
.q-opt-label{font-size:13px;color:var(--fg2)}
.q-actions{display:flex;align-items:center;gap:10px;margin-top:16px}
.q-progress{display:flex;gap:4px;margin-bottom:20px}
.q-prog-dot{height:3px;flex:1;background:var(--bd-m);transition:background .2s;border-radius:2px}
.q-prog-dot.done{background:var(--gold)}
.q-prog-dot.active{background:rgba(255,204,1,.5)}

/* ── EXPERT MODE ───────────────────────────────────────────── */
.expert-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.expert-field{display:flex;flex-direction:column;gap:4px}
.expert-label{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em}
.expert-select{background:var(--in-bg);border:1px solid var(--in-bd);color:var(--fg2);padding:7px 9px;font-family:inherit;font-size:12px;outline:none;cursor:pointer;transition:border-color .15s;width:100%}
.expert-select:focus{border-color:var(--gold)}

/* ── VERDICT ───────────────────────────────────────────────── */
.verdict-card{padding:24px;animation:stampIn .35s ease both}
.verdict-WAIVABLE{background:rgba(45,122,79,.1);border:2px solid rgba(45,122,79,.45)}
.verdict-NO_WAIVER_REQUIRED{background:rgba(26,95,168,.1);border:2px solid rgba(26,95,168,.45)}
.verdict-NOT_WAIVABLE{background:rgba(207,0,0,.1);border:2px solid rgba(207,0,0,.45)}
.verdict-ETP_REQUIRED{background:rgba(176,120,0,.1);border:2px solid rgba(176,120,0,.4)}
.verdict-WAITING_PERIOD{background:rgba(176,120,0,.07);border:2px solid rgba(176,120,0,.35)}
.verdict-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.verdict-WAIVABLE .verdict-tag{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-tag{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-tag{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-tag,.verdict-WAITING_PERIOD .verdict-tag{color:#ffb84d}
.verdict-title{font-size:20px;font-weight:700;margin-bottom:8px}
.verdict-WAIVABLE .verdict-title{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-title{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-title{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-title,.verdict-WAITING_PERIOD .verdict-title{color:#ffb84d}
.verdict-body{font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:12px}
.verdict-cite{font-size:11px;color:var(--fg-m);padding:5px 9px;background:rgba(255,255,255,.03);border-left:2px solid var(--bd-m);display:inline-block;margin-bottom:12px}
.authority-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;background:var(--gold);color:#000;font-weight:700;font-size:12px;letter-spacing:.04em}

/* ── APPROVABILITY METER ───────────────────────────────────── */
.approval-meter{padding:14px 16px;border:1px solid var(--bd);background:var(--bg-s);margin-top:12px}
.approval-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.approval-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-m)}
.approval-score{font-size:18px;font-weight:700}
.approval-bar-bg{height:6px;background:var(--bd-m);border-radius:3px;overflow:hidden}
.approval-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.approval-factors{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.approval-factor{font-size:10px;color:var(--fg-m);display:flex;align-items:center;gap:6px}
.factor-up{color:#5bc989}
.factor-down{color:#ff7070}
.approval-disclaimer{font-size:10px;color:var(--fg-d);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-style:italic}

/* ── FORMS ─────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em}
.form-input{background:var(--in-bg);border:1px solid var(--in-bd);color:var(--fg2);padding:8px 10px;font-family:inherit;font-size:12px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--fg-d)}
select.form-input{cursor:pointer}
.form-section{font-size:10px;font-weight:700;color:var(--fg-m);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}

/* ── OFFENSE TABLE ─────────────────────────────────────────── */
.off-table{width:100%;border-collapse:collapse}
.off-table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-m);padding:7px 10px;border-bottom:1px solid var(--bd-m);text-align:left}
.off-table td{font-size:12px;color:var(--fg2);padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.off-table tr:hover td{background:var(--bg-h)}
.off-docs-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;margin-right:3px}
.docs-yes{background:rgba(45,122,79,.2);color:#5bc989}
.docs-no{background:rgba(207,0,0,.15);color:#ff7070}
.waived-star{color:var(--gold);font-weight:700;margin-right:4px}

/* ── CHECKLIST ─────────────────────────────────────────────── */
.cl-item{border-bottom:1px solid var(--bd);overflow:hidden}
.cl-item:last-child{border-bottom:none}
.cl-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;cursor:pointer}
.cl-row:hover{background:var(--bg-h)}
.cl-check{width:18px;height:18px;border:2px solid var(--bd-s);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cl-check.checked{background:var(--gold);border-color:var(--gold)}
.cl-check svg{width:10px;height:8px;display:none}
.cl-check.checked svg{display:block}
.cl-body{flex:1}
.cl-label{font-size:12px;color:var(--fg2);margin-bottom:2px}
.cl-meta{font-size:10px;color:var(--fg-m)}
.cl-note{font-size:10px;color:rgba(255,204,1,.6);font-style:italic;margin-top:2px}

<body>
<div id="root"></div>
<script src="waiver-data.js?v=2"></script>
<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const {
  OFFENSE_CATEGORIES, QUALIFYING_QUESTIONS, CHECKLIST_ITEMS,
  SAMPLE_SCENARIOS, PARA_TEXT, ED_LEVELS, US_STATES,
  MOS_RESTRICTIONS, APPROVABILITY_FACTORS,
  CAT_PARA_MAP, Q_PARA_MAP
} = window;

/* ── Icons ─────────────────────────────────────────────── */
const IcoCheck  = () => <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.8L3.8 7L9 1" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoX      = ({s=10,c="currentColor"}) => <svg width={s} height={s} viewBox="0 0 10 10" fill="none"><path d="M1 1L9 9M9 1L1 9" stroke={c} strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoChev   = ({open,size=10}) => <svg width={size} height={size} viewBox="0 0 10 10" fill="none" style={{transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoDoc    = () => <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9H3V2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><path d="M10 2v3h3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M5 8h6M5 10.5h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoPrint  = () => <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="5" width="12" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M4 5V3h8v2M5 10h6M5 12h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoClock  = () => <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.3"/><path d="M7 4v3l2 2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoShield = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.5L2 4v4c0 2.5 2 4.5 5 5 3-0.5 5-2.5 5-5V4L7 1.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>;
const IcoPlus   = () => <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoTrash  = () => <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M1.5 3h9M5 3V2h2v1M3 3l.5 7h5L9 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoUser   = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="3" stroke="currentColor" strokeWidth="1.3"/><path d="M2 13c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoStar   = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1l1.4 3.1H11L8.1 6.4l1.1 3.2L6 7.7l-3.2 1.9L3.9 6.4 1 4.1h3.6z" stroke="currentColor" strokeWidth="1.1" fill="currentColor" fillOpacity=".3"/></svg>;
const IcoGauge  = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 11a5 5 0 1 1 10 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M7 11L4.5 7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;
const IcoMOS    = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="3" width="11" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M5 3V2h4v1M4 7h6M4 9.5h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;

/* ── Storage ────────────────────────────────────────────── */
const STORAGE_KEY = 'moral-waiver-v3';

const loadRoster = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch { return null; } };
const saveRoster = (roster) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(roster)); } catch {} };

const blankApplicant = () => ({
  id: `a${Date.now()}`,
  savedAt: new Date().toISOString(),
  // Applicant Info
  lastName:'', firstName:'', mi:'', ssn:'', dob:'', rsid:'',
  educationLevel:'', educationCode:'', afqt:'', psNps:'', maritalStatus:'',
  numDependents:'', dependentAges:'',
  // Recruiter Info
  recruiterUnit:'', recruiterAddress:'', recruiterOfficeSym:'', recruiterName:'', recruiterRank:'',
  // Screening
  offenses: [],       // { id, categoryId, verdict, answers, ...offense log data }
  // Packet
  checklistStatus:{}, checklistNotes:{}, expDates:{},
  // Tracker
  trackerStatus:'building', trackerNotes:'', submittedDate:'', approvedDate:'',
  // MOS
  mosCode:'',
});

/* ── Helpers ────────────────────────────────────────────── */
const fmtDate = iso => { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return iso; } };
const today = () => new Date().toISOString().split('T')[0];

const daysUntilExpiry = (dateObtained, validityDays) => {
  if (!dateObtained || !validityDays) return null;
  const exp = new Date(dateObtained);
  exp.setDate(exp.getDate() + validityDays);
  return Math.ceil((exp - new Date()) / 86400000);
};

const getExpiryStatus = (days) => {
  if (days === null) return 'none';
  if (days < 0) return 'red';
  if (days <= 30) return 'warn';
  return 'ok';
};

/* ── Core Logic ─────────────────────────────────────────── */
const computeVerdictFromAnswers = (offenseId, answers) => {
  const cat = OFFENSE_CATEGORIES.find(c => c.id === offenseId);
  if (!cat) return null;

  // No-waiver-required categories
  if (cat.noWaiverRequired) return { type:'NO_WAIVER_REQUIRED', reason: cat.noWaiverText || 'No waiver required for this offense type.', cite:'AR 601-210, para 4-35' };
  if (cat.bar) return { type:'NOT_WAIVABLE', reason: cat.barText, cite:`AR 601-210, ${cat.barPara}` };

  const { disposition, pending_charges, civil_restraint, major_count, lautenberg, sex_offender, confinement_days } = answers;

  if (disposition === 'dismissed') return { type:'NO_WAIVER_REQUIRED', reason:'No adverse court disposition — waiver is not required. Document in GENESIS remarks.', cite:'AR 601-210, para 4-30' };
  if (disposition === 'self_admit') return { type:'ETP_REQUIRED', reason:'Self-admittal with no court record. An Exception to Policy (ETP) may be required before submission. Verify with battalion S1 before building the packet.', cite:'AR 601-210, para 4-30' };
  if (pending_charges === 'yes') return { type:'NOT_WAIVABLE', reason:'Applicant has pending criminal or juvenile charges. Cannot process until ALL charges are fully resolved.', cite:'AR 601-210, para 4-22g' };
  if (civil_restraint === 'yes') return { type:'NOT_WAIVABLE', reason:'Applicant is currently under civil restraint (confinement, parole, or supervised probation). Cannot process.', cite:'AR 601-210, para 4-22h' };
  if (major_count === '2plus') return { type:'NOT_WAIVABLE', reason:'Two or more major misconduct (felony-level) convictions — permanently disqualified. No waiver authority exists at any level.', cite:'AR 601-210, para 4-22i' };
  if (lautenberg === 'yes') return { type:'NOT_WAIVABLE', reason:'Lautenberg Amendment conviction — absolute bar to enlistment at every level.', cite:'AR 601-210, Table 4-4, Code 414' };
  if (sex_offender === 'yes') return { type:'NOT_WAIVABLE', reason:'Sex offense or sex offender registration requirement — absolute bar.', cite:'AR 601-210, para 4-22j' };

  if (confinement_days === '15plus') return { type:'WAITING_PERIOD', waitMonths:6, reason:'6-month waiting period required after release from confinement (15+ days). BN CO may waive up to 3 months of this waiting period.', cite:'AR 601-210, para 4-31' };
  if (confinement_days === 'under15') return { type:'WAITING_PERIOD', waitMonths:3, reason:'3-month waiting period required after release from confinement (under 15 days). BN CO may waive up to 45 days of this waiting period.', cite:'AR 601-210, para 4-31' };

  const authority = cat.authority || 'BN';
  return { type:'WAIVABLE', authority, cite:'AR 601-210, Chapter 4' };
};

// Determine the governing (highest) authority across all screened offenses
const computeGoverningAuthority = (screenedOffenses) => {
  const order = ['NONE','BN','USAREC','DMPM'];
  let highest = 'BN';
  for (const so of screenedOffenses) {
    if (so.verdict?.type === 'NOT_WAIVABLE') return 'NONE';
    if (so.verdict?.type === 'WAIVABLE') {
      const auth = so.verdict.authority;
      if (order.indexOf(auth) > order.indexOf(highest)) highest = auth;
    }
  }
  return highest;
};

// Determine overall case verdict
const computeOverallVerdict = (screenedOffenses) => {
  if (!screenedOffenses || screenedOffenses.length === 0) return null;
  // Any absolute bar → NOT_WAIVABLE
  for (const so of screenedOffenses) {
    if (so.verdict?.type === 'NOT_WAIVABLE') return 'NOT_WAIVABLE';
  }
  // Any waiting period
  for (const so of screenedOffenses) {
    if (so.verdict?.type === 'WAITING_PERIOD') return 'WAITING_PERIOD';
  }
  // Any ETP
  for (const so of screenedOffenses) {
    if (so.verdict?.type === 'ETP_REQUIRED') return 'ETP_REQUIRED';
  }
  // If any waivable, overall is waivable
  if (screenedOffenses.some(so => so.verdict?.type === 'WAIVABLE')) return 'WAIVABLE';
  // All no-waiver or dismissed
  return 'NO_WAIVER_REQUIRED';
};

const computeApprovabilityScore = (screenedOffenses, applicant) => {
  if (!screenedOffenses?.length) return null;
  const ov = computeOverallVerdict(screenedOffenses);
  if (ov === 'NOT_WAIVABLE') return null;

  let score = 60; // baseline
  const factors = [];

  // Authority mod
  const auth = computeGoverningAuthority(screenedOffenses);
  const authMod = APPROVABILITY_FACTORS.authorityMods[auth] || 0;
  if (authMod !== 0) factors.push({ label:`${auth} level authority`, mod:authMod });
  score += authMod;

  // Offense count
  const cnt = screenedOffenses.filter(so => so.verdict?.type === 'WAIVABLE' || so.verdict?.type === 'ETP_REQUIRED').length;
  const cntMod = cnt === 1 ? 15 : cnt === 2 ? -10 : cnt === 3 ? -20 : -35;
  if (cntMod !== 0) factors.push({ label:`${cnt} waiver offense(s)`, mod:cntMod });
  score += cntMod;

  // Time since most recent offense (from offense log)
  const offenseDates = screenedOffenses.flatMap(so => so.offenseDate ? [new Date(so.offenseDate)] : []).sort((a,b)=>b-a);
  if (offenseDates.length > 0) {
    const yearsAgo = (Date.now() - offenseDates[0].getTime()) / (365.25*24*3600*1000);
    const tf = APPROVABILITY_FACTORS.timeFactors.slice().reverse().find(t => yearsAgo <= t.yearsAgo) || APPROVABILITY_FACTORS.timeFactors[APPROVABILITY_FACTORS.timeFactors.length-1];
    if (tf.mod !== 0) factors.push({ label:tf.label, mod:tf.mod });
    score += tf.mod;
  }

  // AFQT
  const afqt = parseInt(applicant.afqt);
  if (!isNaN(afqt)) {
    const am = APPROVABILITY_FACTORS.afqtMods.find(a => afqt >= a.min);
    if (am && am.mod !== 0) { factors.push({ label:am.label, mod:am.mod }); score += am.mod; }
  }

  // Education
  const eduMod = APPROVABILITY_FACTORS.educationMods[applicant.educationLevel] ?? 0;
  if (eduMod !== 0) factors.push({ label:applicant.educationLevel, mod:eduMod });
  score += eduMod;

  // Juvenile bonus
  if (screenedOffenses.some(so => so.answers?.is_adult === 'no')) {
    factors.push({ label:'Juvenile offense (more sympathetic)', mod:APPROVABILITY_FACTORS.juvenileMod });
    score += APPROVABILITY_FACTORS.juvenileMod;
  }

  // First offense bonus
  if (screenedOffenses.every(so => so.answers?.major_count === '0' || so.answers?.major_count === undefined)) {
    factors.push({ label:'No prior major misconduct', mod:APPROVABILITY_FACTORS.firstOffenseMod });
    score += APPROVABILITY_FACTORS.firstOffenseMod;
  }

  score = Math.max(5, Math.min(95, score));
  return { score: Math.round(score), factors };
};

const getRequiredChecklist = (authority, isTrafficOnly) => {
  return CHECKLIST_ITEMS.filter(item => {
    if (item.group === 'all') return true;
    if (item.group === 'non_traffic' && !isTrafficOnly) return true;
    if (item.group === 'usarec_dmpm' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    if (item.group === 'major' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    if (item.group === 'major_applicable' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    return false;
  });
};

const computeReadiness = (applicant, screenedOffenses, clStatus) => {
  let score = 0;
  const breakdown = [];

  // Screener complete
  const overallV = computeOverallVerdict(screenedOffenses);
  if (overallV) { score += 15; breakdown.push({ label:'Eligibility determined', done:true }); }
  else breakdown.push({ label:'Eligibility screener', done:false });

  // Applicant info
  const infoFields = ['lastName','firstName','dob','rsid'];
  const infoFilled = infoFields.every(f => applicant[f]);
  if (infoFilled) { score += 10; breakdown.push({ label:'Applicant info complete', done:true }); }
  else breakdown.push({ label:'Applicant info', done:false });

  // Offenses logged
  if (screenedOffenses.some(so => so.offenseDate)) { score += 10; breakdown.push({ label:'Offenses logged', done:true }); }
  else breakdown.push({ label:'Offense log', done:false });

  // Checklist items
  const auth = computeGoverningAuthority(screenedOffenses) || 'BN';
  const isTrafficOnly = screenedOffenses.every(so => {
    const cat = OFFENSE_CATEGORIES.find(c => c.id === so.categoryId);
    return cat && cat.group === 'traffic';
  });
  const required = getRequiredChecklist(auth, isTrafficOnly);
  const completedItems = required.filter(i => clStatus[i.id] === 'complete').length;
  const itemPct = required.length > 0 ? Math.round((completedItems / required.length) * 65) : 0;
  score += itemPct;
  breakdown.push({ label:`Checklist (${completedItems}/${required.length})`, done: completedItems === required.length && required.length > 0 });

  return { score: Math.min(100, score), breakdown };
};

/* ── Simple relative date parser for smooth input ──────────────────────── */
const parseRelativeDate = (input) => {
  if (!input) return null;
  const s = input.trim().toLowerCase();
  const now = new Date();

  // Direct ISO date
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

  // Common phrases
  if (s === 'yesterday' || s === 'yest') {
    const d = new Date(now); d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0];
  }
  if (s === 'today') {
    return now.toISOString().split('T')[0];
  }
  if (s === 'last week' || s === 'a week ago') {
    const d = new Date(now); d.setDate(d.getDate() - 7); return d.toISOString().split('T')[0];
  }

  // Number + unit: 45d, 3 months ago, 2 years, 90 days ago, etc.
  const match = s.match(/^(\d+)\s*(d|day|days|m|mo|month|months|y|yr|year|years)\s*(ago)?$/i);
  if (match) {
    const num = parseInt(match[1], 10);
    const unit = match[2].toLowerCase();
    const d = new Date(now);
    if (unit.startsWith('d')) d.setDate(d.getDate() - num);
    else if (unit.startsWith('m')) d.setMonth(d.getMonth() - num);
    else if (unit.startsWith('y')) d.setFullYear(d.getFullYear() - num);
    return d.toISOString().split('T')[0];
  }

  return null;
};

/* ── Date-Aware Risk Engine (smarter regulatory awareness) ──────────────── */
const getDateAwareRisks = (screenedOffenses) => {
  const risks = [];
  const now = Date.now();

  screenedOffenses.forEach(so => {
    const cat = OFFENSE_CATEGORIES.find(c => c.id === so.categoryId);
    if (!cat) return;

    // We can now work with convictionDate even without offenseDate (for regulatory clocks)
    const hasOffenseDate = !!so.offenseDate;
    const hasConvictionDate = !!so.convictionDate;

    if (!hasOffenseDate && !hasConvictionDate) return;

    const offenseDate = hasOffenseDate ? new Date(so.offenseDate) : null;
    const convictionDate = hasConvictionDate ? new Date(so.convictionDate) : null;

    const daysSinceOffense = hasOffenseDate 
      ? Math.floor((now - offenseDate.getTime()) / (1000*60*60*24)) 
      : null;

    const isMajor = cat.group === 'major' || cat.level === 'MAJOR';
    const isSeriousMisc = ['misc_dui', 'misc_dv_non_laut', 'misc_weapons', 'dat_positive'].includes(so.categoryId);

    // === SMART DATE ORDER ANALYSIS (this is the intelligence the user wants) ===
    if (hasOffenseDate && hasConvictionDate) {
      if (convictionDate.getTime() < offenseDate.getTime()) {
        risks.push({
          id: `date_order_${so.id}`,
          severity: 'info',
          title: 'Conviction Date Before Offense Date',
          message: 'You entered a conviction/disposition date that is earlier than the offense date. This is unusual but can happen with certain pleas or nolo contendere dispositions. The app will correctly use the conviction date for all regulatory waiting periods (AR 601-210 4-7). The offense date is still used for "recency of conduct" evaluation under the whole-person concept.',
          cite: 'AR 601-210 4-7 (major misconduct waiting period starts at conviction/final disposition)'
        });
      }
    }

    // === Major misconduct 24-month rule (AR 601-210 4-7) — strictly uses conviction date when available ===
    if (isMajor) {
      const clockDate = convictionDate || offenseDate; // conviction date is the correct regulatory trigger
      if (clockDate) {
        const yearsSinceClock = (now - clockDate.getTime()) / (365.25 * 24 * 3600 * 1000);
        if (yearsSinceClock < 2) {
          const monthsNeeded = Math.ceil(24 - (yearsSinceClock * 12));
          const dateType = convictionDate ? 'conviction' : 'offense (no conviction date entered)';
          const monthsAgo = Math.floor((now - clockDate.getTime()) / (1000*60*60*24 / 30.44));
          
          risks.push({
            id: `major_24month_${so.id}`,
            severity: 'block',
            title: 'Major Misconduct — 24-Month Clock Not Met',
            message: `Using ${dateType} date (~${monthsAgo} months ago). Per AR 601-210 para 4-7, applicants must generally wait 24 months from the date of conviction (or final adverse disposition) before a major misconduct waiver can be processed. Earliest realistic submission: ~${monthsNeeded} months from now.`,
            cite: 'AR 601-210, 4-7a'
          });
        }
      }
    }

    // === Recency of conduct (whole person concept) — always based on when the bad act actually occurred ===
    if (hasOffenseDate) {
      const days = daysSinceOffense;
      const months = Math.floor(days / 30.44);

      if (days < 30) {
        risks.push({
          id: `extremely_recent_${so.id}`,
          severity: 'block',
          title: 'Extremely Recent Conduct (< 30 days)',
          message: `The actual offense happened only ${days} days ago. This is viewed as current behavior. Expect near-certain denial or long delays. This is separate from the formal 24-month clock.`,
          cite: 'AR 601-210 4-2 (whole person concept) + current USAREC practice'
        });
      } else if (days < 90 && (isMajor || isSeriousMisc)) {
        risks.push({
          id: `very_recent_${so.id}`,
          severity: 'high',
          title: 'Very Recent Serious Offense (< 90 days)',
          message: `Offense occurred only ~${months} months ago. Recent serious misconduct is one of the strongest predictors of waiver denial under the whole-person review.`,
          cite: 'AR 601-210 4-2f (suitability review triggers)'
        });
      } else if (days < 180) {
        risks.push({
          id: `recent_${so.id}`,
          severity: 'medium',
          title: 'Recent Offense (under 6 months)',
          message: `Very recent conduct (${months} months ago). This will be a major negative factor. The formal waiting period clock and the "recency" evaluation are two different things.`,
          cite: 'APPROVABILITY_FACTORS + AR 601-210 4-4'
        });
      }
    }
  });

  return risks;
};

/* ── Readiness Ring ─────────────────────────────────────── */
const ReadinessRing = ({ score }) => {
  const R = 15, C = 2*Math.PI*R;
  const offset = C - (score/100)*C;
  const color = score >= 80 ? '#5bc989' : score >= 50 ? 'var(--gold)' : '#ff7070';
  return (
    <div className="readiness-ring" title={`Packet ${score}% ready`}>
      <svg width="36" height="36" viewBox="0 0 36 36">
        <circle className="ring-bg" cx="18" cy="18" r={R}/>
        <circle className="ring-fill" cx="18" cy="18" r={R}
          stroke={color} strokeDasharray={C} strokeDashoffset={offset}/>
      </svg>
      <div className="readiness-pct" style={{color}}>{score}%</div>
    </div>
  );
};

/* ── Phase 1: Multi-Offense Screener ───────────────────── */
const Phase1 = ({ applicant, setApplicant, onHighlight }) => {

  const [addingOffense, setAddingOffense] = useState(false);
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [qStep, setQStep] = useState(0);
  const [tempAnswer, setTempAnswer] = useState(null);
  const [currentAnswers, setCurrentAnswers] = useState({});
  const [offenseDate, setOffenseDate] = useState('');
  const [convictionDate, setConvictionDate] = useState('');
  const [dateOrderConfirmed, setDateOrderConfirmed] = useState(false);

  // Fire ref highlights whenever screener state changes
  useEffect(() => {
    if (!onHighlight) return;
    if (selectedCategory) {
      const catParas = (CAT_PARA_MAP || {})[selectedCategory] || [];
      const qParas = QUALIFYING_QUESTIONS[qStep] ? ((Q_PARA_MAP || {})[QUALIFYING_QUESTIONS[qStep].id] || []) : [];
      onHighlight([...new Set([...catParas, ...qParas])]);
    } else {
      onHighlight([]);
    }
  }, [selectedCategory, qStep]);

  const screenedOffenses = applicant.offenses || [];
  const overallV = computeOverallVerdict(screenedOffenses);
  const auth = computeGoverningAuthority(screenedOffenses);
  const authorityLabels = { BN:'Battalion Commander', USAREC:'Commanding General, USAREC', DMPM:'Deputy Chief of Staff, G-1 (DMPM)', NONE:'Not Applicable — Case Not Waivable' };
  const approv = computeApprovabilityScore(screenedOffenses, applicant);

  const updateOffenses = (offenses) => setApplicant(prev => ({...prev, offenses}));

  const startAdd = () => {
    setSelectedCategory(null); setQStep(0); setCurrentAnswers({}); setTempAnswer(null); setOffenseDate(''); setConvictionDate(''); setDateOrderConfirmed(false);
    setAddingOffense(true);
  };

  const cancelAdd = () => { setAddingOffense(false); setSelectedCategory(null); };

  const selectCategory = (catId) => {
    const cat = OFFENSE_CATEGORIES.find(c => c.id === catId);
    setSelectedCategory(catId);
    if (cat?.bar || cat?.noWaiverRequired) {
      // Immediate verdict
      const verdict = computeVerdictFromAnswers(catId, {});
      finishScreening(catId, {}, verdict);
      return;
    }
    setQStep(0); setCurrentAnswers({}); setTempAnswer(null);
  };

  const submitAnswer = () => {
    if (!tempAnswer) return;
    const q = QUALIFYING_QUESTIONS[qStep];
    const newAnswers = { ...currentAnswers, [q.id]: tempAnswer };
    setCurrentAnswers(newAnswers);
    setTempAnswer(null);

    const v = computeVerdictFromAnswers(selectedCategory, newAnswers);
    const earlyTermIds = ['disposition','pending_charges','civil_restraint','major_count','lautenberg','sex_offender'];
    const isEarlyTerm = earlyTermIds.includes(q.id) && (v?.type === 'NOT_WAIVABLE' || v?.type === 'NO_WAIVER_REQUIRED' || v?.type === 'ETP_REQUIRED');

    if (isEarlyTerm) { finishScreening(selectedCategory, newAnswers, v); return; }

    const next = qStep + 1;
    if (next >= QUALIFYING_QUESTIONS.length) {
      finishScreening(selectedCategory, newAnswers, computeVerdictFromAnswers(selectedCategory, newAnswers));
    } else {
      setQStep(next);
    }
  };

  const finishScreening = (catId, answers, verdict) => {
    const newEntry = {
      id:`so${Date.now()}`, categoryId:catId, answers, verdict,
      offenseDate,
      convictionDate,
      // offense log fields (to be filled later)
      description:'', city:'', county:'', state:'', disposition:'', courtDocs:false, incidentRpt:false,
      waivedOffense: verdict?.type === 'WAIVABLE' || verdict?.type === 'ETP_REQUIRED'
    };
    updateOffenses([...screenedOffenses, newEntry]);
    setAddingOffense(false); setSelectedCategory(null);
  };

  const removeOffense = (id) => updateOffenses(screenedOffenses.filter(so => so.id !== id));

  const updateOffenseField = (id, field, val) => {
    updateOffenses(screenedOffenses.map(so => so.id === id ? {...so, [field]:val} : so));
  };

  // Drag‑and‑drop reordering handlers
  const handleDragStart = (e, id) => {
    e.dataTransfer.setData('text/plain', id);
    // Add visual cue
    e.currentTarget.classList.add('dragging');
  };

  const handleDrop = (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetElem = e.target.closest('.offense-chip');
    const targetId = targetElem?.getAttribute('data-id');
    if (!draggedId || !targetId || draggedId === targetId) return;
    reorderOffenses(draggedId, targetId);
    // Clean up visual cue
    const draggingEl = document.querySelector('.offense-chip.dragging');
    if (draggingEl) draggingEl.classList.remove('dragging');
  };

  const reorderOffenses = (fromId, toId) => {
    const fromIdx = screenedOffenses.findIndex(o => o.id === fromId);
    const toIdx = screenedOffenses.findIndex(o => o.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;
    const newList = [...screenedOffenses];
    const [moved] = newList.splice(fromIdx, 1);
    newList.splice(toIdx, 0, moved);
    updateOffenses(newList);
  };

  const goBackQ = () => {
    if (qStep === 0) { setSelectedCategory(null); return; }
    const prev = qStep - 1;
    const q = QUALIFYING_QUESTIONS[prev];
    setTempAnswer(currentAnswers[q.id]||null);
    const reduced = {...currentAnswers};
    QUALIFYING_QUESTIONS.slice(prev).forEach(qq => delete reduced[qq.id]);
    setCurrentAnswers(reduced);
    setQStep(prev);
  };

  // Date validation for add-offense flow
  const todayStr = today();
  const dobStr = applicant.dob || '';
  const dateErrors = [];
  if (offenseDate) {
    if (offenseDate > todayStr) dateErrors.push('Offense date cannot be in the future.');
    if (dobStr && offenseDate < dobStr) dateErrors.push(`Offense date (${fmtDate(offenseDate)}) is before the applicant's date of birth (${fmtDate(dobStr)}). Verify entry.`);
  }
  if (convictionDate && convictionDate > todayStr) dateErrors.push('Conviction date cannot be in the future.');
  const convictionBeforeOffense = !!(convictionDate && offenseDate && convictionDate < offenseDate);
  const datesBlocking = dateErrors.length > 0 || (convictionBeforeOffense && !dateOrderConfirmed);

  // Inline warning helper for the offense log (saved offenses)
  const getOffenseDateWarnings = (so) => {
    const w = [];
    if (so.offenseDate && so.offenseDate > todayStr) w.push('Offense date is in the future.');
    if (so.convictionDate && so.convictionDate > todayStr) w.push('Conviction date is in the future.');
    if (dobStr && so.offenseDate && so.offenseDate < dobStr) w.push(`Offense date precedes applicant DOB (${fmtDate(dobStr)}).`);
    if (so.offenseDate && so.convictionDate && so.convictionDate < so.offenseDate)
      w.push(`⛔ Likely data entry error: conviction date (${fmtDate(so.convictionDate)}) is before offense date (${fmtDate(so.offenseDate)}).`);
    return w;
  };

  // Group offense categories
  const groups = [
    { key:'bars',    label:'⛔ Absolute Bars (Not Waivable)', color:'#ff5555' },
    { key:'major',   label:'🔴 Major Misconduct (Felony-Level)', color:'#ff6b6b' },
    { key:'misc',    label:'🟡 Misconduct — Miscellaneous', color:'var(--gold)' },
    { key:'traffic', label:'🔵 Traffic Offenses', color:'#7eb8ff' },
    { key:'juvenile',label:'⚪ Juvenile Offenses', color:'var(--fg-m)' },
    { key:'ps',      label:'🪖 Prior Service (PS Applicants)', color:'#cc99ff' },
  ];

  return (
    <div className="main-scroll">
      <div className="fade-up">
        {/* 2026 Marijuana Update Banner */}
        <div className="alert alert-success" style={{marginBottom:14}}>
          <span className="alert-icon">📋</span>
          <div>
            <strong>2026 Update — Marijuana Possession:</strong> Per AR 601-210 para 4-6 (effective ~Apr 2026),
            a <strong>single conviction</strong> for marijuana possession or paraphernalia <strong>no longer requires a waiver</strong>.
            Select "Traffic — Minor" or see para 4-6. Distribution still requires DMPM waiver.
          </div>
        </div>

        {/* Overall Determination */}
        {screenedOffenses.length > 0 && (
          <div style={{marginBottom:14}}>
            <OverallVerdictBanner screenedOffenses={screenedOffenses} auth={auth} authorityLabels={authorityLabels} approv={approv} applicant={applicant}/>
          </div>
        )}

        {/* Screened Offense Stack */}
        {screenedOffenses.length > 0 && (
          <div className="card" style={{marginBottom:14}}>
            <div className="card-hdr">
              <div className="section-bar"/>
              <div style={{flex:1}}>
                <div className="card-title">Screened Offenses</div>
                <div className="card-sub">Each offense has been individually analyzed — overall case uses the highest applicable authority</div>
              </div>
            </div>
            <div className="offense-stack" onDragOver={e=>e.preventDefault()} onDrop={handleDrop} style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {screenedOffenses.map(so => {
                const cat = OFFENSE_CATEGORIES.find(c => c.id === so.categoryId);
                const vt = so.verdict?.type;
                const chipClass = vt==='NOT_WAIVABLE'?'bar':vt==='WAIVABLE'?'waivable':vt==='WAITING_PERIOD'?'waiting':vt==='ETP_REQUIRED'?'etp':vt==='NO_WAIVER_REQUIRED'?'no-waiver':'';
                const cvClass = vt==='NOT_WAIVABLE'?'chip-v-bar':vt==='WAIVABLE'?'chip-v-waivable':vt==='WAITING_PERIOD'?'chip-v-waiting':vt==='ETP_REQUIRED'?'chip-v-etp':vt==='NO_WAIVER_REQUIRED'?'chip-v-no-waiver':'chip-v-unknown';
                const vLabel = {WAIVABLE:'Waivable',NOT_WAIVABLE:'NOT WAIVABLE',NO_WAIVER_REQUIRED:'No Waiver Needed',ETP_REQUIRED:'ETP Required',WAITING_PERIOD:'Wait Period'}[vt]||'Unknown';
                const isProblem = vt === 'NOT_WAIVABLE' || vt === 'WAITING_PERIOD' || vt === 'ETP_REQUIRED';
                return (
                  <div key={so.id} data-id={so.id} className={`offense-chip ${chipClass}`} draggable onDragStart={e=>handleDragStart(e,so.id)}>
                    <span className={`chip-verdict ${cvClass}`}>{vLabel}</span>
                    <div className="chip-label">{cat?.label || so.categoryId}</div>
