/* ── App ─────────────────────────────────────────────────────────────── */
const App = () => {
  const [phase, setPhase] = useState(1);
  const [roster, setRoster] = useState([blankApplicant()]);
  const [activeId, setActiveId] = useState(null);
  const [restore, setRestore] = useState(null);
  const [refOpen, setRefOpen] = useState(false);
  const [refPara, setRefPara] = useState('4-6');
  const [refView, setRefView] = useState('para');
  const [caseOpen, setCaseOpen] = useState(false);
  const [samplesOpen, setSamplesOpen] = useState(false);

  useEffect(() => {
    const saved = loadRoster();
    if (saved?.roster?.length) setRestore(saved);
    else { const a = blankApplicant(); setRoster([a]); setActiveId(a.id); }
  }, []);

  useEffect(() => { if (activeId) saveRoster({ roster, activeId, savedAt:new Date().toISOString() }); }, [roster, activeId]);

  const applicant = roster.find(a => a.id === activeId) || roster[0];
  const setApplicant = (updater) => setRoster(prev => prev.map(a =>
    a.id === activeId ? (typeof updater === 'function' ? updater(a) : {...a, ...updater}) : a));

  const verdict = applicant ? computeCaseVerdict(applicant) : null;
  const banner = bannerFor(verdict);
  const approv = applicant ? computeApprovabilityScore(applicant, verdict) : null;

  const clStatus = applicant?.checklistStatus || {};
  const expDates = applicant?.expDates || {};
  const setClStatus = (u) => setApplicant(prev => ({...prev, checklistStatus: typeof u === 'function' ? u(prev.checklistStatus||{}) : u}));
  const setExpDates = (u) => setApplicant(prev => ({...prev, expDates: typeof u === 'function' ? u(prev.expDates||{}) : u}));

  const requiredItems = getRequiredChecklist(verdict?.authority || 'BN', offenseFlags(applicant?.offenses||[]));
  const doneCount = requiredItems.filter(i => clStatus[i.id] === 'complete').length;

  const openRef = (para) => { setRefPara(resolvePara(para)); setRefView('para'); setRefOpen(true); };
  const openTables = () => { setRefView('tables'); setRefOpen(true); };

  const addApplicant = () => { const a = blankApplicant(); setRoster(p => [...p, a]); setActiveId(a.id); setPhase(1); };

  const removeApplicant = (id) => {
    const a = roster.find(x => x.id === id);
    const name = [a?.firstName, a?.lastName].filter(Boolean).join(' ') || 'this applicant';
    if (!window.confirm(`Remove ${name}? This permanently deletes their screening and checklist progress.`)) return;
    setRoster(prev => {
      const next = prev.filter(x => x.id !== id);
      if (!next.length) { const fresh = blankApplicant(); setActiveId(fresh.id); return [fresh]; }
      if (id === activeId) setActiveId(next[0].id);
      return next;
    });
  };

  const clearAll = () => {
    if (!window.confirm('Clear ALL saved applicants from this computer? This cannot be undone.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    const a = blankApplicant(); setRoster([a]); setActiveId(a.id); setPhase(1); setCaseOpen(false);
  };

  const loadSample = (s) => {
    const a = blankApplicant();
    Object.assign(a, JSON.parse(JSON.stringify(s.applicant)));
    a.id = `a${Date.now()}${Math.floor(Math.random()*1e4)}`;
    a.caseAnswers = { ...s.caseAnswers };
    a.offenses = s.offenses.map(o => ({ ...o, id:`${o.id}_${Date.now()}` }));
    setRoster(p => [...p, a]); setActiveId(a.id); setPhase(1);
  };

  if (restore) {
    return (
      <div className="frame">
        <div className="scrim" style={{position:'fixed',justifyContent:'center',alignItems:'center'}}>
          <div style={{background:'var(--s4)',border:'1px solid var(--hair)',borderTop:'2px solid var(--gold)',
            padding:28,maxWidth:380,width:'100%',margin:16}}>
            <div className="drawer-title" style={{marginBottom:10}}>Resume previous session?</div>
            <div style={{fontSize:20,fontWeight:700,color:'var(--gold)'}}>
              {restore.roster[0]?.firstName||''} {restore.roster[0]?.lastName||'Unnamed'}
            </div>
            <div style={{fontSize:12,color:'var(--t3)',margin:'6px 0 20px'}}>
              {restore.roster.length} applicant{restore.roster.length===1?'':'s'} · last saved {restore.savedAt ? new Date(restore.savedAt).toLocaleString() : 'unknown'}
            </div>
            <div className="outbtns">
              <button className="btn-gold" onClick={()=>{ setRoster(restore.roster); setActiveId(restore.activeId||restore.roster[0]?.id); setRestore(null); }}>Resume</button>
              <button className="btn-line" onClick={()=>{ const a = blankApplicant(); setRoster([a]); setActiveId(a.id); setRestore(null); }}>Start fresh</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (!applicant) return null;

  const applName = [applicant.lastName ? applicant.lastName.toUpperCase()+',' : '', applicant.firstName, applicant.mi ? applicant.mi+'.' : '']
    .filter(Boolean).join(' ') || 'NEW APPLICANT';
  const caseLine = [
    applicant.rsid ? `Case ${applicant.rsid}` : 'Case — no RSID',
    applName,
    applicant.psNps || 'PS/NPS not set',
  ].join(' · ');

  const phases = [
    { n:1, title:'Screen', sub:'Gates and offense record' },
    { n:2, title:'Build packet', sub:`${doneCount} of ${requiredItems.length} documents on file` },
    { n:3, title:'Generate', sub:'Waiver memo and forms' },
  ];

  return (
    <div className="frame">
      <div className="topbar">
        <div className="brand">
          <div className="brand-chip">★</div>
          <div className="brand-word">Moral Waiver</div>
        </div>
        <div className="topbar-div"/>
        <button className="appl-switch" onClick={()=>setCaseOpen(true)} title="Open case file">
          <span className="appl-switch-name">{applName}</span>
          <span className="appl-switch-meta">4D5E · {applicant.psNps || 'NPS'}</span>
          <span className="appl-switch-caret">▾</span>
        </button>
        <div className="spacer"/>
        <div className="reg-stamp">AR 601-210 · 20 Mar 2026</div>
        <div style={{position:'relative'}}>
          <button className="btn-ghost" onClick={()=>setSamplesOpen(v=>!v)}>Samples</button>
          {samplesOpen && <SampleMenu onLoad={loadSample} onClose={()=>setSamplesOpen(false)}/>}
        </div>
        <button className="btn-ghost" onClick={openTables} title="AR 601-210 Chapter 4 offense code tables">Offense chart</button>
        <button className="btn-ghost-gold" onClick={()=>openRef(banner.cite)}>Reference</button>
      </div>

      <div className="verdict" style={{borderBottomColor:banner.accent}}>
        <div className="verdict-top">
          <div className="verdict-micro">{caseLine}</div>
          <div className="spacer"/>
          <div className="verdict-micro">{banner.tag}</div>
        </div>
        <div className="verdict-title" style={{color:banner.accent}}>{banner.title}</div>
        <div className="verdict-row">
          <div className="verdict-auth" style={{background:banner.authBg,color:banner.authFg}}>{banner.authority}</div>
          <div className="verdict-body">{banner.body}</div>
          <div className="spacer"/>
          <button className="cite" onClick={()=>openRef(banner.cite)}>{resolvePara(banner.cite)}</button>
        </div>
      </div>

      <div className="phases">
        {phases.map(p => (
          <button key={p.n} className={`phase${phase===p.n?' on':''}`} onClick={()=>setPhase(p.n)}>
            <div className="phase-num">{p.n}</div>
            <div>
              <div className="phase-title">{p.title}</div>
              <div className="phase-sub">{p.sub}</div>
            </div>
          </button>
        ))}
      </div>

      <div className="body">
        <div className="content">
          {phase === 1 && <PhaseScreen applicant={applicant} setApplicant={setApplicant} verdict={verdict} openRef={openRef} openTables={openTables}/>}
          {phase === 2 && <PhasePacket applicant={applicant} requiredItems={requiredItems}
            clStatus={clStatus} setClStatus={setClStatus} expDates={expDates} setExpDates={setExpDates}/>}
          {phase === 3 && <PhaseGenerate applicant={applicant} verdict={verdict}
            clStatus={clStatus} requiredItems={requiredItems}/>}
        </div>
        <Rail applicant={applicant} verdict={verdict} banner={banner} approv={approv}
          clStatus={clStatus} expDates={expDates}/>
      </div>

      {refOpen && <RefDrawer para={refPara} setPara={setRefPara} view={refView} setView={setRefView}
        onClose={()=>setRefOpen(false)}/>}
      {caseOpen && <CaseFileDrawer roster={roster} activeId={activeId} applicant={applicant}
        setApplicant={setApplicant} onSwitch={id=>setActiveId(id)} onAdd={addApplicant}
        onRemove={removeApplicant} onClear={clearAll} onClose={()=>setCaseOpen(false)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
