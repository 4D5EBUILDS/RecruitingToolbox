          <div style={{background:'rgba(0,0,0,0.3)',padding:'12px 16px',borderRadius:6,marginBottom:10}}>
            <div style={{fontWeight:700,color:'#ff8888',marginBottom:6,fontSize:12,letterSpacing:'.06em'}}>PERMANENT BARS:</div>
            {permBars.map((b,i)=>(
              <div key={i} style={{marginBottom:6,fontSize:13}}>• <strong>{b.title}</strong> — {b.text} <span style={{opacity:.6}}>({b.cite})</span></div>
            ))}
          </div>
        )}
        {tempBars.length > 0 && (
          <div style={{background:'rgba(0,0,0,0.25)',padding:'12px 16px',borderRadius:6}}>
            <div style={{fontWeight:700,color:'#ffb84d',marginBottom:6,fontSize:12,letterSpacing:'.06em'}}>MUST BE RESOLVED BEFORE PROCESSING:</div>
            {tempBars.map((b,i)=>(
              <div key={i} style={{marginBottom:6,fontSize:13}}>• <strong>{b.title}</strong> — {b.text} <span style={{opacity:.6}}>({b.cite})</span></div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const configs = {
    WAIVABLE:           { cls:'verdict-WAIVABLE',           tag:'Waivable',        icon:'✅', title:`Waivable — ${AUTH_FULL[verdict.authority]||''}` },
    WAITING_PERIOD:     { cls:'verdict-WAITING_PERIOD',     tag:'Waiting Period',  icon:'⏳', title:'Waivable — Mandatory Waiting Period Not Met' },
    ETP_REQUIRED:       { cls:'verdict-ETP_REQUIRED',       tag:'Verify First',    icon:'⚠️', title:'Self-Admitted Offense — Court Check / ETP Required' },
    NO_WAIVER_REQUIRED: { cls:'verdict-NO_WAIVER_REQUIRED', tag:'No Waiver Needed',icon:'✔️', title:'No Waiver Required' },
  };
  const cfg = configs[st] || { cls:'', tag:'', icon:'•', title:'Pending' };

  return (
    <div className={`card verdict-card ${cfg.cls}`} style={{padding:'18px 20px'}}>
      <div className="verdict-tag">{cfg.icon} {cfg.tag}</div>
      <div className="verdict-title" style={{fontSize:18}}>{cfg.title}</div>

      {/* Why a waiver is (or isn't) required */}
      {verdict.waivers.length > 0 && (
        <div style={{margin:'8px 0'}}>
          {verdict.waivers.map((w,i)=>(
            <div key={i} style={{fontSize:12,color:'var(--fg2)',padding:'3px 0'}}>
              • {w.label} <span style={{color:'var(--fg-m)',fontSize:10}}>(4-{w.cite.replace(/^4-/,'')} · {w.authority === 'USARD' ? 'CG USARD' : 'BN CO'})</span>
            </div>
          ))}
        </div>
      )}

      {(st === 'WAIVABLE' || st === 'WAITING_PERIOD') && verdict.authority && (
        <div style={{display:'flex',flexWrap:'wrap',gap:10,marginTop:6,alignItems:'center'}}>
          <div className="authority-badge"><IcoShield/> {AUTH_FULL[verdict.authority]}</div>
          <div style={{fontSize:11,color:'var(--fg-m)'}}>Waiver valid <strong style={{color:'var(--fg2)'}}>6 months</strong> from approval · AR 601-210, 4-27</div>
        </div>
      )}

      {/* Waiting period countdown */}
      {verdict.waits.length > 0 && (
        <div style={{marginTop:12,border:'1px solid rgba(176,120,0,.4)',background:'rgba(176,120,0,.07)',padding:'14px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <span style={{fontSize:16}}>⏳</span>
            <span style={{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#ffb84d'}}>Waiting Periods</span>
          </div>
          {verdict.waits.map(w => (
            <div key={w.id} style={{padding:'8px 0',borderTop:'1px solid rgba(176,120,0,.2)'}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--fg2)',marginBottom:3}}>{w.label}</div>
              {w.needDate ? (
                <div style={{fontSize:11,color:'#ffcc66'}}>Enter the required date on this offense (Edit) to calculate the earliest submission date.</div>
              ) : (
                <div style={{fontSize:11,color:'var(--fg2)'}}>
                  <strong style={{color:'#ffb84d',fontSize:13}}>{w.daysLeft} days remaining</strong> · earliest submission <strong>{fmtD(w.earliest)}</strong>
                  <div style={{fontSize:10,color:'var(--fg-m)',marginTop:2}}>Clock from {fmtDate(w.from)} · AR 601-210, {w.cite}{w.note ? ` · ${w.note}` : ''}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Suitability reviews required */}
      {verdict.suitability.length > 0 && (
        <div style={{marginTop:12,border:'1px solid rgba(26,95,168,.35)',background:'rgba(26,95,168,.06)',padding:'12px 16px'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#5b9fd4',marginBottom:6}}>Suitability Review Required (before MEPS projection — 4-2f)</div>
          {verdict.suitability.map((s,i)=>(
            <div key={i} style={{fontSize:11,color:'var(--fg2)',padding:'2px 0'}}>
              • {s.label} — <strong>{s.level === 'USARD' ? 'CG USARD' : 'BN CO'} review</strong> <span style={{color:'var(--fg-m)',fontSize:10}}>({s.cite})</span>
            </div>
          ))}
        </div>
      )}

      {/* Notes */}
      {verdict.notes.length > 0 && (
        <div style={{marginTop:12}}>
          {verdict.notes.map((n,i)=>(
            <div key={i} style={{fontSize:11,color:'var(--fg-m)',padding:'3px 0',lineHeight:1.5}}>
              ℹ️ {n.label} <span style={{opacity:.7,fontSize:10}}>({n.cite})</span>
            </div>
          ))}
        </div>
      )}

      {/* Unofficial approval-odds estimate — collapsed by default */}
      {approv && st === 'WAIVABLE' && (
        <div style={{marginTop:12}}>
          <button style={{fontSize:10,color:'var(--fg-m)',background:'none',border:'1px solid var(--bd)',cursor:'pointer',padding:'4px 10px'}} onClick={()=>setShowMeter(v=>!v)}>
            {showMeter ? '▲ Hide' : '▼ Show'} unofficial approval-odds estimate
          </button>
          {showMeter && (
            <div className="approval-meter">
              <div className="approval-hdr">
                <div className="approval-label"><IcoGauge/> Unofficial Estimate</div>
                <div className="approval-score" style={{color: approv.score >= 70 ? '#5bc989' : approv.score >= 45 ? 'var(--gold)' : '#ff7070'}}>{approv.score}</div>
              </div>
              <div className="approval-bar-bg"><div className="approval-bar-fill" style={{width:`${approv.score}%`,background: approv.score >= 70 ? '#5bc989' : approv.score >= 45 ? 'var(--gold)' : '#ff7070'}}/></div>
              <div className="approval-factors">
                {approv.factors.map((f,i)=>(
                  <div key={i} className="approval-factor">
                    <span className={f.mod > 0 ? 'factor-up' : 'factor-down'}>{f.mod > 0 ? '+' : ''}{f.mod}</span>
                    <span>{f.label}</span>
                  </div>
                ))}
              </div>
              <div className="approval-disclaimer">NOT from regulation — heuristic estimate only. Actual outcome depends on the commander interview, applicant statement, and command climate. Do not share with the applicant.</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

/* ── Phase 2: Applicant Info ────────────────────────────── */
const Phase2 = ({ applicant, setApplicant }) => {
  const setAppl = (k,v) => setApplicant(prev => ({...prev, [k]:v}));

  return (
    <div className="main-scroll">
      <div className="fade-up">
        {/* Applicant Info */}
        <div className="card">
          <div className="card-hdr"><div className="section-bar"/><div><div className="card-title">Applicant Information</div></div></div>
          <div className="form-grid-3" style={{marginBottom:10}}>
            {[['lastName','Last Name'],['firstName','First Name'],['mi','MI']].map(([k,l])=>(
              <div key={k} className="form-field">
                <label className="form-label">{l}</label>
                <input className="form-input" value={applicant[k]||''} onChange={e=>setAppl(k,e.target.value)} placeholder={l}/>
              </div>
            ))}
          </div>
          <div className="form-grid-3" style={{marginBottom:10}}>
            <div className="form-field">
              <label className="form-label">SSN — Last 4 Only</label>
              <input className="form-input" value={applicant.ssn||''} onChange={e=>setAppl('ssn',e.target.value.replace(/\D/g,'').slice(-4))} placeholder="1234" maxLength={4}/>
              <div style={{fontSize:9,color:'var(--fg-m)',marginTop:2}}>Full SSN is never stored in this tool — documents print last 4 only</div>
            </div>
            <div className="form-field">
              <label className="form-label">Date of Birth</label>
              <input className="form-input" type="date" value={applicant.dob||''} onChange={e=>setAppl('dob',e.target.value)}/>
            </div>
            <div className="form-field">
              <label className="form-label">RSID</label>
              <input className="form-input" value={applicant.rsid||''} onChange={e=>setAppl('rsid',e.target.value)} placeholder="RSID"/>
            </div>
          </div>
          <div className="form-grid-4" style={{marginBottom:10}}>
            <div className="form-field">
              <label className="form-label">Education Level</label>
              <select className="form-input" value={applicant.educationLevel||''} onChange={e=>setAppl('educationLevel',e.target.value)}>
                <option value="">Select...</option>
                {ED_LEVELS.map(l=><option key={l} value={l}>{l}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label className="form-label">Ed Code</label>
              <input className="form-input" value={applicant.educationCode||''} onChange={e=>setAppl('educationCode',e.target.value)} placeholder="e.g. 2A"/>
            </div>
            <div className="form-field">
              <label className="form-label">AFQT Score</label>
              <input className="form-input" value={applicant.afqt||''} onChange={e=>setAppl('afqt',e.target.value)} placeholder="0–99"/>
            </div>
            <div className="form-field">
              <label className="form-label">PS / NPS</label>
              <select className="form-input" value={applicant.psNps||''} onChange={e=>setAppl('psNps',e.target.value)}>
                <option value="">Select...</option>
                <option value="NPS">NPS — Non-Prior Service</option>
                <option value="PS">PS — Prior Service</option>
              </select>
            </div>
          </div>
          <div className="form-grid-4">
            <div className="form-field">
              <label className="form-label">Marital Status</label>
              <select className="form-input" value={applicant.maritalStatus||''} onChange={e=>setAppl('maritalStatus',e.target.value)}>
                <option value="">Select...</option>
                {['Single','Married','Divorced','Widowed','Separated'].map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label className="form-label"># of Dependents</label>
              <input className="form-input" type="number" min="0" max="20" value={applicant.numDependents||''} onChange={e=>setAppl('numDependents',e.target.value)} placeholder="0"/>
            </div>
            <div className="form-field" style={{gridColumn:'span 2'}}>
              <label className="form-label">Dependent Ages</label>
              <input className="form-input" value={applicant.dependentAges||''} onChange={e=>setAppl('dependentAges',e.target.value)} placeholder="e.g. 3, 7, 12"/>
            </div>
          </div>
        </div>

        {/* MOS Check */}
        <div className="card" style={{marginTop:14}}>
          <div className="card-hdr"><div className="section-bar"/><div><div className="card-title"><IcoMOS/> MOS Compatibility Check</div><div className="card-sub">ADVISORY ONLY — not sourced from AR 601-210. Always verify with the MOS career manager and DA PAM 611-21</div></div></div>
          <MOSChecker applicant={applicant} setAppl={setAppl}/>
        </div>

        {/* Recruiter Info */}
        <div className="card" style={{marginTop:14}}>
          <div className="card-hdr"><div className="section-bar"/><div className="card-title">Recruiter / Unit Info</div></div>
          <div className="form-field" style={{marginBottom:10}}>
            <label className="form-label">Unit Designation</label>
            <input className="form-input" value={applicant.recruiterUnit||''} onChange={e=>setAppl('recruiterUnit',e.target.value)} placeholder="e.g. U.S. ARMY GRAND ISLAND DETACHMENT, DENVER RECRUITING BATTALION"/>
          </div>
          <div className="form-field" style={{marginBottom:10}}>
            <label className="form-label">Unit Address</label>
            <input className="form-input" value={applicant.recruiterAddress||''} onChange={e=>setAppl('recruiterAddress',e.target.value)} placeholder="Full street address, city, state, ZIP"/>
          </div>
          <div className="form-grid-3">
            <div className="form-field">
              <label className="form-label">Office Symbol (RSID)</label>
              <input className="form-input" value={applicant.recruiterOfficeSym||''} onChange={e=>setAppl('recruiterOfficeSym',e.target.value)} placeholder="e.g. RCSW-DEN-GI"/>
            </div>
            <div className="form-field">
              <label className="form-label">Recruiter Name</label>
              <input className="form-input" value={applicant.recruiterName||''} onChange={e=>setAppl('recruiterName',e.target.value)} placeholder="Last, First MI"/>
            </div>
            <div className="form-field">
              <label className="form-label">Rank / Branch</label>
              <input className="form-input" value={applicant.recruiterRank||''} onChange={e=>setAppl('recruiterRank',e.target.value)} placeholder="e.g. SSG, USA"/>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ── MOS Checker ────────────────────────────────────────── */
const MOSChecker = ({ applicant, setAppl }) => {
  const [search, setSearch] = useState(applicant.mosCode||'');
  const [result, setResult] = useState(null);

  const checkMOS = () => {
    const code = search.trim().toUpperCase();
    setAppl('mosCode', code);
    const match = MOS_RESTRICTIONS.find(g => g.mos.includes(code));
    if (!match) { setResult({ notFound:true, code }); }
    else { setResult({ group:match, code }); }
  };

  return (
    <div>
      <div className="row" style={{gap:8,marginBottom:12}}>
        <input className="form-input" style={{maxWidth:140}} value={search} onChange={e=>setSearch(e.target.value.toUpperCase())}
          onKeyDown={e=>e.key==='Enter'&&checkMOS()} placeholder="MOS code (e.g. 11B)"/>
        <button className="btn btn-outline btn-sm" onClick={checkMOS}>Check MOS</button>
        {result && <button className="btn btn-outline btn-sm" onClick={()=>{setResult(null);setSearch('');setAppl('mosCode','');}}>Clear</button>}
      </div>
      {result && (
        result.notFound ? (
          <div className="mos-result low">
            <div className="mos-result-label">✅ No specific restrictions found for {result.code}</div>
            <div style={{fontSize:11,color:'var(--fg-m)'}}>
              This MOS is not in the high-restriction list. Standard waiver rules apply.
              Always verify with the MOS-specific career manager and AR 601-210.
            </div>
          </div>
        ) : (
          <div className={`mos-result ${result.group.severity}`}>
            <div className="mos-result-label">
              {result.group.severity==='high'?'⚠️ HIGH RESTRICTION':result.group.severity==='medium'?'⚠️ MODERATE RESTRICTION':'ℹ️ LOW RESTRICTION'} — {result.group.label}
            </div>
            <div style={{fontSize:11,color:'var(--fg2)',marginBottom:8,lineHeight:1.5}}>{result.group.notes}</div>
            {result.group.restrictions.map((r,i) => (
              <div key={i} className="mos-restriction">
                <span style={{color:result.group.severity==='high'?'#ff6b6b':'var(--gold)',fontSize:12}}>⚠</span>
                <span style={{fontSize:11}}>{r}</span>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
};

/* ── Phase 3: Build Packet ──────────────────────────────── */
const Phase3 = ({ applicant, setApplicant }) => {
  const [clStatus, setClStatus] = useState(applicant.checklistStatus||{});
  const [expDates, setExpDates] = useState(applicant.expDates||{});
  const [expandedItems, setExpandedItems] = useState({});
  const [activeDoc, setActiveDoc] = useState(null);

  const screenedOffenses = applicant.offenses || [];
  const verdict = computeCaseVerdict(applicant);
  const authority = verdict?.authority || 'BN';
  const waivedIds = verdict?.waivedIds || [];
  const flags = offenseFlags(screenedOffenses);
  const requiredItems = getRequiredChecklist(authority, flags);
  const expiringItems = requiredItems.filter(i => i.validity);
  const statusCycle = s => s==='pending'?'progress':s==='progress'?'complete':'pending';

  // Sync clStatus/expDates back to applicant
  useEffect(() => { setApplicant(prev => ({...prev, checklistStatus:clStatus})); }, [clStatus]);
  useEffect(() => { setApplicant(prev => ({...prev, expDates})); }, [expDates]);
  useEffect(() => { setClStatus(applicant.checklistStatus||{}); setExpDates(applicant.expDates||{}); }, [applicant.id]);

  const toggleExpand = (id) => setExpandedItems(prev => ({...prev, [id]:!prev[id]}));
  const copyToClipboard = (text) => { navigator.clipboard.writeText(text).catch(() => {}); };
  const toggleCheck = (id) => setClStatus(prev => ({...prev, [id]: prev[id]==='complete'?'pending':'complete'}));
  const cycleStatus = (id) => setClStatus(prev => ({...prev, [id]: statusCycle(prev[id]||'pending')}));

  const fullName = [applicant.firstName, applicant.mi?applicant.mi+'.':'', applicant.lastName].filter(Boolean).join(' ');
  const ssnLast4 = (applicant.ssn||'').slice(-4)||'XXXX';
  const authorityFull = { BN:'Battalion Commander', USARD:'Commanding General, U.S. Army Recruiting Division (USARD)' };
  const authorityMemo = { BN:'Battalion Commander', USARD:'CG, USARD' };
  const authorityShort = authorityFull[authority]||authority;
  const offenseList = sortNewest(screenedOffenses.filter(so=>so.offenseDate||so.description));
  const isWaived = o => waivedIds.includes(o.id);
  const completedCount = requiredItems.filter(i => clStatus[i.id]==='complete').length;
  const { score: readiness } = computeReadiness(applicant, verdict, clStatus);

  // Common rejection warnings
  const warnings = [];
  if (!applicant.afqt) warnings.push('AFQT score not entered — required for UF 601-210.08');
  if (expiringItems.some(i => { const d = daysUntilExpiry(expDates[i.id], i.validity); return d !== null && d < 0; })) warnings.push('One or more documents have EXPIRED — renew before submission');
  if (!applicant.rsid) warnings.push('RSID not entered — required for routing memo');
  if ((verdict?.waivers?.length > 0) && !offenseList.some(so=>so.description)) warnings.push('Offense descriptions not filled in — needed for document generation');

  /* Document generators */
  const genCoverSheet = () => {
    const lines = [];
    lines.push(`MORAL WAIVER PACKET — COVER SHEET`);
    lines.push(`${'─'.repeat(60)}`);
    lines.push(`Applicant:         ${fullName || '[Name]'}`);
    lines.push(`SSN (Last 4):      XXXX-XX-${ssnLast4}`);
    lines.push(`Date of Birth:     ${fmtDate(applicant.dob)}`);
    lines.push(`RSID:              ${applicant.rsid||'[RSID]'}`);
    lines.push(`PS/NPS:            ${applicant.psNps||'[PS/NPS]'}`);
    lines.push(`Marital Status:    ${applicant.maritalStatus||'[Marital Status]'}`);
    lines.push(`# Dependents:      ${applicant.numDependents||'0'}`);
    if (applicant.dependentAges) lines.push(`Dependent Ages:    ${applicant.dependentAges}`);
    lines.push(`Education:         ${applicant.educationLevel||'[Ed Level]'}${applicant.educationCode?' (Code: '+applicant.educationCode+')':''}`);
    lines.push(`AFQT Score:        ${applicant.afqt||'[Score]'}`);
    lines.push(`Approving Auth:    ${authorityShort}`);
    if (applicant.mosCode) lines.push(`Target MOS:        ${applicant.mosCode}`);
    lines.push(`Date Prepared:     ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}`);
    lines.push(`Reg Basis:         AR 601-210, Chapter 4`);
    lines.push(``);
    lines.push(`OFFENSES (NEWEST TO OLDEST)`);
    lines.push(`${'─'.repeat(60)}`);
    offenseList.forEach((o,i)=>{
      const cat = OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId);
      lines.push(`${i+1}. ${isWaived(o)?'★ ':''}${fmtDate(o.offenseDate)} — ${o.description||cat?.label||'[Description]'}`);
      if (o.city||o.county||o.state) lines.push(`   Location: ${[o.city,o.county,o.state].filter(Boolean).join(', ')}`);
      if (o.dispositionText) lines.push(`   Disposition: ${o.dispositionText}`);
    });
    lines.push(``);
    lines.push(`DOCUMENT STATUS`);
    lines.push(`${'─'.repeat(60)}`);
    requiredItems.forEach(item=>{
      const status = clStatus[item.id]||'pending';
      const mark = status==='complete'?'[X]':status==='progress'?'[~]':'[ ]';
      lines.push(`${mark} ${item.label}${item.note?'  NOTE: '+item.note:''}`);
    });
    lines.push(``);
    lines.push(`★ = Offense being waived`);
    lines.push(`Waiver valid 6 months from approval date · AR 601-210, para 4-27`);
    lines.push(`Eligibility basis: ${REG_VERSION}`);
    return lines.join('\n');
  };

  const genStatement = () => {
    const primaryOffense = offenseList.find(isWaived) || offenseList[0];
    const cat = primaryOffense ? OFFENSE_CATEGORIES.find(c=>c.id === primaryOffense.categoryId) : null;
    const isDUI = cat?.id?.includes('dui');
    const isDrug = cat?.id?.includes('marijuana')||cat?.id?.includes('drug');
    const isViolent = cat?.id?.includes('violent')||cat?.id?.includes('assault');
    let guidanceSection = `[APPLICANT FILLS IN — Explain the situation, context, and all contributing factors. Be honest and specific.]`;
    if (isDUI) guidanceSection = `[APPLICANT: Explain what led to the DUI — where were you, what were you drinking, what decision you made, and why. Be specific about circumstances. Do not minimize.]`;
    if (isDrug) guidanceSection = `[APPLICANT: Explain the circumstances of the drug offense — peer pressure, personal struggle, specific event. Be honest.]`;
    if (isViolent) guidanceSection = `[APPLICANT: Explain the full context — what happened before the incident, what your role was, whether there was provocation. Be honest about your actions.]`;
    const lines = [];
    lines.push(`MEMORANDUM FOR ${authorityMemo[authority]||authorityShort}`);
    lines.push(`SUBJECT: Applicant Statement in Support of Moral Waiver`);
    lines.push(``);
    lines.push(`1. I, ${fullName||'[APPLICANT NAME]'}, am requesting a moral waiver for the following offense(s):`);
    lines.push(``);
    offenseList.filter(isWaived).forEach((o,i)=>{
      const letter = String.fromCharCode(97+i);
      const cat2 = OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId);
      lines.push(`   ${letter}. ${fmtDate(o.offenseDate)} — ${o.description||cat2?.label||'[Offense Description]'}`);
      if (o.dispositionText) lines.push(`      Disposition: ${o.dispositionText}`);
    });
    lines.push(``);
    lines.push(`2. The circumstances surrounding the offense(s) are as follows:`);
    lines.push(`   ${guidanceSection}`);
    lines.push(``);
    lines.push(`3. Since the offense(s), I have taken the following steps to demonstrate growth and rehabilitation:`);
    lines.push(`   [APPLICANT: List SPECIFIC actions — continued education, steady employment, counseling/treatment, community service, volunteer work, mentorship, sobriety, etc. Vague answers weaken the packet.]`);
    lines.push(``);
    lines.push(`4. I am requesting this waiver because:`);
    lines.push(`   [APPLICANT: Explain your genuine motivation to serve — values, family, career, sense of duty. Connect your personal growth to Army Values.]`);
    lines.push(``);
    lines.push(`5. I acknowledge that the offense(s) above reflect poor judgment. I have learned from this experience and am committed to upholding the standards of the United States Army.`);
    lines.push(``);
    lines.push(`6. I certify that all information in this statement is true and accurate to the best of my knowledge.`);
    lines.push(``);
    lines.push(`__________________________________        ____________________`);
    lines.push(`${fullName||'[APPLICANT NAME]'}                   Date`);
    return lines.join('\n');
  };

  const genMFR = () => {
    const unit   = applicant.recruiterUnit    || '[UNIT DESIGNATION]';
    const addr   = applicant.recruiterAddress || '[UNIT ADDRESS]';
    const sym    = applicant.recruiterOfficeSym || applicant.rsid || '[OFFICE SYM]';
    const dateStr = new Date().toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
    const recName = applicant.recruiterName || '[RECRUITER NAME]';
    const recRank = applicant.recruiterRank || '[RANK, BRANCH]';
    const authTo  = authorityMemo[authority]||authorityShort;
    const offList = offenseList.map((o,i) => {
      const cat = OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId);
      const letter = String.fromCharCode(97+i);
      return `  <div class="para" style="margin-left:36pt;">${letter}.&nbsp;&nbsp;${fmtDate(o.offenseDate)} &#8211; ${o.description||cat?.label||'[Offense]'}. Disposition: ${o.dispositionText||'[Disposition]'}.</div>`;
    }).join('\n');
    return `<!DOCTYPE html><html><head><title>CO Interview MFR — ${fullName||'Applicant'}</title>
<style>
  body{font-family:"Times New Roman",serif;font-size:12pt;color:#000;margin:0;padding:0}
  @page{size:letter;margin:1in}
  @media screen{body{max-width:7.5in;margin:.5in auto;padding:.5in}}
  .lhd-unit{font-family:Arial,sans-serif;font-weight:bold;font-size:10pt;text-align:center;text-transform:uppercase;line-height:1.4}
  .lhd-dept{font-family:Arial,sans-serif;font-weight:bold;font-size:9pt;text-align:center;letter-spacing:.05em;margin-bottom:2pt}
  .lhd-addr{font-family:Arial,sans-serif;font-size:9pt;text-align:center;font-weight:normal}
  .lhd-rule{border:none;border-top:1.5pt solid #000;margin:6pt 0 4pt}
  .sym-date{display:flex;justify-content:space-between;font-family:Arial,sans-serif;font-size:10pt;margin-bottom:18pt}
  .sym-label{font-size:8pt;font-style:italic;color:#333}
  .body-block{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5}
  .para{margin-bottom:10pt}
  .sig-block{margin-top:36pt}
  .sig-line{border-bottom:1pt solid #000;width:3.5in}
  .fill-blank{border-bottom:1pt solid #555;display:inline-block;min-width:1.8in}
</style></head><body>
<div class="lhd-dept">DEPARTMENT OF THE ARMY</div>
<div class="lhd-unit">${unit}</div>
<div class="lhd-addr">${addr}</div>
<hr class="lhd-rule"/>
<div class="sym-date">
  <div><div class="sym-label">REPLY TO<br>ATTENTION OF</div><div style="font-family:Arial;font-size:10pt;font-weight:bold">${sym}</div></div>
  <div style="text-align:right;font-family:Arial;font-size:10pt">${dateStr}</div>
</div>
<div class="body-block">
  <div class="para">MEMORANDUM FOR ${authTo}</div>
  <div class="para">SUBJECT: Company Commander&#39;s Interview &#8211; ${fullName||'[APPLICANT NAME]'}, Moral Waiver</div>
  <div class="para">1.&nbsp;&nbsp;On <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>, I personally interviewed <strong>${fullName||'[APPLICANT NAME]'}</strong> regarding the following offense(s) requiring a moral waiver:</div>
${offList}
  <div class="para">2.&nbsp;&nbsp;During the interview, ${applicant.firstName||'the applicant'} demonstrated <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>. The applicant&#39;s explanation of the circumstances surrounding the offense(s) was <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.</div>
  <div class="para">3.&nbsp;&nbsp;Based on my interview, I assess ${applicant.firstName||'the applicant'} to be <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> and believe the offense(s) to be <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> of the applicant&#39;s overall character.</div>
  <div class="para">4.&nbsp;&nbsp;Recommendation:</div>
  <div class="para" style="margin-left:36pt;">&#9633;&nbsp;&nbsp;<strong>APPROVE</strong> the moral waiver request.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#9633;&nbsp;&nbsp;<strong>DISAPPROVE</strong> the moral waiver request.</div>
  <div class="para" style="margin-left:36pt;">Justification: <span class="fill-blank" style="min-width:3.5in">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
  <div class="para">5.&nbsp;&nbsp;The point of contact for this memorandum is the undersigned at <span class="fill-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.</div>
  <div class="sig-block">
    <div style="margin-bottom:42pt">&nbsp;</div>
    <div class="sig-line">&nbsp;</div>
    <div style="font-family:Arial;font-size:10pt;font-weight:bold">[CO RANK, NAME]</div>
    <div style="font-family:Arial;font-size:10pt">[BRANCH], USA</div>
    <div style="font-family:Arial;font-size:10pt">Commanding</div>
  </div>
</div></body></html>`;
  };

  const genRouting = () => {
    const lines = [];
    lines.push(`MEMORANDUM FOR Battalion S1`);
    lines.push(`SUBJECT: Moral Waiver Packet Submission — ${fullName||'[APPLICANT NAME]'}`);
    lines.push(``);
    lines.push(`1. Submitting moral waiver packet for ${fullName||'[NAME]'}, SSN (last 4): XXXX-XX-${ssnLast4}.`);
    if (applicant.rsid) lines.push(`   RSID: ${applicant.rsid}`);
    if (applicant.mosCode) lines.push(`   Target MOS: ${applicant.mosCode}`);
    lines.push(``);
    lines.push(`2. Offense(s) being waived:`);
    offenseList.filter(isWaived).forEach((o,i)=>{
      const cat = OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId);
      lines.push(`   ${i+1}. ${fmtDate(o.offenseDate)} — ${o.description||cat?.label||'[Offense]'}`);
    });
    lines.push(``);
    lines.push(`3. Approving Authority: ${authorityShort}`);
    lines.push(``);
    lines.push(`4. Required documents attached:`);
    requiredItems.forEach(item=>{
      const status = clStatus[item.id]||'pending';
      const mark = status==='complete'?'[X]':'[ ]';
      lines.push(`   ${mark} ${item.label}`);
    });
    lines.push(``);
    lines.push(`5. Document status: ${completedCount} of ${requiredItems.length} items complete.`);
    lines.push(``);
    lines.push(`6. Point of contact: ${applicant.recruiterName||'[RECRUITER]'}, RSID: ${applicant.rsid||'[RSID]'}`);
    lines.push(``);
    lines.push(`7. Regulation basis: ${REG_VERSION}, Chapter 4`);
    lines.push(``);
    lines.push(``);
    lines.push(`__________________________________        ____________________`);
    lines.push(`[RECRUITER RANK, NAME]                    Date`);
    return lines.join('\n');
  };

  const docTypes = [
    { id:'cover',     name:'Cover Sheet',                desc:'Formatted summary page for the top of the physical packet — applicant info, all offenses, doc status.', icon:<IcoDoc/>, gen:genCoverSheet, fmt:'text' },
    { id:'statement', name:"Applicant's Statement",      desc:'Pre-filled structure with offense-specific guidance prompts. Applicant personalizes, handwrites, and signs.', icon:<IcoDoc/>, gen:genStatement, fmt:'text' },
    { id:'mfr',       name:"CO Interview MFR",           desc:'Official Army memo (AR 25-50 format) with letterhead, fill-in lines, and APPROVE/DISAPPROVE checkboxes.', icon:<IcoDoc/>, gen:genMFR, fmt:'html' },
    { id:'routing',   name:'Routing / Transmittal Memo', desc:'Memo from recruiter routing the complete packet to battalion S1 with full document checklist.', icon:<IcoDoc/>, gen:genRouting, fmt:'text' },
  ];

        {/* PDF Generator */}

        </div>

      {/* Preview Modal */}

        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setActiveDoc(null)}}>
          <div className="modal" style={{maxWidth:activeDoc.fmt==='html'?860:720}}>

              }

            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── UF 601-210.08 PDF Generator ─────────────────────── */
function buildDatasetsXML(applicant, screenedOffenses, waivedIds = []) {
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtD = iso => {
    if (!iso) return '';
    try { const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; } catch { return ''; }
  };
  const calcAge = (fromIso, toIso) => {
    if (!fromIso || !toIso) return '';
    try {
      const [by,bm,bd] = fromIso.split('-').map(Number);
      const [ty,tm,td] = toIso.split('-').map(Number);
      let age = ty - by;
      if (tm < bm || (tm === bm && td < bd)) age--;
      return age >= 0 ? String(age) : '';
    } catch { return ''; }
  };
  const name = [applicant.lastName, [applicant.firstName, applicant.mi].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const currentAge = calcAge(applicant.dob, new Date().toISOString().split('T')[0]);
  const sorted = sortNewest(screenedOffenses.filter(so=>so.offenseDate||so.description));
  const get = i => sorted[i] || {};
  const tf = v => v ? `<TextField2>${esc(v)}</TextField2>` : '<TextField2/>';
  const df = v => v ? `<DateField2>${esc(v)}</DateField2>` : '<DateField2/>';
  const nf = v => v ? `<NumericField2>${esc(v)}</NumericField2>` : '<NumericField2/>';
  const rowXML = i => {
    const o = get(i);
    const age = calcAge(applicant.dob, o.offenseDate);
    const star = o.id && waivedIds.includes(o.id) ? '*' : '';
    const desc = o.description || (OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId)?.label) || '';
    return `${df(fmtD(o.offenseDate))}\n${nf(age)}\n${tf(star + desc)}\n${tf(o.dispositionText||'')}\n`;
  };
  let xml = `<xfa:datasets xmlns:xfa="http://www.xfa.org/schema/xfa-data/1.0/">\n<xfa:data>\n<topmostSubform>\n`;
  xml += tf(applicant.maritalStatus) + '\n';
  xml += `<RadioButtonList>${esc(applicant.psNps||'')}</RadioButtonList>\n`;
  xml += rowXML(0);
  for (let i=0;i<7;i++) xml += '<TextField2/>\n';
  for (let i=1;i<=16;i++) xml += rowXML(i);
  xml += tf(applicant.dependentAges) + '\n';
  xml += tf(applicant.numDependents) + '\n';
  xml += tf(name) + '\n';
  xml += tf(currentAge) + '\n';
  xml += tf(applicant.educationCode||applicant.educationLevel||'') + '\n';
  xml += tf(applicant.afqt) + '\n';
  for (let i=17;i<=41;i++) xml += rowXML(i);
  xml += '</topmostSubform>\n</xfa:data>\n</xfa:datasets>';
  return xml;
}

async function generateFilledUF608(applicant, offenses, waivedIds, onProgress, templateBytes = null) {
  let origBytes = templateBytes;

  if (!origBytes) {
    onProgress('Trying to locate PDF template automatically...');

    // Try several likely locations (important because people move this HTML around)
    const candidates = [
      './uf-601-210-08.pdf',
      './UF 601-210.08.pdf',
      './UF 601-210_08.pdf',
      '../Regulations/UF 601-210.08.pdf',
      '../Regulations/uf-601-210-08.pdf',
      '../Regulations/UF 601-210_08_1.pdf',
      '../Regulations/UF 601-210.08.pdf'
    ];

    let usedPath = '';

    for (const path of candidates) {
      try {
        const resp = await fetch(path);
        if (resp.ok) {
          origBytes = new Uint8Array(await resp.arrayBuffer());
          usedPath = path;
          console.log('[UF608] Auto-loaded template from:', usedPath);
          break;
        }
      } catch (e) {
        // ignore and try next
      }
    }
  } else {
    console.log('[UF608] Using manually selected PDF template');
  }

  if (!origBytes) {
    throw new Error(
      'Could not load the blank UF 601-210.08 PDF template.\n\n' +
      'The file exists in your folder but the automatic lookup failed.\n\n' +
      'Please use the "Select Blank UF 601-210.08 PDF" button below to manually pick the file. Once selected, the generator will use it directly.\n\n' +
      'You can also use the "Copy Text Version" button — it always works.'
    );
  }

  onProgress('Building XFA datasets...');
  const xml = buildDatasetsXML(applicant, offenses, waivedIds);
  const xmlBytes = new TextEncoder().encode(xml);
  onProgress('Compressing...');
  const compressed = pako.deflate(xmlBytes);
  const tail = new TextDecoder('utf-8',{fatal:false}).decode(origBytes.slice(-512));
  const prevMatch = tail.match(/startxref\s+(\d+)/g);
  const prevXref = prevMatch ? parseInt(prevMatch[prevMatch.length-1].match(/\d+/)[0]) : 0;
  const enc = new TextEncoder();
  const sep = enc.encode('\n');
  const objHeader = enc.encode(`72 0 obj\n<<\n/Filter [/FlateDecode]\n/Length ${compressed.length}\n/Type /EmbeddedFile\n>>\nstream\n`);
  const objFooter = enc.encode('\nendstream\nendobj\n');
  const newObj72At = origBytes.length + sep.length;
  const xrefAt = newObj72At + objHeader.length + compressed.length + objFooter.length;
  const xrefEntry = `${String(newObj72At).padStart(10,'0')} 00000 n \r\n`;
  const xrefBlock = enc.encode(`xref\n72 1\n${xrefEntry}`);
  const trailerBlock = enc.encode(`trailer\n<<\n/Size 100\n/Prev ${prevXref}\n>>\nstartxref\n${xrefAt}\n%%EOF\n`);
  onProgress('Assembling PDF...');
  const parts = [origBytes, sep, objHeader, compressed, objFooter, xrefBlock, trailerBlock];
  const total = parts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(total);
  let pos=0; for (const p of parts){result.set(p,pos);pos+=p.length;}
  return result;
}

const UF608Card = ({ applicant, offenses, waivedIds = [] }) => {
  const [status, setStatus] = useState('idle');
  const [msg, setMsg] = useState('');
  const [selectedTemplate, setSelectedTemplate] = useState(null); // Uint8Array from user-selected file
  const canGenerate = offenses.some(so=>so.offenseDate||so.description);

  const handleTemplateSelect = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      setSelectedTemplate(bytes);
      setMsg(`Template loaded: ${file.name}. Ready to generate.`);
      setStatus('idle');
    };
    reader.onerror = () => {
      setMsg('Failed to read the selected PDF file.');
      setStatus('error');
    };
    reader.readAsArrayBuffer(file);
  };

  const generatePDF = async () => {
    setStatus('loading'); setMsg('Starting...');
    try {
      const bytes = await generateFilledUF608(applicant, offenses, waivedIds, m=>setMsg(m), selectedTemplate);
      const blob = new Blob([bytes], {type:'application/pdf'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=`UF-601-210.08-${(applicant.lastName||'applicant').toUpperCase()}.pdf`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('done'); setMsg('Downloaded — open with Adobe Acrobat Reader.');
    } catch(e) { 
      setStatus('error'); 
      setMsg(e.message); 
    }
  };

  // Reliable fallback that always works
  const copyTextVersion = () => {
    const lines = [];
    lines.push('UF 601-210.08 — RECORD OF ALL LAW VIOLATIONS');
    lines.push(`Applicant: ${[applicant.firstName, applicant.mi, applicant.lastName].filter(Boolean).join(' ')}`);
    lines.push(`RSID: ${applicant.rsid || ''}    AFQT: ${applicant.afqt || ''}`);
    lines.push('All offenses listed newest to oldest. Waived offenses marked with ★');
    lines.push('');

    const sorted = sortNewest(offenses);

    sorted.forEach((o, i) => {
      const cat = OFFENSE_CATEGORIES.find(c => c.id === o.categoryId);
      const date = o.offenseDate ? new Date(o.offenseDate).toLocaleDateString() : 'Unknown date';
      const asterisk = waivedIds.includes(o.id) ? '★ ' : '';
      lines.push(`${i+1}. ${asterisk}${date} — ${cat?.label || o.categoryId}`);
      if (o.description) lines.push(`   Description: ${o.description}`);
      if (o.dispositionText) lines.push(`   Disposition: ${o.dispositionText}`);
      if (o.city || o.state) lines.push(`   Location: ${[o.city, o.state].filter(Boolean).join(', ')}`);
      lines.push('');
    });

    navigator.clipboard.writeText(lines.join('\n')).then(() => {
      setMsg('Text version copied to clipboard. Paste directly into the UF 601-210.08 form.');
      setStatus('done');
    }).catch(() => {
      // Fallback if clipboard fails
      const ta = document.createElement('textarea');
      ta.value = lines.join('\n');
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setMsg('Text version copied (fallback). Paste into the form.');
      setStatus('done');
    });
  };

  return (
    <div className="card" style={{marginTop:14,borderColor:status==='error'?'rgba(207,0,0,.3)':status==='done'?'rgba(45,122,79,.3)':'rgba(255,204,1,.2)'}}>
      <div className="card-hdr">
        <div className="section-bar"/>
        <div style={{flex:1}}>
          <div className="card-title">UF 601-210.08 — Pre-Fill & Download</div>
          <div className="card-sub">XFA injection — opens pre-populated in Adobe Acrobat Reader (all offenses, newest to oldest)</div>
        </div>
      </div>
      <div style={{fontSize:12,color:'var(--fg-m)',marginBottom:12,lineHeight:1.6}}>
        Injects applicant data and all logged offenses directly into form fields. Waived offenses are automatically asterisked (★).
      </div>

      {!canGenerate && <div style={{fontSize:11,color:'var(--fg-m)',marginBottom:12,padding:'6px 10px',background:'rgba(255,204,1,.04)',border:'1px solid var(--bd)'}}>Add offense details (date + description) in the Screener before generating.</div>}

      {msg && (
        <div style={{
          fontSize:11, 
          marginBottom:12, 
          padding:'8px 10px',
          whiteSpace: 'pre-wrap',
          background:status==='error'?'rgba(207,0,0,.1)':status==='done'?'rgba(45,122,79,.1)':'rgba(255,204,1,.06)',
          border:`1px solid ${status==='error'?'rgba(207,0,0,.3)':status==='done'?'rgba(45,122,79,.3)':'rgba(255,204,1,.15)'}`,
          color:status==='error'?'#ff7070':status==='done'?'#5bc989':'var(--gold)'
        }}>
          {msg}
        </div>
      )}

      <div className="row" style={{gap:8, flexWrap:'wrap', alignItems:'center'}}>
        <button 
          className="btn btn-gold" 
          disabled={!canGenerate||status==='loading'} 
          onClick={generatePDF}
        >
          {status==='loading' ? 'Generating PDF...' : 'Generate & Download Filled PDF'}
        </button>

        <label className="btn btn-outline" style={{cursor:'pointer', display:'inline-flex', alignItems:'center'}}>
          Select Blank UF 601-210.08 PDF
          <input 
            type="file" 
            accept=".pdf" 
            style={{display:'none'}} 
            onChange={handleTemplateSelect}
          />
        </label>

        <button 
          className="btn btn-outline" 
          disabled={!canGenerate} 
          onClick={copyTextVersion}
        >
          Copy Text Version (Always Works)
        </button>

        {status!=='idle'&&status!=='loading' && (
          <button className="btn btn-outline btn-sm" onClick={()=>{setStatus('idle');setMsg(''); setSelectedTemplate(null);}}>
            Reset
          </button>
        )}
      </div>

      {selectedTemplate && (
        <div style={{marginTop:6, fontSize:11, color:'#5bc989'}}>
          ✓ Custom template loaded and ready. The generator will use this file.
        </div>
      )}

      <div style={{marginTop:10, fontSize:11, color:'var(--fg-d)', lineHeight:1.4}}>
        <strong>For reliable PDF fill:</strong> Use the "Select Blank UF 601-210.08 PDF" button to pick the file (works even if it's not in this exact folder).<br/>
        The "Copy Text Version" button above always works and gives you clean, properly formatted data (newest to oldest, with ★ for waived offenses).
      </div>
    </div>
  );
};

/* ── Right Regulation Panel ──────────────────────────── */
const RefPanel = ({ collapsed, tab, authority, highlighted }) => {
  const [refExpanded, setRefExpanded] = useState({});
  const relevantParas = {
    1: ['4-6','4-7','4-7c','4-22g','4-22h','4-22i','4-22j','4-22k','4-30','4-31','4-35','4-18','4-2f'],
    2: ['4-28','4-28e4','4-28e5','4-27','4-12c'],
    3: ['4-28','4-28e4','4-28e5','4-27','4-31'],
  };
  const allParas = [...(relevantParas[tab] || Object.keys(PARA_TEXT))];
  // Highlighted paras bubble to top, rest follow
  const hi = (highlighted || []).filter(p => PARA_TEXT[p]);
  const rest = allParas.filter(p => !hi.includes(p) && PARA_TEXT[p]);
  const ordered = [...hi, ...rest];

  const tips = {
    1: ['The verdict is computed from the WHOLE record: 2–5 misconduct = BN waiver; a single DUI/prostitution/non-Lautenberg DV = BN waiver; any felony = CG USARD + 24-month wait.', 'Since 20 Mar 2026, a single marijuana possession conviction needs NO waiver.'],
    2: ['AFQT on UF 601-210.08 must match current MIRS score.', 'MOS compatibility check is advisory — verify with the career manager.'],
    3: ['Click any checklist item to expand step-by-step guidance.', 'DD 369s must cover every location where an offense occurred, regardless of date.', 'Aliases require separate DD 369 forms.'],
  };
  if (collapsed) return null;
  return (
    <div className="ref-panel">
      <div className="ref-panel-hdr">
        <div className="ref-panel-title">Reg Reference</div>
        {hi.length > 0 && <span style={{fontSize:9,color:'var(--gold)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>{hi.length} active</span>}
      </div>
      <div className="ref-panel-body">
        {(tips[tab]||[]).map((tip,i) => (
          <div key={i} className="ref-tip" style={{marginBottom:8}}>{tip}</div>
        ))}
        {ordered.map(para => {
          const isHighlighted = hi.includes(para);
          const isOpen = isHighlighted || !!refExpanded[para];
          return (
            <div key={para} className={`ref-entry${isHighlighted?' highlighted':''}`} style={isHighlighted?{marginBottom:10}:{}}>
              {isHighlighted && (
                <div style={{fontSize:9,fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:3}}>
                  ▶ RELEVANT TO CURRENT SELECTION
                </div>
              )}
              <div className="ref-para-id"
                onClick={()=>{ if(!isHighlighted) setRefExpanded(s=>({...s,[para]:!s[para]})); }}
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:isHighlighted?'default':'pointer'}}>
                <span>Para {para}</span>
                {!isHighlighted && <span style={{color:'var(--fg-m)',fontSize:9}}>{isOpen?'▲':'▼'}</span>}
              </div>
              <div className="ref-para-text" style={isOpen?{}:{color:'var(--fg-m)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                {PARA_TEXT[para]}
              </div>
            </div>
          );
        })}
        {authority === 'USARD' && (
          <div className="ref-tip" style={{marginTop:8,borderLeft:'2px solid var(--gold)',color:'var(--gold)'}}>
            CG USARD level — DD Form 370 references (4-28e(4)) and DD Form 2808 (4-28e(5)) required.
          </div>
        )}
      </div>
    </div>
  );
};

/* ── Resume Modal ───────────────────────────────────── */
const ResumeModal = ({ draft, onResume, onDiscard }) => (
  <div className="resume-modal">
    <div className="resume-box">
      <div className="resume-title">Resume Previous Session?</div>
      <div className="resume-applicant">{draft.roster?.[0]?.firstName||''} {draft.roster?.[0]?.lastName||'Unnamed'}</div>
      <div className="resume-ts">{draft.roster?.length||0} applicant(s) · Last saved: {draft.savedAt ? new Date(draft.savedAt).toLocaleString() : 'Unknown'}</div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-gold" style={{flex:1}} onClick={onResume}>Resume</button>
        <button className="btn btn-outline" onClick={onDiscard}>Start Fresh</button>
      </div>
    </div>
  </div>
);

/* ── Sample Scenarios Dropdown ──────────────────────── */
const SampleMenu = ({ onLoad, onClose }) => (
  <div style={{position:'absolute',top:'100%',right:0,background:'var(--bg-s)',border:'1px solid var(--bd-m)',zIndex:50,minWidth:240,marginTop:4}} className="fade-in">
    {SAMPLE_SCENARIOS.map(s => (
      <button key={s.id} onClick={()=>{onLoad(s);onClose();}}
        style={{display:'block',width:'100%',background:'none',border:'none',borderBottom:'1px solid var(--bd)',padding:'10px 14px',textAlign:'left',cursor:'pointer',color:'var(--fg2)',fontFamily:'inherit',fontSize:12}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--bg-h)'}
        onMouseLeave={e=>e.currentTarget.style.background='none'}>
        <div style={{fontWeight:700,fontSize:11}}>{s.title}</div>
        <div style={{fontSize:10,color:'var(--fg-m)',marginTop:2}}>{s.tag}</div>
      </button>
    ))}
  </div>
);

/* ── App ────────────────────────────────────────────── */
const App = () => {
  const [theme, setTheme] = useState('dark');
  const [tab, setTab] = useState(1);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [refOpen, setRefOpen] = useState(true);
  const [sampleMenuOpen, setSampleMenuOpen] = useState(false);
  const [pendingRestore, setPendingRestore] = useState(null);
  const [highlightedParas, setHighlightedParas] = useState([]);
  // Roster state — supports multiple applicants; add/remove never wipes others
  const [roster, setRoster] = useState([blankApplicant()]);
  const [activeId, setActiveId] = useState(null);

  // Init
  useEffect(() => {
    const saved = loadRoster();
    if (saved?.roster?.length) {
      setPendingRestore(saved);
    } else {
      const first = blankApplicant();
      setRoster([first]); setActiveId(first.id);
    }
  }, []);

  // Theme
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  // Autosave
  useEffect(() => {
    if (!activeId) return;
    saveRoster({ roster, activeId, savedAt:new Date().toISOString() });
  }, [roster, activeId]);

  const activeApplicant = roster.find(a => a.id === activeId) || roster[0];

  const setActiveApplicant = (updater) => {
    setRoster(prev => prev.map(a => a.id === activeId ? (typeof updater === 'function' ? updater(a) : {...a,...updater}) : a));
  };

  const addApplicant = () => {
    const a = blankApplicant();
    setRoster(prev => [...prev, a]);
    setActiveId(a.id);
    setTab(1);
  };

  const removeApplicant = (id) => {
    const appl = roster.find(a => a.id === id);
    const name = [appl?.firstName, appl?.lastName].filter(Boolean).join(' ') || 'this applicant';
    if (!window.confirm(`Remove ${name}? This permanently deletes their screening data and checklist progress.`)) return;
    setRoster(prev => {
      const next = prev.filter(a => a.id !== id);
      if (!next.length) {
        const fresh = blankApplicant();
        setActiveId(fresh.id);
        return [fresh];
      }
      if (id === activeId) setActiveId(next[0].id);
      return next;
    });
  };

  const clearAllData = () => {
    if (!window.confirm('Clear ALL saved applicants and start fresh? This cannot be undone.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    const a = blankApplicant();
    setRoster([a]); setActiveId(a.id); setTab(1);
  };

  const loadSample = (scenario) => {
    const a = blankApplicant();
    Object.assign(a, JSON.parse(JSON.stringify(scenario.applicant)));
    a.id = `a${Date.now()}${Math.floor(Math.random()*1e4)}`;
    a.caseAnswers = { ...scenario.caseAnswers };
    a.offenses = scenario.offenses.map(o => ({ ...o, id:`${o.id}_${Date.now()}` }));
    setRoster(prev => [...prev, a]);
    setActiveId(a.id);
    setTab(1);
  };

  const restoreSession = () => {
    if (!pendingRestore) return;
    setRoster(pendingRestore.roster);
    setActiveId(pendingRestore.activeId || pendingRestore.roster[0]?.id);
    setPendingRestore(null);
  };

  const discardSession = () => {
    const a = blankApplicant();
    setRoster([a]); setActiveId(a.id);
    setPendingRestore(null);
  };

  const verdict = activeApplicant ? computeCaseVerdict(activeApplicant) : null;
  const authority = verdict?.authority || null;
  const { score:readiness, breakdown } = computeReadiness(activeApplicant||{}, verdict, activeApplicant?.checklistStatus||{});

  const authorityLabels = { BN:'BN CO', USARD:'CG USARD' };

  const tabs = [
    { n:1, label:'Screen Charges' },
    { n:2, label:'Applicant Info' },
    { n:3, label:'Build Packet' },
  ];

  const p1Done = verdict && ['WAIVABLE','NO_WAIVER_REQUIRED'].includes(verdict.status);
  const p2Done = p1Done && !!(activeApplicant?.lastName);
  const p3Done = p2Done && readiness >= 80;
  const isDone = (n) => n===1?p1Done:n===2?p2Done:n===3?p3Done:false;

  return (
    <>
      {/* Top Bar */}
      <div className="topbar">
        <button className="topbar-btn" style={{padding:'5px 8px',fontSize:14,lineHeight:1}} onClick={()=>setSidebarOpen(v=>!v)} title="Toggle roster">☰</button>
        <span className="topbar-badge">4D5E</span>
        <div>
          <div className="topbar-title">Moral Waiver Builder</div>
          <div className="topbar-sub">AR 601-210 (20 Mar 2026) · Chapter 4</div>
        </div>
        <div className="topbar-center">
          {activeApplicant && (
            <div className="readiness-wrap">
              <ReadinessRing score={readiness}/>
              <div>
                <div className="readiness-pct-big">{readiness}% Ready</div>
                <div className="readiness-label">{breakdown.find(b=>!b.done)?.label||'Packet Complete!'}</div>
              </div>
            </div>
          )}
          {verdict?.status !== 'NOT_WAIVABLE' && authority && (
            <div className={`auth-badge auth-${authority}`}><IcoShield/> {authorityLabels[authority]} Level</div>
          )}
          {verdict?.status === 'NOT_WAIVABLE' && (
            <div className="auth-badge auth-NONE" style={{background:'rgba(207,0,0,.15)',borderColor:'rgba(207,0,0,.3)',color:'#ff5555'}}>⛔ NOT WAIVABLE</div>
          )}
        </div>
        <div className="topbar-actions">
          <div style={{position:'relative'}}>
            <button className="topbar-btn" onClick={()=>setSampleMenuOpen(v=>!v)}>Sample Scenarios</button>
            {sampleMenuOpen && <SampleMenu onLoad={loadSample} onClose={()=>setSampleMenuOpen(false)}/>}
          </div>
          <button className="topbar-btn" onClick={clearAllData} title="Erase all saved applicant data from this computer">Clear Data</button>
          <button className="topbar-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}>{theme==='dark'?'Light':'Dark'}</button>
          <button className="topbar-btn" onClick={()=>setRefOpen(v=>!v)} title="Toggle reference panel">📖</button>
        </div>
      </div>

      <div className="app-shell">
        {/* Sidebar — Roster */}
        <div className={`sidebar${sidebarOpen?'':' collapsed'}`}>
          <div className="sidebar-hdr">
            <div className="sidebar-title">Applicants ({roster.length})</div>
          </div>
          <div className="sidebar-body">
            {roster.map(a => (
              <ApplicantCard key={a.id} appl={a} active={a.id===activeId}
                onClick={()=>{setActiveId(a.id);}}
                onDelete={()=>removeApplicant(a.id)}/>
            ))}
          </div>
          <div className="sidebar-footer">
            <button className="btn btn-gold" style={{width:'100%'}} onClick={addApplicant}><IcoPlus/> New Applicant</button>
          </div>
        </div>

        {/* Main Panel */}
        <div className="main-panel">
          <div className="tab-nav">
            {tabs.map(t => (
              <button key={t.n} className={`tab-btn${tab===t.n?' active':''}${isDone(t.n)?' done':''}`}
                onClick={()=>setTab(t.n)}>
                <span className="tab-num">{isDone(t.n)?<IcoCheck/>:t.n}</span>
                {t.label}
              </button>
            ))}
          </div>

          {tab===1 && activeApplicant && (
            <Phase1 applicant={activeApplicant} setApplicant={setActiveApplicant} onHighlight={setHighlightedParas}/>
          )}
          {tab===2 && activeApplicant && (
            <Phase2 applicant={activeApplicant} setApplicant={setActiveApplicant}/>
          )}
          {tab===3 && activeApplicant && (
            <Phase3 applicant={activeApplicant} setApplicant={setActiveApplicant}/>
          )}
        </div>

        {/* Right Panel */}
        {refOpen && <RefPanel collapsed={false} tab={tab} authority={authority} highlighted={highlightedParas}/>}
      </div>

      {pendingRestore && <ResumeModal draft={pendingRestore} onResume={restoreSession} onDiscard={discardSession}/>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
