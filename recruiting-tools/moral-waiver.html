<title>Moral Waiver Builder — Recruiter Toolbox 4D5E</title>
<style>
@font-face{font-family:"GI";src:url("../fonts/G.I.-400.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-530.ttf");font-weight:500;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-750.ttf");font-weight:700;font-display:swap}

/* ══════════════════════════════════════════════════════════════════
   MORAL WAIVER BUILDER — QC redesign
   US Army Design System tokens. Radius 0, no shadows, no gradients,
   no animation. Gold is accent-only.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --gold:#FFCC01; --gold-press:#e6b800; --black:#221F20;
  --s0:#0b0c0c; --s1:#0f1010; --s2:#131414; --s3:#161717; --s4:#191A1B;
  --t1:#EDEBE8; --t2:#C9C5C0; --t2b:#D9D6D1; --t3:#98948E; --t4:#727365;
  --red:#CF0000; --red-fg:#FF6B6B; --orange:#F16521; --green:#2DAA27;
  --hair:rgba(255,255,255,.1); --hair-soft:rgba(255,255,255,.07);
  --hair-faint:rgba(255,255,255,.06); --ghost:rgba(255,255,255,.14);
  --rail-w:352px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"GI",Arial,sans-serif;background:var(--s0);color:var(--t1);
  font-size:14px;font-weight:400;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}

/* ── FRAME ───────────────────────────────────────────────── */
#root{height:100%}
.frame{height:100%;position:relative;display:flex;flex-direction:column;background:var(--s1)}

/* ── TOP BAR ─────────────────────────────────────────────── */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:var(--s4);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-chip{width:26px;height:26px;background:var(--gold);display:flex;align-items:center;
  justify-content:center;color:var(--black);font-weight:700;font-size:15px}
.brand-word{font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.topbar-div{width:1px;height:22px;background:var(--ghost);flex:none}
.appl-switch{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--ghost);
  color:var(--t1);font-size:13px;padding:6px 12px;cursor:pointer;text-align:left}
.appl-switch:hover{border-color:rgba(255,255,255,.4)}
.appl-switch-name{font-weight:700;white-space:nowrap}
.appl-switch-meta{color:var(--t3);font-size:12px;white-space:nowrap}
.appl-switch-caret{color:var(--t3);font-size:10px}
.spacer{flex:1}
.reg-stamp{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn-ghost-gold{background:none;border:1px solid rgba(255,204,1,.45);color:var(--gold);font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn-ghost-gold:hover{background:var(--gold);color:var(--black)}
.btn-ghost{background:none;border:1px solid var(--ghost);color:var(--t3);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:rgba(255,255,255,.4);color:var(--t1)}

/* ── VERDICT BANNER ──────────────────────────────────────── */
.verdict{flex:none;padding:26px 28px 22px;background:var(--black);border-bottom:2px solid var(--t3)}
.verdict-top{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.verdict-micro{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.verdict-title{font-size:56px;font-weight:500;line-height:.98;text-transform:uppercase}
.verdict-row{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
.verdict-auth{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px}
.verdict-body{font-size:13px;color:var(--t2);line-height:1.5;max-width:720px}
.cite{font-size:12px;color:var(--gold);text-decoration:none;border:none;border-bottom:1px solid rgba(255,204,1,.4);
  background:none;cursor:pointer;padding:0;font-family:inherit;flex:none}
.cite:hover{border-bottom-color:var(--gold)}

/* ── PHASE TABS ──────────────────────────────────────────── */
.phases{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--s2);
  border-bottom:1px solid var(--hair)}
.phase{display:flex;align-items:center;gap:14px;padding:16px 22px;background:transparent;border:none;
  border-right:1px solid rgba(255,255,255,.08);border-bottom:3px solid transparent;
  text-align:left;cursor:pointer;font-family:inherit}
.phase:last-child{border-right:none}
.phase.on{background:var(--s4);border-bottom-color:var(--gold)}
.phase-num{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;background:transparent;color:var(--t3);border:1px solid rgba(255,255,255,.22)}
.phase.on .phase-num{background:var(--gold);color:var(--black);border-color:var(--gold)}
.phase-title{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.phase.on .phase-title{color:var(--t1)}
.phase-sub{font-size:12px;color:var(--t3);margin-top:2px}

/* ── BODY ────────────────────────────────────────────────── */
.body{flex:1;display:flex;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:26px 28px 40px}
.col-760{max-width:760px;display:flex;flex-direction:column;gap:30px}
.col-820{max-width:820px}
.col-900{max-width:900px;display:flex;flex-direction:column;gap:26px}

/* ── SECTION HEADERS ─────────────────────────────────────── */
.sec-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-label{font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sec-note{font-size:12px;color:var(--t3)}
.panel{border:1px solid var(--hair);background:var(--s3);margin-top:14px}

/* ── ELIGIBILITY GATES ───────────────────────────────────── */
.gate{display:flex;align-items:center;gap:20px;padding:15px 18px;border-bottom:1px solid var(--hair-soft)}
.gate:last-child{border-bottom:none}
.gate-q{font-size:14px;font-weight:500;line-height:1.35}
.gate-hint{font-size:12px;color:var(--t3);margin-top:4px;line-height:1.45}
.seg{display:flex;flex:none}
.seg-btn{padding:9px 15px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;background:transparent;color:var(--t3);border:1px solid rgba(255,255,255,.16);
  margin-left:-1px;font-family:inherit;white-space:nowrap}
.seg-btn:first-child{margin-left:0}
.seg-btn:hover{border-color:rgba(255,255,255,.4);color:var(--t1)}
.seg-btn.on{background:rgba(255,204,1,.14);color:var(--gold);border-color:var(--gold);position:relative;z-index:1}
.seg-btn.on.bad{background:rgba(207,0,0,.18);color:var(--red-fg);border-color:var(--red)}

/* ── OFFENSE STACK ───────────────────────────────────────── */
.stack{display:flex;flex-direction:column;gap:1px;margin-top:14px}
.srow{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--s3);
  border:1px solid var(--hair);border-left:3px solid var(--t3)}
.srow-main{flex:1;background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;padding:0;color:inherit}
.srow-label{font-size:14px;font-weight:700;color:var(--t1)}
.srow-meta{font-size:12px;color:var(--t3);margin-top:3px}
.stag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;flex:none}
.srow-x{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:4px 2px;flex:none;font-family:inherit}
.srow-x:hover{color:var(--red)}
.srow-edit{background:none;border:1px solid rgba(255,255,255,.16);color:var(--t3);font-size:11px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;cursor:pointer;flex:none;font-family:inherit}
.srow-edit:hover{border-color:rgba(255,255,255,.4);color:var(--t1)}

/* ── ADD-OFFENSE COMBOBOX ────────────────────────────────── */
.combo{margin-top:14px;border:1px solid var(--hair);background:var(--s3)}
.combo-input-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair-soft)}
.combo-input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:14px}
.combo-input::placeholder{color:var(--t3)}
.combo-count{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;flex:none}
.combo-list{max-height:250px;overflow-y:auto}
.combo-item{display:flex;width:100%;align-items:flex-start;gap:14px;text-align:left;padding:12px 16px;
  background:none;border:none;border-bottom:1px solid var(--hair-faint);cursor:pointer;font-family:inherit}
.combo-item:hover{background:rgba(255,255,255,.04)}
.combo-tag{width:76px;flex:none;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding-top:2px}
.combo-label{font-size:14px;color:var(--t1)}
.combo-sub{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.45}
.combo-empty{padding:14px 16px;font-size:12px;color:var(--t3)}

/* ── OFFENSE EDITOR ──────────────────────────────────────── */
.editor{background:var(--s3);border:1px solid var(--hair);border-left:3px solid var(--gold);
  padding:18px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.finput{background:var(--s0);border:1px solid rgba(255,255,255,.16);border-radius:2px;color:var(--t1);
  padding:9px 11px;font-size:13px;outline:none;width:100%;font-family:inherit}
.finput:focus{border-color:var(--gold)}
.finput::placeholder{color:var(--t4)}
.finput.err{border-color:var(--red)}
select.finput{cursor:pointer}
.fnote{font-size:11px;color:var(--t3);line-height:1.45}
.fcheck{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--t2)}
.warnline{padding:9px 12px;background:rgba(207,0,0,.12);border:1px solid rgba(207,0,0,.4);
  color:var(--red-fg);font-size:12px;line-height:1.45;display:flex;gap:8px}
.editor-foot{display:flex;justify-content:flex-end;gap:8px}

/* ── NOTES ───────────────────────────────────────────────── */
.notes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--t2);line-height:1.5}
.note-mark{color:var(--t3);flex:none}
.note-cite{color:var(--t4);font-size:11px}

/* ── CHECKLIST (PHASE 2) ─────────────────────────────────── */
.crow{display:grid;grid-template-columns:26px 1fr 150px 110px;align-items:center;gap:16px;
  padding:15px 18px;border-bottom:1px solid var(--hair-soft)}
.crow:last-of-type{border-bottom:none}
.cbox{width:20px;height:20px;border:2px solid rgba(255,255,255,.25);background:transparent;color:var(--black);
  font-size:12px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0;font-family:inherit}
.cbox.on{background:var(--gold);border-color:var(--gold)}
.clabel{font-size:14px;font-weight:500;color:var(--t2);background:none;border:none;padding:0;
  text-align:left;cursor:pointer;font-family:inherit;display:block}
.clabel.on{color:var(--t1)}
.cref{font-size:12px;color:var(--t3);margin-top:3px}
.cvalidity{font-size:12px;color:var(--t3)}
.cchip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;text-align:center}
.chip-ok{background:rgba(45,170,39,.15);color:var(--green)}
.chip-warn{background:rgba(241,101,33,.15);color:var(--orange)}
.chip-red{background:rgba(207,0,0,.18);color:var(--red-fg)}
.chip-none{background:rgba(255,255,255,.06);color:var(--t3)}
.chowto{padding:0 18px 18px 60px;border-bottom:1px solid var(--hair-soft);font-size:13px;
  color:var(--t2);line-height:1.6}
.chowto-tip{margin-top:8px;padding:8px 11px;background:rgba(241,101,33,.07);
  border-left:2px solid var(--orange);color:var(--t2);font-size:12px;line-height:1.5}
.cdate{background:var(--s0);border:1px solid rgba(255,255,255,.16);border-radius:2px;color:var(--t1);
  padding:5px 7px;font-size:11px;outline:none;width:100%;font-family:inherit;margin-top:4px}
.cdate:focus{border-color:var(--gold)}

/* ── GENERATE (PHASE 3) ──────────────────────────────────── */
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair)}
.outcard{background:var(--s3);padding:18px;display:flex;flex-direction:column;gap:10px}
.outkind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.outname{font-size:15px;font-weight:700;color:var(--t1)}
.outdesc{font-size:13px;color:var(--t3);line-height:1.5;flex:1}
.outbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn-gold{background:var(--gold);border:none;color:var(--black);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn-gold:hover{background:var(--gold-press)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{background:none;border:1px solid rgba(255,255,255,.16);color:var(--t3);font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn-line:hover{border-color:rgba(255,255,255,.4);color:var(--t1)}
.btn-line:disabled{opacity:.35;cursor:not-allowed}
.memo-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t3);margin-bottom:8px}
.memo{border:1px solid var(--hair);background:var(--s0);padding:22px 24px;
  font-family:"Courier New",monospace;font-size:12.5px;line-height:1.85;color:var(--t2b);
  white-space:pre-wrap;max-height:520px;overflow:auto}
.memo-frame{width:100%;height:520px;border:1px solid var(--hair);background:#fff}

/* ── RIGHT RAIL ──────────────────────────────────────────── */
.rail{width:var(--rail-w);flex:none;border-left:1px solid var(--hair);background:var(--s2);
  display:flex;flex-direction:column;overflow-y:auto}
.rail-sec{padding:18px 20px;border-bottom:1px solid var(--hair)}
.rail-sec:last-child{border-bottom:none}
.rail-hd{display:flex;align-items:center;gap:10px}
.rail-dot{width:8px;height:8px;flex:none;background:var(--t3)}
.rail-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.rail-clock{background:rgba(241,101,33,.06)}
.rail-clock .rail-label{color:var(--orange)}
.rail-clock-body{font-size:14px;line-height:1.5;color:var(--t1);margin-top:8px}
.rail-clock-meta{font-size:12px;color:var(--t3);margin-top:4px;line-height:1.45}
.score-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.score-num{font-size:20px;font-weight:700}
.score-track{height:4px;background:rgba(255,255,255,.12)}
.score-fill{height:4px}
.factors{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.factor{display:flex;gap:8px;font-size:12.5px;color:var(--t2);line-height:1.45}
.factor-sign{font-weight:700;flex:none}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.action{display:flex;gap:10px;font-size:13px;color:var(--t1);line-height:1.45}
.action-arrow{color:var(--gold);flex:none}
.suit{display:flex;gap:10px;font-size:12.5px;color:var(--t2);line-height:1.45;margin-top:8px}
.rail-disclaimer{font-size:11px;color:var(--t4);line-height:1.5;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--hair)}

/* ── DRAWER ──────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(11,12,12,.72);display:flex;justify-content:flex-end;z-index:60}
.drawer{width:520px;max-width:100%;background:var(--s4);border-left:2px solid var(--gold);height:100%;
  display:flex;flex-direction:column}
.drawer-hd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--hair);flex:none}
.drawer-title{flex:1;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.drawer-close{background:none;border:1px solid rgba(255,255,255,.16);color:var(--t3);font-size:12px;
  padding:5px 10px;cursor:pointer;font-family:inherit}
.drawer-close:hover{color:var(--t1);border-color:rgba(255,255,255,.4)}
.drawer-body{padding:22px;overflow-y:auto;font-size:14px;line-height:1.65;color:var(--t2b);white-space:pre-wrap}
.drawer-form{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.drawer-sec-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px}
.roster-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s3);
  border:1px solid var(--hair);border-left:3px solid transparent;margin-bottom:1px;width:100%;
  text-align:left;cursor:pointer;font-family:inherit;color:inherit}
.roster-row:hover{background:rgba(255,255,255,.04)}
.roster-row.on{border-left-color:var(--gold)}
.roster-name{font-size:14px;font-weight:700;color:var(--t1)}
.roster-meta{font-size:12px;color:var(--t3);margin-top:2px}

/* ── REFERENCE DRAWER — TABS + OFFENSE TABLES ────────────── */
.drawer-tabs{display:flex;flex:none;border-bottom:1px solid var(--hair)}
.drawer-tab{flex:1;background:none;border:none;border-bottom:3px solid transparent;color:var(--t3);
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 10px;cursor:pointer}
.drawer-tab:hover{color:var(--t1)}
.drawer-tab.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(255,204,1,.05)}
.tbl-search{display:flex;align-items:center;gap:12px;padding:14px 22px;
  border-bottom:1px solid var(--hair);flex:none}
.tbl-count{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;flex:none}
.tbl-hd{padding:16px 22px 12px;border-bottom:1px solid var(--hair);border-left:3px solid var(--t3);
  background:var(--s3);position:sticky;top:0;z-index:1}
.tbl-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tbl-rule{font-size:12px;color:var(--t2);line-height:1.5;margin-top:6px}
.tbl-row{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:9px 22px;
  border-bottom:1px solid var(--hair-faint);align-items:start}
.tbl-code{font-size:12px;font-weight:700;letter-spacing:.04em}
.tbl-text{font-size:13px;color:var(--t2b);line-height:1.45}
.tbl-flag{font-size:11.5px;color:var(--orange);line-height:1.45;margin-top:4px;
  padding-left:9px;border-left:2px solid rgba(241,101,33,.5)}

/* ── REF LINK LIST ───────────────────────────────────────── */
.ref-index{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ref-pill{background:none;border:1px solid rgba(255,204,1,.35);color:var(--gold);font-size:11px;
  font-weight:700;letter-spacing:.06em;padding:4px 9px;cursor:pointer;font-family:inherit}
.ref-pill:hover{background:var(--gold);color:var(--black)}
.ref-pill.on{background:var(--gold);color:var(--black)}

/* ── EMPTY ───────────────────────────────────────────────── */
.empty{padding:28px 18px;text-align:center;color:var(--t3);font-size:13px;line-height:1.6}

/* ── RESPONSIVE ──────────────────────────────────────────────
   Design is 1440 desktop. Below 1200 the rail drops under the
   content rather than compressing (per handoff); phone sizes
   stack the header and phase strip.
   ────────────────────────────────────────────────────────── */
@media (max-width:1200px){
  html,body{overflow:auto}
  .frame{height:auto;min-height:100%}
  .body{flex-direction:column;overflow:visible}
  .content{overflow:visible}
  .rail{width:100%;border-left:none;border-top:1px solid var(--hair)}
  .verdict-title{font-size:44px}
}
@media (max-width:820px){
  .topbar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .topbar-div{display:none}
  .spacer{display:none}
  .verdict{padding:20px 16px 18px}
  .verdict-title{font-size:34px}
  .verdict-body{max-width:none}
  .verdict-top{flex-direction:column;align-items:flex-start;gap:4px}
  .verdict-top .spacer{display:none}
  .verdict-row{align-items:flex-start;gap:12px}
  .verdict-row .spacer{display:none}
  .content{padding:18px 16px 32px}
  .phases{grid-template-columns:1fr}
  .phase{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px}
  .phase.on{border-bottom:3px solid var(--gold)}
  .gate{flex-direction:column;align-items:stretch;gap:12px}
  .seg{width:100%}
  .seg-btn{flex:1;text-align:center;padding:10px 8px}
  .crow{grid-template-columns:26px 1fr;row-gap:10px}
  .cvalidity,.cchip{grid-column:2}
  .cchip{justify-self:start}
  .chowto{padding:0 16px 16px 16px}
  .fgrid,.fgrid-3,.outgrid{grid-template-columns:1fr}
  .drawer{width:100%;border-left:none;border-top:2px solid var(--gold)}
}

/* ── PRINT ───────────────────────────────────────────────── */
@media print{
  html,body{overflow:visible;background:#fff;color:#000}
  .topbar,.phases,.rail,.scrim,.no-print{display:none!important}
  .frame,.body,.content{display:block;overflow:visible;height:auto;padding:0}
}

<body>
<div id="root"></div>
<script src="waiver-data.js?v=5"></script>
<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const {
  OFFENSE_CATEGORIES, CASE_QUESTIONS, CHECKLIST_ITEMS,
  DISPOSITION_OPTIONS, CONFINEMENT_OPTIONS, PROBATION_OPTIONS,
  SAMPLE_SCENARIOS, PARA_TEXT, ED_LEVELS, US_STATES,
  MOS_RESTRICTIONS, APPROVABILITY_FACTORS, OFFENSE_TABLES,
  CAT_PARA_MAP, Q_PARA_MAP, REG_VERSION
} = window;


/* ── Storage ────────────────────────────────────────────── */
const STORAGE_KEY = 'moral-waiver-v4';

// Drafts saved before SSN was removed may still carry an `ssn` key. Drop it on
// load and rewrite the record so the value does not survive in localStorage.
const loadRoster = () => {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if (!saved?.roster) return saved;
    let scrubbed = false;
    saved.roster.forEach(a => { if ('ssn' in a) { delete a.ssn; scrubbed = true; } });
    if (scrubbed) localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    return saved;
  } catch { return null; }
};
const saveRoster = (roster) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(roster)); } catch {} };

const blankApplicant = () => ({
  id: `a${Date.now()}${Math.floor(Math.random()*1e4)}`,
  savedAt: new Date().toISOString(),
  // Applicant Info. No SSN in any form — the tool never collects or stores one.
  lastName:'', firstName:'', mi:'', dob:'', rsid:'',
  educationLevel:'', educationCode:'', afqt:'', psNps:'', maritalStatus:'',
  numDependents:'', dependentAges:'',
  // Recruiter Info
  recruiterUnit:'', recruiterAddress:'', recruiterOfficeSym:'', recruiterName:'', recruiterRank:'',
  // Screening — case-level answers (asked once) + offense record
  caseAnswers:{},
  offenses: [],   // { id, categoryId, offenseDate, convictionDate, disposition, confinement, releaseDate, probation, description, city, county, state, dispositionText, courtDocs, incidentRpt }
  // Packet
  checklistStatus:{}, checklistNotes:{}, expDates:{},
  // MOS
  mosCode:'',
});

/* ── Helpers ────────────────────────────────────────────── */
// Parses through localDate so a YYYY-MM-DD value is not shifted a day by the
// UTC interpretation Date() gives bare ISO dates.
const fmtDate = iso => { if (!iso) return '—'; try { return localDate(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return iso; } };
const today = () => new Date().toISOString().split('T')[0];

const daysUntilExpiry = (dateObtained, validityDays) => {
  if (!dateObtained || !validityDays) return null;
  const exp = new Date(dateObtained);
  exp.setDate(exp.getDate() + validityDays);
  return Math.ceil((exp - new Date()) / 86400000);
};

const getExpiryStatus = (days) => {
  if (days === null) return 'none';
  if (days < 0) return 'red';
  if (days <= 30) return 'warn';
  return 'ok';
};

/* ── Core Logic — whole-case verdict engine (AR 601-210, 20 Mar 2026) ───── */
const ADVERSE_DISPS = ['convicted','adverse'];
const isAdverse = o => ADVERSE_DISPS.includes(o.disposition);
const catOf = id => OFFENSE_CATEGORIES.find(c => c.id === id);
// Parse YYYY-MM-DD as LOCAL midnight — bare new Date(iso) parses as UTC and
// shifts clock math by up to a day (or 4 days across month boundaries).
const localDate = iso => new Date(`${iso}T00:00:00`);
const yearsSince = iso => (Date.now() - localDate(iso).getTime()) / (365.25*24*3600*1000);
const addMonthsIso = (iso, m) => { const d = localDate(iso); d.setMonth(d.getMonth() + m); return d; };
const sortNewest = arr => [...arr].sort((a,b) => (b.offenseDate||'').localeCompare(a.offenseDate||''));
const isJuvenileOffense = (applicant, o) => {
  if (!applicant.dob || !o.offenseDate) return false;
  const cut = localDate(applicant.dob); cut.setFullYear(cut.getFullYear() + 18);
  return localDate(o.offenseDate) < cut;
};

// The regulation decides waivers by counting offenses across the WHOLE record
// (paras 4-6 / 4-7), so eligibility is computed from the full case, not per offense.
const computeCaseVerdict = (applicant) => {
  const ca = applicant.caseAnswers || {};
  const offenses = applicant.offenses || [];
  const answered = Object.values(ca).some(v => v);
  if (!offenses.length && !answered) return null;

  const bars = [], waivers = [], waits = [], suitability = [], notes = [];
  const waivedIds = [];
  let etp = false;
  const isPS = applicant.psNps === 'PS';

  /* ── Case-level bars (asked once) ── */
  if (ca.pending_charges === 'yes') bars.push({ perm:false, title:'Pending Charges', cite:'AR 601-210, 4-22g / 4-33', text:'Criminal or juvenile charges are pending — this includes UNPAID traffic tickets. No processing (including waiver submission) until all charges are fully resolved.' });
  if (ca.civil_restraint === 'active') bars.push({ perm:false, title:'Under Civil Restraint', cite:'AR 601-210, 4-22h', text:'Applicant is currently confined, on parole, or on supervised probation. Cannot process. Exception: unsupervised probation for para 4-35 minor offenses only.' });
  if (ca.dependence === 'yes') bars.push({ perm:false, title:'Alcohol / Drug Dependence Not in Remission', cite:'AR 601-210, 4-22b / 4-22c', text:'Not eligible until in sustained remission for 12 consecutive months.' });
  if (ca.lautenberg === 'yes') bars.push({ perm:true, title:'Lautenberg DV Conviction', cite:'AR 601-210, 4-7b · Table 4-4, Code 414', text:'Qualifying misdemeanor domestic violence conviction — enlistment prohibited. No waivers will be approved at any level.' });
  if (ca.sex_offender === 'yes') bars.push({ perm:true, title:'Sex Offense / Registry Listing', cite:'AR 601-210, 4-22j / 4-7d', text:'Sex offense conviction or sex offender registry listing — permanently disqualified. No waiver authorized.' });
  if (ca.civil_restraint === 'unsupervised') notes.push({ label:'Unsupervised probation for a para 4-35 minor offense — may process, provided all fines are paid, all conditions complete, and no further court action is pending.', cite:'4-35' });
  if (ca.dependence === 'remission') notes.push({ label:'Prior dependence in sustained remission 12+ consecutive months — eligible. Document treatment history on DD 2807-2.', cite:'4-22b/c' });

  /* ── Classify each offense ── */
  const majors=[], miscs=[], minors=[], traffics=[], dats=[];
  let duiLast3 = 0, drugPossLast3 = 0;
  const suitSeen = new Set();
  const addSuit = (label, level, cite) => { const k = level + cite; if (!suitSeen.has(k)) { suitSeen.add(k); suitability.push({ label, level, cite }); } };

  offenses.forEach(o => {
    const cat = catOf(o.categoryId); if (!cat) return;

    // Suitability reviews apply REGARDLESS of disposition (4-2f(2)(a))
    if (cat.suitability) addSuit(cat.label, cat.suitability.level, cat.suitability.cite);
    if (cat.class === 'major') addSuit('Major misconduct charge (required regardless of disposition)', 'USARD', '4-2f(2)(a)3');

    // DAT results and PS military discipline are not court cases — handle before disposition
    if (cat.group === 'dat') {
      if (cat.class === 'bar') bars.push({ perm:true, title:cat.label, cite:`AR 601-210, ${cat.barPara}`, text:cat.barText });
      else dats.push(o);
      return;
    }
    if (cat.class === 'ps') {
      notes.push({ label:`${cat.label} — military discipline history is handled through suitability review / RE-code rules, not a civil conduct waiver. Consult S1/EEPD.`, cite:'4-12c' });
      return;
    }

    if (o.disposition === 'dismissed') {
      notes.push({ label:`${cat.label}: dismissed with no adverse disposition — no waiver required. Still list on SF 86 and UF 601-210.08.`, cite:'4-30a' });
      return;
    }
    if (o.disposition === 'self_admit') {
      if (cat.class === 'major' || cat.class === 'misc') {
        etp = true;
        notes.push({ label:`${cat.label}: self-admitted, no court record — run a court check first (UF 601-210.02 if court will not furnish), then coordinate with BN S1. An Exception to Policy may be required before waiver processing.`, cite:'4-30a / QC Checklist' });
      } else {
        notes.push({ label:`${cat.label}: self-admitted with no record — no waiver required. Document on SF 86.`, cite:'4-30a' });
      }
      return;
    }
    if (!isAdverse(o)) return; // disposition not yet selected

    if (cat.class === 'bar') { bars.push({ perm:true, title:cat.label, cite:`AR 601-210, ${cat.barPara}`, text:cat.barText }); waivedIds.push(o.id); return; }
    if (cat.class === 'major') majors.push(o);
    else if (cat.class === 'misc') miscs.push(o);
    else if (cat.class === 'minor') minors.push(o);
    else if (cat.class === 'traffic') traffics.push(o);

    if (cat.dui && o.offenseDate && yearsSince(o.offenseDate) <= 3) duiLast3++;
    if (cat.drugPossession && o.offenseDate && yearsSince(o.offenseDate) <= 3) drugPossLast3++;
  });

  const nMaj = majors.length, nMisc = miscs.length, nMinor = minors.length;

  /* ── Count-based bars ── */
  if (nMaj >= 2) bars.push({ perm:true, title:'Two or More Major Misconduct Convictions', cite:'AR 601-210, 4-22i', text:'Conviction or adverse disposition for more than one major misconduct (felony-level) offense — cannot be waived at any level.' });
  if (nMisc >= 6) bars.push({ perm:true, title:'Six or More Misconduct Offenses', cite:'AR 601-210, 4-6c', text:'Six or more misconduct convictions/adverse dispositions prior to application — a waiver may not be considered.' });
  if (nMaj >= 1) {
    const nonTraffic = nMaj + nMisc + nMinor;
    if (nonTraffic >= 3) bars.push({ perm:true, title:'Major Misconduct + 3 or More Non-Traffic Offenses', cite:'AR 601-210, 4-7c(1)', text:`Major misconduct conviction combined with ${nonTraffic} total non-traffic offenses — a waiver may not be considered.` });
    if (duiLast3 >= 2) bars.push({ perm:true, title:'Major Misconduct + 2 DUIs Within 3 Years', cite:'AR 601-210, 4-7c(4)', text:'Major misconduct conviction combined with two or more DUI convictions/adverse dispositions within 3 years of application — a waiver may not be considered.' });
    if (drugPossLast3 >= 2) bars.push({ perm:true, title:'Major Misconduct + 2 Drug Possession Charges Within 3 Years', cite:'AR 601-210, 4-7c(6)', text:'Major misconduct conviction combined with two or more separate drug/paraphernalia possession charges within 3 years of application — a waiver may not be considered.' });
    if (isPS) bars.push({ perm:true, title:'Prior Service + Major Misconduct', cite:'AR 601-210, 4-7c(5)', text:'PS applicant with a major misconduct conviction incurred DURING or AFTER military service — a waiver may not be considered. Verify offense timing against service dates: if the offense occurred entirely before service, this bar does not apply — confirm with S1.' });
  }

  /* ── Waiver requirements ── */
  if (nMaj >= 1) {
    waivers.push({ label:`Major misconduct (felony-level) — ${nMaj === 1 ? 'single offense' : nMaj + ' offenses'}`, authority:'USARD', cite:'4-7a' });
    majors.forEach(o => {
      waivedIds.push(o.id);
      const cat = catOf(o.categoryId);
      const clock = o.convictionDate || o.offenseDate;
      if (clock) {
        const earliest = addMonthsIso(clock, 24);
        const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
        if (daysLeft > 0) waits.push({ id:`w24_${o.id}`, label:`${cat?.label} — 24-month wait from conviction date`, from:clock, earliest, daysLeft, cite:'4-7a', note: o.convictionDate ? null : 'Estimated from OFFENSE date — enter the conviction date for the correct clock.' });
      } else {
        waits.push({ id:`w24_${o.id}`, label:`${cat?.label} — 24-month wait from conviction date`, needDate:true, cite:'4-7a' });
      }
      if (isJuvenileOffense(applicant, o)) notes.push({ label:`${cat?.label}: committed as a juvenile — if no offenses within 5 years of application, may be considered in meritorious cases.`, cite:'4-7c(2)' });
    });
  }

  if (nMisc >= 2) {
    waivers.push({ label:`${nMisc} misconduct offenses (two to five require a waiver)`, authority:'BN', cite:'4-6a(2)' });
    miscs.forEach(o => waivedIds.push(o.id));
  } else if (nMisc === 1) {
    const o = miscs[0], cat = catOf(o.categoryId);
    if (cat.noWaiverSingle) {
      notes.push({ label:`${cat.label}: single conviction — NO waiver required (20 Mar 2026 change). Must still be listed on UF 601-210.08, SF 86, and RZ. A negative MEPS drug test is still required.`, cite:'4-6a (2026)' });
    } else if (cat.singleWaiver) {
      waivers.push({ label:`${cat.label} — a single conviction requires a waiver`, authority:'BN', cite:'4-6a(4)' });
      waivedIds.push(o.id);
    } else {
      notes.push({ label:`${cat.label}: single misconduct conviction — no waiver required unless combined with other offenses (2–5 misconduct = waiver). List on UF 601-210.08 and SF 86.`, cite:'4-6a(2)' });
    }
  }

  if (nMinor >= 5) {
    waivers.push({ label:`${nMinor} minor nontraffic offenses (five or more require a waiver)`, authority:'BN', cite:'4-6a(1)' });
    minors.forEach(o => waivedIds.push(o.id));
  } else if (nMisc >= 1 && (nMisc + nMinor) >= 5) {
    waivers.push({ label:`Combination of ${nMisc + nMinor} misconduct + minor nontraffic offenses`, authority:'BN', cite:'4-6a(3)' });
    [...miscs, ...minors].forEach(o => { if (!waivedIds.includes(o.id)) waivedIds.push(o.id); });
  } else if (nMinor > 0) {
    notes.push({ label:`${nMinor} minor nontraffic offense(s) — under the five-offense threshold, no waiver required. List on UF 601-210.08 and SF 86.`, cite:'4-6a(1)' });
  }

  if (traffics.length > 0) notes.push({ label:'Minor traffic violations — no waiver required. Verify no UNPAID tickets (unpaid = pending charges, 4-22g). List on UF 601-210.08.', cite:'4-8 / 4-22g' });

  /* ── DAT waivers ── */
  dats.forEach(o => {
    const cat = catOf(o.categoryId);
    waivers.push({ label: cat.label, authority:'BN', cite:'4-18' });
    waivedIds.push(o.id);
    if (isPS) bars.push({ perm:true, title:'Prior Service + Positive DAT', cite:'AR 601-210, 4-18d', text:'A waiver may not be considered for a PS applicant who tested positive at MEPS for any drug use.' });
    if (o.offenseDate && cat.datRetestDays) {
      const earliest = localDate(o.offenseDate); earliest.setDate(earliest.getDate() + cat.datRetestDays);
      const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
      if (daysLeft > 0) waits.push({ id:`wdat_${o.id}`, label:`${cat.label} — ${cat.datRetestDays === 90 ? '90-day' : '1-year'} retest wait from test date`, from:o.offenseDate, earliest, daysLeft, cite:'4-18b' });
    }
  });

  /* ── 4-31 confinement waiting periods (run from RELEASE date) ── */
  if (waivers.length) {
    offenses.filter(isAdverse).forEach(o => {
      if (!waivedIds.includes(o.id)) return;
      const cat = catOf(o.categoryId);
      const wm = o.confinement === '15plus' ? 6 : o.confinement === '1to14' ? 3 : 0;
      if (wm) {
        if (o.releaseDate) {
          const earliest = addMonthsIso(o.releaseDate, wm);
          const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
          if (daysLeft > 0) waits.push({ id:`wc_${o.id}`, label:`${cat?.label} — ${wm}-month wait after release from confinement`, from:o.releaseDate, earliest, daysLeft, cite:`4-31b(${wm === 3 ? '2' : '3'})`, note:`BN CO may waive up to ${wm === 3 ? '45 days' : '3 months'} if sentenced only to a fine and elected confinement instead (court verification required).` });
        } else {
          waits.push({ id:`wc_${o.id}`, label:`${cat?.label} — ${wm}-month wait after RELEASE from confinement`, needDate:true, cite:'4-31b' });
        }
      }
      if (o.probation === 'completed') notes.push({ label:`${cat?.label}: probation/parole completed — obtain probation officer completion documents before submission.`, cite:'4-31b(1) / 4-28e(2)' });
      if (o.probation === 'active') bars.push({ perm:false, title:'Probation / Parole Still Active', cite:'AR 601-210, 4-22h', text:`${cat?.label}: probation or parole is still active — applicant is under civil restraint and cannot process (unless unsupervised probation for a para 4-35 minor offense).` });
    });
  }

  /* ── Count-based suitability reviews (4-2f) ── */
  if (nMisc >= 2) addSuit(`${nMisc} misconduct offenses`, 'BN', '4-2f(2)(a)1');
  if (nMisc + nMinor >= 4) addSuit(`${nMisc + nMinor} combined nontraffic/misconduct offenses`, 'BN', '4-2f(2)(a)2');

  /* ── Overall status ── */
  const authority = waivers.some(w => w.authority === 'USARD') ? 'USARD' : (waivers.length ? 'BN' : null);
  let status;
  if (bars.length) status = 'NOT_WAIVABLE';
  else if (waivers.length) status = waits.some(w => w.needDate || w.daysLeft > 0) ? 'WAITING_PERIOD' : 'WAIVABLE';
  else if (etp) status = 'ETP_REQUIRED';
  else if (offenses.length) status = 'NO_WAIVER_REQUIRED';
  else status = 'PENDING';

  return { status, authority, bars, waivers, waits, suitability, notes, etp,
           permBar: bars.some(b => b.perm), waivedIds,
           counts:{ major:nMaj, misc:nMisc, minor:nMinor, traffic:traffics.length, dat:dats.length } };
};

// UNOFFICIAL approval-odds estimate — weights are heuristic, not regulatory.
const computeApprovabilityScore = (applicant, verdict) => {
  if (!verdict || !verdict.waivers.length || verdict.bars.length) return null;
  let score = 60;
  const factors = [];

  const authMod = APPROVABILITY_FACTORS.authorityMods[verdict.authority] || 0;
  if (authMod) { factors.push({ label:`${verdict.authority} level authority`, mod:authMod }); score += authMod; }

  const cnt = verdict.waivedIds.length;
  const cntMod = cnt <= 1 ? 15 : cnt === 2 ? -10 : cnt === 3 ? -20 : -35;
  factors.push({ label:`${cnt} offense(s) in waiver`, mod:cntMod }); score += cntMod;

  const waivedDates = (applicant.offenses||[]).filter(o => o.offenseDate && verdict.waivedIds.includes(o.id)).map(o => o.offenseDate).sort().reverse();
  if (waivedDates[0]) {
    const y = yearsSince(waivedDates[0]);
    const tf = APPROVABILITY_FACTORS.timeFactors.find(t => y <= t.yearsAgo) || APPROVABILITY_FACTORS.timeFactors[APPROVABILITY_FACTORS.timeFactors.length-1];
    if (tf.mod) { factors.push({ label:tf.label, mod:tf.mod }); score += tf.mod; }
  }

  const afqt = parseInt(applicant.afqt);
  if (!isNaN(afqt)) {
    const am = APPROVABILITY_FACTORS.afqtMods.find(a => afqt >= a.min);
    if (am && am.mod) { factors.push({ label:am.label, mod:am.mod }); score += am.mod; }
  }

  const eduMod = APPROVABILITY_FACTORS.educationMods[applicant.educationLevel] ?? 0;
  if (eduMod) { factors.push({ label:applicant.educationLevel, mod:eduMod }); score += eduMod; }

  if ((applicant.offenses||[]).some(o => verdict.waivedIds.includes(o.id) && isJuvenileOffense(applicant, o))) {
    factors.push({ label:'Juvenile offense', mod:APPROVABILITY_FACTORS.juvenileMod }); score += APPROVABILITY_FACTORS.juvenileMod;
  }
  if (verdict.counts.major === 0) {
    factors.push({ label:'No major misconduct', mod:APPROVABILITY_FACTORS.firstOffenseMod }); score += APPROVABILITY_FACTORS.firstOffenseMod;
  }

  return { score: Math.max(5, Math.min(95, Math.round(score))), factors };
};

// Confinement/probation drive extra checklist items (4-28e(2)/(3), FL 601-210.04)
const offenseFlags = (offenses) => {
  const cats = offenses.map(o => catOf(o.categoryId)).filter(Boolean);
  return {
    trafficOnly: offenses.length > 0 && cats.every(c => c.class === 'traffic'),
    anyProbation: offenses.some(o => o.probation === 'completed' || o.probation === 'active'),
    anyConfined: offenses.some(o => ['under24','1to14','15plus'].includes(o.confinement)),
    anyConfined24: offenses.some(o => ['1to14','15plus'].includes(o.confinement)),
  };
};

const getRequiredChecklist = (authority, flags = {}) => {
  return CHECKLIST_ITEMS.filter(item => {
    switch (item.group) {
      case 'all': return true;
      case 'non_traffic': return !flags.trafficOnly;
      case 'usard':
      case 'major': return authority === 'USARD';
      case 'probation': return !!flags.anyProbation;
      case 'confined': return !!flags.anyConfined;
      case 'confined_24plus': return !!flags.anyConfined24;
      default: return false;
    }
  });
};

const computeReadiness = (applicant, verdict, clStatus) => {
  let score = 0;
  const breakdown = [];

  const caseDone = CASE_QUESTIONS.every(q => (applicant.caseAnswers||{})[q.id]);
  if (caseDone) { score += 10; breakdown.push({ label:'Case screening complete', done:true }); }
  else breakdown.push({ label:'Case screening', done:false });

  if ((applicant.offenses||[]).length > 0) { score += 10; breakdown.push({ label:'Offenses logged', done:true }); }
  else breakdown.push({ label:'Offense record', done:false });

  const infoFilled = ['lastName','firstName','dob','rsid'].every(f => applicant[f]);
  if (infoFilled) { score += 15; breakdown.push({ label:'Applicant info complete', done:true }); }
  else breakdown.push({ label:'Applicant info', done:false });

  const required = getRequiredChecklist(verdict?.authority || 'BN', offenseFlags(applicant.offenses||[]));
  const completedItems = required.filter(i => clStatus[i.id] === 'complete').length;
  score += required.length > 0 ? Math.round((completedItems / required.length) * 65) : 0;
  breakdown.push({ label:`Checklist (${completedItems}/${required.length})`, done: completedItems === required.length && required.length > 0 });

  return { score: Math.min(100, score), breakdown };
};

/* ── Department of War seal (memorandum letterhead) ──────────────────────
   The memo prints from a document.write() popup, where relative paths do not
   reliably resolve. Preload the seal as a data URI so the generated memo is
   self-contained; fall back to an absolute URL if the fetch is unavailable
   (e.g. opened over file://).
   ─────────────────────────────────────────────────────────────────────── */
const SEAL_PATH = '../assets/logos/memo-emblem.jpg';
const sealHref = () => { try { return new URL(SEAL_PATH, location.href).href; } catch { return SEAL_PATH; } };
let SEAL_DATA_URL = null;
(async () => {
  try {
    const res = await fetch(sealHref());
    if (!res.ok) return;
    const blob = await res.blob();
    const fr = new FileReader();
    fr.onload = () => { SEAL_DATA_URL = fr.result; };
    fr.readAsDataURL(blob);
  } catch { /* fall back to the absolute URL */ }
})();

/* ── UF 601-210.08 PDF Generator ─────────────────────── */
function buildDatasetsXML(applicant, screenedOffenses, waivedIds = []) {
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtD = iso => {
    if (!iso) return '';
    try { const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; } catch { return ''; }
  };
  const calcAge = (fromIso, toIso) => {
    if (!fromIso || !toIso) return '';
    try {
      const [by,bm,bd] = fromIso.split('-').map(Number);
      const [ty,tm,td] = toIso.split('-').map(Number);
      let age = ty - by;
      if (tm < bm || (tm === bm && td < bd)) age--;
      return age >= 0 ? String(age) : '';
    } catch { return ''; }
  };
  const name = [applicant.lastName, [applicant.firstName, applicant.mi].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const currentAge = calcAge(applicant.dob, new Date().toISOString().split('T')[0]);
  const sorted = sortNewest(screenedOffenses.filter(so=>so.offenseDate||so.description));
  const get = i => sorted[i] || {};
  const tf = v => v ? `<TextField2>${esc(v)}</TextField2>` : '<TextField2/>';
  const df = v => v ? `<DateField2>${esc(v)}</DateField2>` : '<DateField2/>';
  const nf = v => v ? `<NumericField2>${esc(v)}</NumericField2>` : '<NumericField2/>';
  const rowXML = i => {
    const o = get(i);
    const age = calcAge(applicant.dob, o.offenseDate);
    const star = o.id && waivedIds.includes(o.id) ? '*' : '';
    const desc = o.description || (OFFENSE_CATEGORIES.find(c=>c.id===o.categoryId)?.label) || '';
    return `${df(fmtD(o.offenseDate))}\n${nf(age)}\n${tf(star + desc)}\n${tf(o.dispositionText||'')}\n`;
  };
  let xml = `<xfa:datasets xmlns:xfa="http://www.xfa.org/schema/xfa-data/1.0/">\n<xfa:data>\n<topmostSubform>\n`;
  xml += tf(applicant.maritalStatus) + '\n';
  xml += `<RadioButtonList>${esc(applicant.psNps||'')}</RadioButtonList>\n`;
  xml += rowXML(0);
  for (let i=0;i<7;i++) xml += '<TextField2/>\n';
  for (let i=1;i<=16;i++) xml += rowXML(i);
  xml += tf(applicant.dependentAges) + '\n';
  xml += tf(applicant.numDependents) + '\n';
  xml += tf(name) + '\n';
  xml += tf(currentAge) + '\n';
  xml += tf(applicant.educationCode||applicant.educationLevel||'') + '\n';
  xml += tf(applicant.afqt) + '\n';
  for (let i=17;i<=41;i++) xml += rowXML(i);
  xml += '</topmostSubform>\n</xfa:data>\n</xfa:datasets>';
  return xml;
}

async function generateFilledUF608(applicant, offenses, waivedIds, onProgress, templateBytes = null) {
  let origBytes = templateBytes;

  if (!origBytes) {
    onProgress('Trying to locate PDF template automatically...');

    // Try several likely locations (important because people move this HTML around)
    const candidates = [
      './uf-601-210-08.pdf',
      './UF 601-210.08.pdf',
      './UF 601-210_08.pdf',
      '../Regulations/UF 601-210.08.pdf',
      '../Regulations/uf-601-210-08.pdf',
      '../Regulations/UF 601-210_08_1.pdf',
      '../Regulations/UF 601-210.08.pdf'
    ];

    let usedPath = '';

    for (const path of candidates) {
      try {
        const resp = await fetch(path);
        if (resp.ok) {
          origBytes = new Uint8Array(await resp.arrayBuffer());
          usedPath = path;
          console.log('[UF608] Auto-loaded template from:', usedPath);
          break;
        }
      } catch (e) {
        // ignore and try next
      }
    }
  } else {
    console.log('[UF608] Using manually selected PDF template');
  }

  if (!origBytes) {
    throw new Error(
      'Could not load the blank UF 601-210.08 PDF template.\n\n' +
      'The file exists in your folder but the automatic lookup failed.\n\n' +
      'Please use the "Select Blank UF 601-210.08 PDF" button below to manually pick the file. Once selected, the generator will use it directly.\n\n' +
      'You can also use the "Copy Text Version" button — it always works.'
    );
  }

  onProgress('Building XFA datasets...');
  const xml = buildDatasetsXML(applicant, offenses, waivedIds);
  const xmlBytes = new TextEncoder().encode(xml);
  onProgress('Compressing...');
  const compressed = pako.deflate(xmlBytes);
  const tail = new TextDecoder('utf-8',{fatal:false}).decode(origBytes.slice(-512));
  const prevMatch = tail.match(/startxref\s+(\d+)/g);
  const prevXref = prevMatch ? parseInt(prevMatch[prevMatch.length-1].match(/\d+/)[0]) : 0;
  const enc = new TextEncoder();
  const sep = enc.encode('\n');
  const objHeader = enc.encode(`72 0 obj\n<<\n/Filter [/FlateDecode]\n/Length ${compressed.length}\n/Type /EmbeddedFile\n>>\nstream\n`);
  const objFooter = enc.encode('\nendstream\nendobj\n');
  const newObj72At = origBytes.length + sep.length;
  const xrefAt = newObj72At + objHeader.length + compressed.length + objFooter.length;
  const xrefEntry = `${String(newObj72At).padStart(10,'0')} 00000 n \r\n`;
  const xrefBlock = enc.encode(`xref\n72 1\n${xrefEntry}`);
  const trailerBlock = enc.encode(`trailer\n<<\n/Size 100\n/Prev ${prevXref}\n>>\nstartxref\n${xrefAt}\n%%EOF\n`);
  onProgress('Assembling PDF...');
  const parts = [origBytes, sep, objHeader, compressed, objFooter, xrefBlock, trailerBlock];
  const total = parts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(total);
  let pos=0; for (const p of parts){result.set(p,pos);pos+=p.length;}
  return result;
}

/* ══════════════════════════════════════════════════════════════════════
   PRESENTATION LAYER — QC redesign
   The regulation engine above is authoritative; everything here maps its
   output onto the design's verdict states, accents, and copy.

const C_RED='#CF0000', C_REDFG='#FF6B6B', C_ORANGE='#F16521',
      C_GOLD='#FFCC01', C_GREEN='#2DAA27', C_MUTED='#98948E', C_BLACK='#221F20';

const CLS = {
  bar:     { accent:C_RED,    tagBg:'rgba(207,0,0,.15)',    tag:'Bar' },
  major:   { accent:C_ORANGE, tagBg:'rgba(241,101,33,.15)', tag:'Major' },
  misc:    { accent:C_GOLD,   tagBg:'rgba(255,204,1,.12)',  tag:'Misconduct' },
  dat:     { accent:C_ORANGE, tagBg:'rgba(241,101,33,.15)', tag:'DAT' },
  minor:   { accent:C_MUTED,  tagBg:'rgba(255,255,255,.08)',tag:'Minor' },
  traffic: { accent:C_MUTED,  tagBg:'rgba(255,255,255,.08)',tag:'Traffic' },
  ps:      { accent:C_MUTED,  tagBg:'rgba(255,255,255,.08)',tag:'Prior svc' },
};
const clsOf = c => CLS[c?.class] || CLS.minor;

/* Resolve any citation string the engine emits to a PARA_TEXT key. */
const resolvePara = (cite) => {
  if (!cite) return '4-6';
  let raw = String(cite).replace(/^AR 601-210[,·]?\s*/i,'').replace(/^para\s*/i,'').trim();
  if (PARA_TEXT[raw]) return raw;
  const head = raw.split(/[/·]/)[0].trim();
  if (PARA_TEXT[head]) return head;
  const m = head.match(/^(\d+-\d+[a-z]?)/);
  if (m) {
    if (PARA_TEXT[m[1]]) return m[1];
    const base = m[1].replace(/[a-z]$/,'');
    if (PARA_TEXT[base]) return base;
  }
  return '4-6';
};

/* Map the engine verdict onto the banner's design states. */
const bannerFor = (verdict) => {
  const muted = { authBg:'rgba(255,255,255,.08)', authFg:C_MUTED };
  if (!verdict || verdict.status === 'PENDING') return {
    tag:'No record entered', title:'Clean so far', accent:C_MUTED, authority:'Nothing to waive', ...muted,
    body:'Answer the gates and add any offense to get a ruling. Dismissed charges are still listed on the SF 86 and UF 601-210.08.',
    cite:'4-30' };

  if (verdict.status === 'NOT_WAIVABLE') {
    const perm = verdict.bars.filter(b => b.perm);
    if (perm.length) return {
      tag:'Permanent bar', title:'Not waivable', accent:C_RED, authority:'No waiver authority',
      authBg:'rgba(207,0,0,.18)', authFg:C_REDFG,
      body: perm.length === 1 ? perm[0].text
        : `${perm.length} permanent bars are on the record. No waiver will be approved at any level — stop the packet and counsel the applicant.`,
      cite: perm[0].cite };
    const t = verdict.bars[0];
    return {
      tag:'Processing stopped', title:'On hold', accent:C_ORANGE, authority:'Cannot submit',
      authBg:'rgba(241,101,33,.18)', authFg:C_ORANGE,
      body:`Resolve before anything else: ${verdict.bars.map(b=>b.title.toLowerCase()).join(', ')}. No waiver may be submitted while this is open.`,
      cite: t.cite };
  }

  if (verdict.status === 'ETP_REQUIRED') return {
    tag:'Court check required', title:'Verify first', accent:C_ORANGE, authority:'Confirm with S1',
    authBg:'rgba(241,101,33,.18)', authFg:C_ORANGE,
    body:'A self-admitted offense has no court record. Run the court check first — UF 601-210.02 if the court will not furnish records — then coordinate with the battalion S1. An exception to policy may be required before waiver processing.',
    cite:'4-30' };

  if (verdict.status === 'NO_WAIVER_REQUIRED') return {
    tag:'No waiver required', title:'No waiver', accent:C_GREEN, authority:'Recruiter level',
    authBg:'rgba(45,170,39,.18)', authFg:C_GREEN,
    body:'Nothing on the record rises to a waiver. Every offense must still be listed on the UF 601-210.08, SF 86, and RZ.',
    cite: verdict.notes[0]?.cite || '4-6' };

  // WAIVABLE / WAITING_PERIOD
  const usard = verdict.authority === 'USARD';
  const primary = verdict.waivers[0];
  const waiting = verdict.status === 'WAITING_PERIOD';
  const reasons = verdict.waivers.map(w => w.label).join('; ');
  return {
    tag: waiting ? 'Waiver required — waiting period' : 'Waiver required',
    title: usard ? 'USARD waiver' : 'BN CO waiver',
    accent: C_GOLD, authority: usard ? 'CG USARD' : 'Battalion commander',
    authBg:C_GOLD, authFg:C_BLACK,
    body: `${reasons}.${usard ? ' Requires CG USARD approval and a 24-month wait from the conviction date.' : ''}${waiting ? ' A mandatory waiting period has not been met — the packet can be built but not submitted yet.' : ''}`,
    cite: primary ? primary.cite : '4-6' };
};

const displayScore = (verdict, approv) => {
  if (!verdict || verdict.status === 'PENDING') return 100;
  if (verdict.status === 'NOT_WAIVABLE') return verdict.permBar ? 0 : 35;
  if (verdict.status === 'NO_WAIVER_REQUIRED') return 92;
  if (verdict.status === 'ETP_REQUIRED') return 50;
  return approv ? approv.score : 60;
};

const displayFactors = (verdict, approv) => {
  if (approv && approv.factors.length) return approv.factors.map(f => ({
    sign: f.mod > 0 ? '+' : '−',
    color: f.mod > 0 ? C_GREEN : (f.mod <= -20 ? C_RED : C_ORANGE),
    label: f.label }));
  if (verdict && verdict.bars.length) return verdict.bars.map(b => ({
    sign:'−', color: b.perm ? C_RED : C_ORANGE, label: b.title }));
  return [];
};

const nextActions = (applicant, verdict, clStatus, expDates) => {
  const out = [];
  if (!verdict) return out;
  verdict.bars.filter(b => !b.perm).forEach(b => out.push(`Resolve: ${b.title.toLowerCase()}`));
  const noDisp = (applicant.offenses||[]).filter(o => {
    const c = catOf(o.categoryId) || {};
    return !o.disposition && c.group !== 'dat' && c.class !== 'ps';
  });
  if (noDisp.length) out.push(`Set the court disposition on ${noDisp.length} offense${noDisp.length>1?'s':''}`);
  const req = getRequiredChecklist(verdict.authority || 'BN', offenseFlags(applicant.offenses||[]));
  req.filter(i => i.validity).forEach(i => {
    const d = daysUntilExpiry(expDates[i.id], i.validity);
    if (d !== null && d < 0) out.push(`Re-run ${i.label} — expired`);
  });
  if (!applicant.lastName || !applicant.firstName) out.push('Add the applicant name to the case file');
  if (!applicant.rsid) out.push('Add the RSID to the case file');
  if (!applicant.afqt) out.push('Add the AFQT score to the case file');
  req.filter(i => clStatus[i.id] !== 'complete').slice(0,3).forEach(i => out.push(`Obtain ${i.label}`));
  return out.slice(0,6);
};

const dispLabel = (v) => ({ convicted:'Convicted', adverse:'Adverse disposition',
  dismissed:'Dismissed', self_admit:'Self-admitted' }[v] || 'No disposition set');

const shortOpt = (qid, v) => qid === 'dependence'
  ? ({ no:'None', remission:'Remission', yes:'Current' }[v] || v)
  : ({ no:'No', yes:'Yes', active:'Active', unsupervised:'Unsupervised' }[v] || v);

const isBadOpt = v => v === 'yes' || v === 'active';

  if (o.convictionDate && o.convictionDate > todayStr) warnings.push('Conviction date is in the future.');

          </select>
          <div className="fnote">Diversion, deferred adjudication, fines, and probated sentences all count as adverse dispositions (4-30b). Expunged and sealed records still count.</div>
        </div>
      )}

      {!isDat && !isPs && !isTraffic && isAdverse(o) && (

          <div className="field">
            <label className="flabel">Confinement served</label>

            </div>
          )}
          <div className="field">
            <label className="flabel">Probation / parole</label>
            <select className="finput" value={o.probation||'no'} onChange={set('probation')}>

      )}

      {warnings.map((w,i) => (
        <div key={i} className="warnline"><span>⛔</span><span>{w}</span></div>
      ))}

      <div className="field">
        <label className="flabel">Description — as it appears on UF 601-210.08</label>

        <>
          <div className="fgrid-3">

            </div>

              <label className="flabel">County</label>
              <input className="finput" value={o.county||''} onChange={set('county')} placeholder="County"/>

/* ── Phase 1: Screen ─────────────────────────────────────────────────── */
const PhaseScreen = ({ applicant, setApplicant, verdict, openRef, openTables }) => {
  const [query, setQuery] = useState('');
  const [editId, setEditId] = useState(null);
  const [comboOpen, setComboOpen] = useState(false);

  const ca = applicant.caseAnswers || {};
  const offenses = sortNewest(applicant.offenses || []);
  const setCase = (qid, v) => setApplicant(prev => ({ ...prev, caseAnswers:{ ...(prev.caseAnswers||{}), [qid]:v } }));
  const updateOffenses = offs => setApplicant(prev => ({ ...prev, offenses:offs }));
  const patch = (id, p) => updateOffenses((applicant.offenses||[]).map(o => o.id === id ? {...o, ...p} : o));
  const remove = id => { updateOffenses((applicant.offenses||[]).filter(o => o.id !== id)); if (editId === id) setEditId(null); };

  const add = (catId) => {
    const cat = catOf(catId);
    const o = { id:`o${Date.now()}${Math.floor(Math.random()*1e3)}`, categoryId:catId,
      offenseDate:'', convictionDate:'',
      disposition:(cat.group === 'dat' || cat.class === 'ps') ? 'convicted' : '',
      confinement:'no', releaseDate:'', probation:'no',
      description:'', city:'', county:'', state:'', dispositionText:'', courtDocs:false, incidentRpt:false };
    updateOffenses([...(applicant.offenses||[]), o]);
    setQuery(''); setComboOpen(false); setEditId(o.id);
  };

  const q = query.trim().toLowerCase();
  const counts = {};
  (applicant.offenses||[]).forEach(o => { counts[o.categoryId] = (counts[o.categoryId]||0) + 1; });
  const results = OFFENSE_CATEGORIES.filter(c =>
    !q || (c.label + ' ' + (c.sub||'')).toLowerCase().includes(q));

  return (
    <div className="col-760">
      <div>
        <div className="sec-hd">
          <div className="sec-label">Eligibility gates</div>
          <div className="sec-note">Five questions. Any red answer stops the packet.</div>
        </div>
        <div className="panel">
          {CASE_QUESTIONS.map(gq => {
            const para = (Q_PARA_MAP[gq.id]||[]).filter(p => PARA_TEXT[p])[0];
            return (
              <div key={gq.id} className="gate">
                <div style={{flex:1,minWidth:0}}>
                  <div className="gate-q">{gq.q}</div>
                  <div className="gate-hint">
                    {gq.hint}{para && <> <button className="cite" onClick={()=>openRef(para)}>{para}</button></>}
                  </div>
                </div>
                <div className="seg">
                  {gq.options.map(opt => {
                    const on = ca[gq.id] === opt.v;
                    const bad = isBadOpt(opt.v);
                    return (
                      <button key={opt.v} title={opt.l}
                        className={`seg-btn${on?' on':''}${bad?' bad':''}`}
                        onClick={()=>setCase(gq.id, opt.v)}>{shortOpt(gq.id, opt.v)}</button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="sec-hd">
          <div className="sec-label">Offense record</div>
          <div className="sec-note">
            {offenses.length} {offenses.length === 1 ? 'entry' : 'entries'} · list every offense, including traffic — the regulation counts them.{' '}
            <button className="cite" onClick={openTables}>Offense chart</button>
          </div>
        </div>

        {offenses.length > 0 && (
          <div className="stack">
            {offenses.map(o => {
              const cat = catOf(o.categoryId) || {};
              const c = clsOf(cat);
              const waived = (verdict?.waivedIds||[]).includes(o.id);
              const meta = [
                dispLabel(o.disposition),
                o.offenseDate ? fmtDate(o.offenseDate) : 'no date',
                o.courtDocs ? 'court docs on file' : null,
              ].filter(Boolean).join(' · ');
              return (
                <React.Fragment key={o.id}>
                  <div className="srow" style={{borderLeftColor:c.accent}}>
                    <button className="srow-main" onClick={()=>setEditId(editId===o.id?null:o.id)}>
                      <div className="srow-label">{waived && <span style={{color:C_GOLD}}>★ </span>}{o.description || cat.label}</div>
                      <div className="srow-meta">{meta}</div>
                    </button>
                    <div className="stag" style={{background:c.tagBg,color:c.accent}}>{c.tag}</div>
                    <button className="srow-edit" onClick={()=>setEditId(editId===o.id?null:o.id)}>
                      {editId===o.id?'Close':'Edit'}
                    </button>
                    <button className="srow-x" onClick={()=>remove(o.id)} title="Remove this offense">✕</button>
                  </div>
                  {editId === o.id && (
                    <OffenseEditor o={o} applicant={applicant}
                      onChange={p=>patch(o.id,p)} onDone={()=>setEditId(null)}/>

        <div className="combo">

            <span style={{color:C_MUTED,fontSize:13}}>+</span>

              onFocus={()=>setComboOpen(true)}
              placeholder="Add an offense — search charge, code, or keyword"/>
            <span className="combo-count">{comboOpen ? `${results.length} available` : 'Search'}</span>
          </div>
          {comboOpen && (
            <div className="combo-list">
              {results.length === 0 && <div className="combo-empty">No offense matches “{query}”.</div>}
              {results.map(cat => {
                const c = clsOf(cat);
                const n = counts[cat.id] || 0;
                return (
                  <button key={cat.id} className="combo-item" onClick={()=>add(cat.id)}>
                    <div className="combo-tag" style={{color:c.accent}}>{c.tag}</div>

          <div className="notes">
            {verdict.notes.map((n,i) => (
              <div key={i} className="note">
                <span className="note-mark">·</span>
                <span>{n.label} <button className="cite" onClick={()=>openRef(resolvePara(n.cite))}>{n.cite}</button></span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

/* ── Phase 2: Build packet ───────────────────────────────────────────── */
const PhasePacket = ({ applicant, requiredItems, clStatus, setClStatus, expDates, setExpDates }) => {
  const [open, setOpen] = useState({});
  const toggle = id => setClStatus(p => ({...p, [id]: p[id]==='complete' ? 'pending' : 'complete'}));

  const chipFor = (item) => {
    const done = clStatus[item.id] === 'complete';
    if (item.validity) {
      const d = daysUntilExpiry(expDates[item.id], item.validity);
      if (d === null) return { cls:'chip-none', text:'No date' };
      if (d < 0) return { cls:'chip-red', text:`Expired ${Math.abs(d)}d` };
      if (d <= 30) return { cls:'chip-warn', text:`${d}d left` };
      return { cls:'chip-ok', text:`${d}d left` };
    }
    if (done) return { cls:'chip-ok', text:'On file' };
    if (clStatus[item.id] === 'progress') return { cls:'chip-warn', text:'In progress' };
    return { cls:'chip-none', text:'Missing' };
  };

  return (
    <div className="col-820">
      <div className="sec-hd" style={{marginBottom:14}}>
        <div className="sec-label">Packet build</div>
        <div className="sec-note">Only the documents this case actually requires. Expirations tracked in place.</div>
      </div>
      <div className="panel" style={{marginTop:0}}>
        {requiredItems.map(item => {
          const done = clStatus[item.id] === 'complete';
          const chip = chipFor(item);
          const isOpen = !!open[item.id];
          return (
            <React.Fragment key={item.id}>
              <div className="crow">
                <button className={`cbox${done?' on':''}`} onClick={()=>toggle(item.id)}
                  title={done?'Mark not on file':'Mark on file'}>{done ? '✓' : ''}</button>
                <div style={{minWidth:0}}>
                  <button className={`clabel${done?' on':''}`}
                    onClick={()=>setOpen(p=>({...p,[item.id]:!p[item.id]}))}>{item.label}</button>
                  <div className="cref">{item.ref}{item.note ? ` · ${item.note}` : ''}</div>
                </div>
                <div className="cvalidity">
                  {item.validity ? (
                    <>
                      Valid {item.validity} {item.unit}
                      <input className="cdate" type="date" value={expDates[item.id]||''}
                        onChange={e=>setExpDates(p=>({...p,[item.id]:e.target.value}))}/>
                    </>
                  ) : 'No expiration'}
                </div>
                <div className={`cchip ${chip.cls}`}>{chip.text}</div>
              </div>
              {isOpen && item.howto && (
                <div className="chowto">
                  {item.howto}
                  {item.tip && <div className="chowto-tip">{item.tip}</div>}
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
};

/* ── UF 601-210.08 generator card ────────────────────────────────────── */
const UF608Card = ({ applicant, offenses, waivedIds }) => {
  const [status, setStatus] = useState('idle');
  const [msg, setMsg] = useState('');
  const [tpl, setTpl] = useState(null);
  const can = offenses.some(o => o.offenseDate || o.description);

  const pickTemplate = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { setTpl(new Uint8Array(r.result)); setMsg(`Template loaded: ${file.name}`); setStatus('idle'); };
    r.onerror = () => { setMsg('Could not read that PDF.'); setStatus('error'); };
    r.readAsArrayBuffer(file);
  };

  const build = async () => {
    setStatus('loading'); setMsg('Starting…');
    try {
      const bytes = await generateFilledUF608(applicant, offenses, waivedIds, m=>setMsg(m), tpl);
      const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
      const a = document.createElement('a');
      a.href = url; a.download = `UF-601-210.08-${(applicant.lastName||'applicant').toUpperCase()}.pdf`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('done'); setMsg('Downloaded — open with Adobe Acrobat Reader.');
    } catch (e) { setStatus('error'); setMsg(e.message); }
  };

  const copyText = () => {
    const lines = [];
    lines.push('UF 601-210.08 — RECORD OF ALL LAW VIOLATIONS');
    lines.push(`Applicant: ${[applicant.firstName, applicant.mi, applicant.lastName].filter(Boolean).join(' ')}`);
    lines.push(`RSID: ${applicant.rsid || ''}    AFQT: ${applicant.afqt || ''}`);
    lines.push('All offenses listed newest to oldest. Waived offenses marked with ★');
    lines.push('');
    sortNewest(offenses).forEach((o, i) => {
      const cat = catOf(o.categoryId);
      const date = o.offenseDate ? localDate(o.offenseDate).toLocaleDateString() : 'Unknown date';
      lines.push(`${i+1}. ${waivedIds.includes(o.id) ? '★ ' : ''}${date} — ${cat?.label || o.categoryId}`);
      if (o.description) lines.push(`   Description: ${o.description}`);
      if (o.dispositionText) lines.push(`   Disposition: ${o.dispositionText}`);
      if (o.city || o.state) lines.push(`   Location: ${[o.city, o.state].filter(Boolean).join(', ')}`);
      lines.push('');
    });
    const text = lines.join('\n');
    navigator.clipboard.writeText(text).then(
      () => { setMsg('Text version copied — paste into the form.'); setStatus('done'); },
      () => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        setMsg('Text version copied — paste into the form.'); setStatus('done');
      });
  };

  const msgColor = status === 'error' ? C_REDFG : status === 'done' ? C_GREEN : C_MUTED;

  return (
    <div className="outcard">
      <div className="outkind" style={{color:C_MUTED}}>Form</div>
      <div className="outname">UF 601-210.08</div>
      <div className="outdesc">
        Record of offenses — every entry on the record, newest to oldest, with waived offenses asterisked.
        Fills the XFA form for Adobe Acrobat Reader.
      </div>
      {msg && <div style={{fontSize:12,color:msgColor,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{msg}</div>}
      <div className="outbtns">
        <button className="btn-gold" disabled={!can || status==='loading'} onClick={build}>
          {status === 'loading' ? 'Building…' : 'Build'}
        </button>
        <button className="btn-line" disabled={!can} onClick={copyText}>Copy text</button>
        <label className="btn-line" style={{cursor:'pointer'}}>
          Template
          <input type="file" accept=".pdf" style={{display:'none'}} onChange={pickTemplate}/>
        </label>
      </div>
    </div>
  );
};

/* ── Phase 3: Generate ───────────────────────────────────────────────── */
const PhaseGenerate = ({ applicant, verdict, clStatus, requiredItems }) => {
  const [preview, setPreview] = useState(null);
  const docs = makeDocs(applicant, verdict, clStatus);
  const offenses = applicant.offenses || [];
  const waivedIds = verdict?.waivedIds || [];

  const missing = [];
  if (!applicant.lastName || !applicant.firstName) missing.push('applicant name');
  if (!applicant.rsid) missing.push('RSID');
  if (!applicant.afqt) missing.push('AFQT score');
  if (!applicant.recruiterUnit) missing.push('unit designation');
  if (!offenses.some(o => o.description)) missing.push('offense descriptions');

  const cards = [
    { id:'routing',   kind:'Memorandum', accent:C_GOLD,  name:'Routing / Transmittal Memo',
      desc:'Routes the finished packet to the battalion S1 with the offense list, approving authority, and document index.',
      gen:docs.genRouting, fmt:'text' },
    { id:'statement', kind:'Memorandum', accent:C_GOLD,  name:"Applicant's Statement",
      desc:'Pre-filled structure with offense-specific prompts. The applicant personalizes it in their own words, then signs.',
      gen:docs.genStatement, fmt:'text' },
    { id:'mfr',       kind:'Memorandum', accent:C_GOLD,  name:'Commander Interview MFR',
      desc:'AR 25-50 memorandum with letterhead, fill-in lines, and the approve / disapprove recommendation block.',
      gen:docs.genMFR, fmt:'html' },
    { id:'cover',     kind:'Packet',     accent:C_GREEN, name:'Submission Cover Sheet',
      desc:'Index of everything attached, in the order the battalion S1 expects it, with the current document status.',
      gen:docs.genCoverSheet, fmt:'text' },
  ];

  return (
    <div className="col-900">
      <div>
        <div className="sec-hd" style={{marginBottom:14}}>
          <div className="sec-label">Generate</div>
          <div className="sec-note">Pre-filled from the case file. Review before signature.</div>
        </div>
        {missing.length > 0 && (
          <div className="warnline" style={{marginBottom:14}}>
            <span>⚠</span>
            <span>Documents will print with placeholders — still missing: {missing.join(', ')}. Add them in the case file.</span>
          </div>
        )}
        <div className="outgrid">
          {cards.map(c => (
            <div key={c.id} className="outcard">
              <div className="outkind" style={{color:c.accent}}>{c.kind}</div>
              <div className="outname">{c.name}</div>
              <div className="outdesc">{c.desc}</div>
              <div className="outbtns">
                <button className="btn-gold" onClick={()=>printDoc(c.gen(), c.fmt)}>Build</button>
                <button className="btn-line" onClick={()=>setPreview({...c, content:c.gen()})}>Preview</button>
              </div>
            </div>
          ))}
          <UF608Card applicant={applicant} offenses={offenses} waivedIds={waivedIds}/>
          <div style={{background:'var(--s3)'}}/>
        </div>
      </div>

      {preview && (
        <div>
          <div className="memo-label">{preview.name} — preview</div>
          {preview.fmt === 'html'
            ? <iframe className="memo-frame" srcDoc={preview.content} title="Preview"/>
            : <div className="memo">{preview.content}</div>}
          <div className="outbtns" style={{marginTop:10}}>
            <button className="btn-gold" onClick={()=>printDoc(preview.content, preview.fmt)}>Print</button>
            <button className="btn-line" onClick={()=>setPreview(null)}>Close preview</button>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── Right rail ──────────────────────────────────────────────────────── */
const Rail = ({ applicant, verdict, banner, approv, clStatus, expDates }) => {
  const score = displayScore(verdict, approv);
  const factors = displayFactors(verdict, approv);
  const actions = nextActions(applicant, verdict, clStatus, expDates);
  const waits = verdict?.waits || [];
  const suitability = verdict?.suitability || [];

  return (
    <div className="rail">
      <div className="rail-sec">
        <div className="rail-hd">
          <div className="rail-dot" style={{background:banner.accent}}/>
          <div className="rail-label">Case status</div>
        </div>
      </div>

      {waits.length > 0 && (
        <div className="rail-sec rail-clock">
          <div className="rail-label">Waiting period</div>
          {waits.map(w => (
            <div key={w.id} style={{marginTop:8}}>
              <div className="rail-clock-body">{w.label}</div>
              <div className="rail-clock-meta">
                {w.needDate
                  ? 'Enter the required date on this offense to calculate the earliest submission.'
                  : <>Earliest submission {w.earliest.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})} · <strong style={{color:C_ORANGE}}>{w.daysLeft} days remaining</strong>. Clock from {fmtDate(w.from)} — {w.cite}.{w.note ? ` ${w.note}` : ''}</>}
              </div>
            </div>
          ))}
        </div>
      )}

      {suitability.length > 0 && (
        <div className="rail-sec">
          <div className="rail-label">Suitability review</div>
          {suitability.map((s,i) => (
            <div key={i} className="suit">
              <span style={{color:C_MUTED,flex:'none'}}>·</span>
              <span>{s.label} — <strong style={{color:'var(--t1)'}}>{s.level === 'USARD' ? 'CG USARD' : 'BN CO'}</strong> <span className="note-cite">({s.cite})</span></span>
            </div>
          ))}
        </div>
      )}

      <div className="rail-sec">
        <div className="score-hd">
          <div className="rail-label">Approvability</div>
          <div className="score-num" style={{color:banner.accent}}>{score}</div>
        </div>
        <div className="score-track"><div className="score-fill" style={{width:`${score}%`,background:banner.accent}}/></div>
        {factors.length > 0 && (
          <div className="factors">
            {factors.map((f,i) => (
              <div key={i} className="factor">
                <span className="factor-sign" style={{color:f.color}}>{f.sign}</span>
                <span>{f.label}</span>
              </div>
            ))}
          </div>
        )}
        <div className="rail-disclaimer">
          Unofficial estimate — not from regulation. The outcome depends on the commander interview, the applicant statement, and command climate. Do not share this with the applicant.
        </div>
      </div>

      {actions.length > 0 && (
        <div className="rail-sec">
          <div className="rail-label">Next actions</div>
          <div className="actions">
            {actions.map((a,i) => (
              <div key={i} className="action"><span className="action-arrow">→</span><span>{a}</span></div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

/* ── Reference drawer ──────────────────────────────────────────────────
   Two views: the paragraph text, and the Chapter 4 offense-code tables
   (4-1 through 4-4) showing how each offense is classified for waivers.
   ─────────────────────────────────────────────────────────────────────── */
const OffenseTables = () => {
  const [q, setQ] = useState('');
  const term = q.trim().toLowerCase();
  const tables = OFFENSE_TABLES.map(t => ({
    ...t,
    rows: term ? t.rows.filter(r => (r[0] + ' ' + r[1] + ' ' + (r[2]||'')).toLowerCase().includes(term)) : t.rows,
  })).filter(t => t.rows.length > 0);
  const hits = tables.reduce((n,t) => n + t.rows.length, 0);

  return (
    <>
      <div className="tbl-search">
        <input className="finput" value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Filter by code or keyword — e.g. 316, shoplifting, assault"/>
        <div className="tbl-count">{term ? `${hits} of 163` : '163 codes'}</div>
      </div>
      <div className="drawer-body" style={{whiteSpace:'normal',padding:0}}>
        {tables.length === 0 && <div className="empty">No offense code matches “{q}”.</div>}
        {tables.map(t => {
          const accent = clsOf({class:t.cls}).accent;
          return (
            <div key={t.id}>
              <div className="tbl-hd" style={{borderLeftColor:accent}}>
                <div className="tbl-title" style={{color:accent}}>{t.title}</div>
                <div className="tbl-rule">{t.rule}</div>
              </div>
              {t.rows.map(([code, title, flag]) => (
                <div key={code} className="tbl-row">
                  <div className="tbl-code" style={{color:accent}}>{code}</div>
                  <div>
                    <div className="tbl-text">{title}</div>
                    {flag && <div className="tbl-flag">{flag}</div>}
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </>
  );
};
