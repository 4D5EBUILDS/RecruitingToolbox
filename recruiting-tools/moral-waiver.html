<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Moral Waiver Builder — Recruiter Toolbox 4D5E</title>
<style>
@font-face{font-family:"GI";src:url("../fonts/G.I.-400.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-530.ttf");font-weight:500;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-750.ttf");font-weight:700;font-display:swap}

:root,[data-theme="dark"]{
  --bg:#0f0c10;--bg-s:#1a1719;--bg-c:#201d22;--bg-h:rgba(255,204,1,.04);
  --fg:#FFCC01;--fg2:#F0EDF0;--fg-m:#8A878A;--fg-d:#444;
  --bd:rgba(255,204,1,.09);--bd-m:rgba(255,204,1,.16);--bd-s:rgba(255,204,1,.3);
  --gold:#FFCC01;--danger:#CF0000;--green:#2d7a4f;--blue:#1a5fa8;--amber:#b07800;
  --in-bg:rgba(255,255,255,.04);--in-bd:rgba(255,204,1,.2);
}
[data-theme="light"]{
  --bg:#F1E4C7;--bg-s:#fff;--bg-c:#fff;--bg-h:rgba(34,31,32,.03);
  --fg:#221F20;--fg2:#221F20;--fg-m:#565557;--fg-d:#BBB;
  --bd:rgba(34,31,32,.1);--bd-m:rgba(34,31,32,.2);--bd-s:rgba(34,31,32,.3);
  --gold:#FFCC01;--danger:#B00000;--green:#1a6338;--blue:#0d4a8f;--amber:#8a5e00;
  --in-bg:rgba(34,31,32,.04);--in-bd:rgba(34,31,32,.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"GI",Arial,sans-serif;background:var(--bg);color:var(--fg2);font-weight:500;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,select,textarea,input{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd-s)}
#root{height:100%;display:flex;flex-direction:column}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.4) rotate(-5deg)}60%{transform:scale(.97) rotate(.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.fade-up{animation:fadeUp .28s ease both}
.fade-in{animation:fadeIn .2s ease both}

/* HEADER */
.hdr{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:var(--bg-s);border-bottom:1px solid var(--bd);z-index:10}
.hdr-badge{background:var(--gold);color:#000;font-weight:700;font-size:9px;padding:2px 7px;letter-spacing:.08em;text-transform:uppercase}
.hdr-title{font-size:14px;font-weight:700;color:var(--fg);letter-spacing:.04em;text-transform:uppercase;flex:1}
.hdr-sub{font-size:11px;color:var(--fg-m);margin-top:1px}
.hdr-btn{background:none;border:1px solid var(--bd-m);color:var(--fg-m);padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s}
.hdr-btn:hover{border-color:var(--bd-s);color:var(--fg2)}

/* PHASE NAV */
.phase-nav{flex-shrink:0;display:flex;align-items:stretch;background:var(--bg-s);border-bottom:1px solid var(--bd);padding:0 20px;gap:0}
.phase-tab{display:flex;align-items:center;gap:8px;padding:10px 18px;cursor:pointer;border:none;background:none;color:var(--fg-m);font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .15s;position:relative}
.phase-tab:disabled{opacity:.35;cursor:not-allowed}
.phase-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.phase-tab:not(:disabled):hover:not(.active){color:var(--fg2);border-bottom-color:var(--bd-m)}
.phase-num{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.phase-tab.active .phase-num{background:var(--gold);border-color:var(--gold);color:#000}
.phase-tab.done .phase-num{background:var(--green);border-color:var(--green);color:#fff}

/* SCROLLABLE MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 20px}

/* CARDS & GRIDS */
.card{background:var(--bg-c);border:1px solid var(--bd);padding:20px}
.card+.card{margin-top:16px}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em}
.card-sub{font-size:11px;color:var(--fg-m);margin-top:2px}
.section-bar{width:3px;height:100%;background:var(--gold);flex-shrink:0;align-self:stretch;min-height:16px}

/* OFFENSE GRID */
.offense-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.offense-card{background:var(--bg-s);border:1px solid var(--bd);padding:12px 14px;cursor:pointer;transition:all .15s;text-align:left}
.offense-card:hover{border-color:var(--bd-s);background:var(--bg-h)}
.offense-card.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.offense-card.bar{border-color:rgba(207,0,0,.3)}
.offense-card.bar:hover{border-color:rgba(207,0,0,.7);background:rgba(207,0,0,.05)}
.offense-card.bar.selected{border-color:var(--danger);background:rgba(207,0,0,.08)}
.offense-label{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:4px}
.offense-sub{font-size:10px;color:var(--fg-m);line-height:1.4}
.offense-level-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
.lvl-MAJOR{background:rgba(207,0,0,.2);color:#ff6b6b}
.lvl-MISC{background:rgba(255,204,1,.15);color:var(--gold)}
.lvl-TRAFFIC{background:rgba(255,204,1,.08);color:#c8a800}
.lvl-VARIES{background:rgba(80,80,200,.2);color:#8899ff}
.lvl-BAR{background:rgba(207,0,0,.25);color:#ff4444}

/* QUESTIONS */
.q-wrap{max-width:580px}
.q-card{background:var(--bg-c);border:1px solid var(--bd);padding:24px;animation:fadeUp .25s ease both}
.q-num{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.q-text{font-size:15px;font-weight:700;color:var(--fg2);margin-bottom:6px;line-height:1.4}
.q-hint{font-size:11px;color:var(--fg-m);margin-bottom:16px;padding:8px 10px;background:rgba(255,255,255,.03);border-left:2px solid var(--bd-m)}
.q-options{display:flex;flex-direction:column;gap:6px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg-s);border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.q-opt:hover{border-color:var(--bd-s);background:var(--bg-h)}
.q-opt.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.q-opt-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd-s);flex-shrink:0;margin-top:1px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.q-opt.selected .q-opt-dot{border-color:var(--gold);background:var(--gold)}
.q-opt-dot-inner{width:6px;height:6px;border-radius:50%;background:#000}
.q-opt-label{font-size:13px;color:var(--fg2)}
.q-actions{display:flex;align-items:center;gap:10px;margin-top:16px}
.q-progress{display:flex;gap:4px;margin-bottom:20px}
.q-prog-dot{height:3px;flex:1;background:var(--bd-m);transition:background .2s}
.q-prog-dot.done{background:var(--gold)}
.q-prog-dot.active{background:rgba(255,204,1,.5)}

/* VERDICT */
.verdict-card{padding:28px;animation:stampIn .35s ease both}
.verdict-WAIVABLE{background:rgba(45,122,79,.12);border:2px solid rgba(45,122,79,.5)}
.verdict-NO_WAIVER_REQUIRED{background:rgba(26,95,168,.12);border:2px solid rgba(26,95,168,.5)}
.verdict-NOT_WAIVABLE{background:rgba(207,0,0,.12);border:2px solid rgba(207,0,0,.5)}
.verdict-ETP_REQUIRED{background:rgba(176,120,0,.12);border:2px solid rgba(176,120,0,.5)}
.verdict-WAITING_PERIOD{background:rgba(176,120,0,.08);border:2px solid rgba(176,120,0,.4)}
.verdict-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.verdict-WAIVABLE .verdict-tag{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-tag{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-tag{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-tag,.verdict-WAITING_PERIOD .verdict-tag{color:#ffb84d}
.verdict-title{font-size:22px;font-weight:700;margin-bottom:10px}
.verdict-WAIVABLE .verdict-title{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-title{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-title{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-title,.verdict-WAITING_PERIOD .verdict-title{color:#ffb84d}
.verdict-body{font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:14px}
.verdict-cite{font-size:11px;color:var(--fg-m);padding:6px 10px;background:rgba(255,255,255,.03);border-left:2px solid var(--bd-m);display:inline-block;margin-bottom:14px}
.authority-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--gold);color:#000;font-weight:700;font-size:13px;letter-spacing:.04em}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em}
.form-input{background:var(--in-bg);border:1px solid var(--in-bd);color:var(--fg2);padding:8px 10px;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--fg-d)}
select.form-input{cursor:pointer}

/* OFFENSE TABLE */
.off-table{width:100%;border-collapse:collapse}
.off-table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-m);padding:8px 10px;border-bottom:1px solid var(--bd-m);text-align:left}
.off-table td{font-size:12px;color:var(--fg2);padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}
.off-table tr:hover td{background:var(--bg-h)}
.off-docs-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;margin-right:4px}
.docs-yes{background:rgba(45,122,79,.2);color:#5bc989}
.docs-no{background:rgba(207,0,0,.15);color:#ff7070}

/* CHECKLIST */
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.cl-item:last-child{border-bottom:none}
.cl-check{width:18px;height:18px;border:2px solid var(--bd-s);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cl-check.checked{background:var(--gold);border-color:var(--gold)}
.cl-check.checked svg{display:block}
.cl-check svg{display:none;width:10px;height:8px}
.cl-body{flex:1}
.cl-label{font-size:12px;color:var(--fg2);margin-bottom:3px}
.cl-meta{font-size:10px;color:var(--fg-m)}
.cl-note{font-size:10px;color:rgba(255,204,1,.6);font-style:italic;margin-top:2px}
.cl-status{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.status-badge{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.status-pending{background:rgba(255,255,255,.06);color:var(--fg-m)}
.status-progress{background:rgba(255,204,1,.15);color:var(--gold)}
.status-complete{background:rgba(45,122,79,.2);color:#5bc989}

/* EXPIRATION TRACKER */
.exp-item{display:grid;grid-template-columns:1fr 140px 80px;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.exp-item:last-child{border-bottom:none}
.exp-label{font-size:12px;color:var(--fg2)}
.exp-valid{font-size:10px;color:var(--fg-m)}
.exp-status{font-size:10px;font-weight:700;padding:3px 8px;text-align:center}
.exp-ok{background:rgba(45,122,79,.2);color:#5bc989}
.exp-warn{background:rgba(255,204,1,.15);color:var(--gold)}
.exp-red{background:rgba(207,0,0,.2);color:#ff6b6b}
.exp-none{background:rgba(255,255,255,.05);color:var(--fg-m)}

/* OUTPUT CARDS */
.output-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.output-card{background:var(--bg-c);border:1px solid var(--bd);padding:16px}
.output-icon{width:32px;height:32px;background:rgba(255,204,1,.1);border:1px solid var(--bd-m);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.output-name{font-size:12px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.output-desc{font-size:11px;color:var(--fg-m);line-height:1.5;margin-bottom:12px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;animation:fadeIn .15s ease}
.modal{background:var(--bg-s);border:1px solid var(--bd-m);width:100%;max-width:700px;animation:fadeUp .2s ease}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.modal-title{font-size:13px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;flex:1}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-ftr{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--bd)}

/* DOC PREVIEW */
.doc-preview{background:var(--bg);border:1px solid var(--bd);padding:20px;font-family:"Courier New",monospace;font-size:12px;color:var(--fg2);white-space:pre-wrap;line-height:1.7;max-height:60vh;overflow-y:auto}

/* BUTTONS */
.btn{padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s;border:none;outline:none}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#e6b800}
.btn-outline{background:none;border:1px solid var(--bd-m);color:var(--fg-m)}
.btn-outline:hover{border-color:var(--bd-s);color:var(--fg2)}
.btn-danger{background:rgba(207,0,0,.2);border:1px solid rgba(207,0,0,.4);color:#ff7070}
.btn-danger:hover{background:rgba(207,0,0,.3)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* REF PANEL */
.ref-panel{background:rgba(255,204,1,.03);border:1px solid var(--bd);margin-top:16px}
.ref-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.ref-hdr:hover{background:var(--bg-h)}
.ref-title{font-size:11px;font-weight:700;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em}
.ref-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ref-entry{font-size:11px;color:var(--fg2);line-height:1.6}
.ref-para{font-weight:700;color:var(--gold);margin-right:6px}

/* RESUME MODAL */
.resume-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.resume-box{background:var(--bg-s);border:1px solid var(--bd-m);padding:28px;max-width:360px;width:100%;margin:16px;animation:fadeUp .2s ease}
.resume-title{font-size:14px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.resume-applicant{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px}
.resume-ts{font-size:11px;color:var(--fg-m);margin-bottom:20px}

/* UTILITY */
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--fg-m)}
.gold{color:var(--gold)}
.danger{color:#ff6b6b}
.label-sm{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m)}
.divider{height:1px;background:var(--bd);margin:16px 0}
.empty-state{text-align:center;padding:32px 20px;color:var(--fg-m);font-size:12px}

/* PRINT STYLES */
@media print{
  body{background:#fff;color:#000}
  .hdr,.phase-nav,.no-print{display:none!important}
  .main{overflow:visible;padding:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="waiver-data.js"></script>
<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const { OFFENSE_CATEGORIES, QUALIFYING_QUESTIONS, CHECKLIST_ITEMS, SAMPLE_SCENARIOS, PARA_TEXT, ED_LEVELS, US_STATES } = window;

/* ── Icons ──────────────────────────────────────────────── */
const IcoCheck  = () => <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.8L3.8 7L9 1" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoX      = ({s=10,c="currentColor"}) => <svg width={s} height={s} viewBox="0 0 10 10" fill="none"><path d="M1 1L9 9M9 1L1 9" stroke={c} strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoChev   = ({open}) => <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style={{transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoDoc    = () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9H3V2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><path d="M10 2v3h3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M5 8h6M5 10.5h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoPrint  = () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="5" width="12" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M4 5V3h8v2M5 10h6M5 12h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoClock  = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.3"/><path d="M7 4v3l2 2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoShield = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5L2 4v4c0 2.5 2 4.5 5 5 3-0.5 5-2.5 5-5V4L7 1.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>;
const IcoPlus   = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoTrash  = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 3h9M5 3V2h2v1M3 3l.5 7h5L9 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;

/* ── Helpers ─────────────────────────────────────────────── */
const STORAGE_KEY = 'moral-waiver-draft';

const loadDraft = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch { return null; } };
const saveDraft = (state) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: new Date().toISOString() })); } catch {} };
const clearDraft = () => { try { localStorage.removeItem(STORAGE_KEY); } catch {} };

const fmtDate = iso => { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return iso; } };
const today = () => new Date().toISOString().split('T')[0];

const daysUntilExpiry = (dateObtained, validityDays) => {
  if (!dateObtained || !validityDays) return null;
  const exp = new Date(dateObtained);
  exp.setDate(exp.getDate() + validityDays);
  return Math.ceil((exp - new Date()) / 86400000);
};

const getExpiryStatus = (days) => {
  if (days === null) return 'none';
  if (days < 0) return 'red';
  if (days <= 30) return 'warn';
  return 'ok';
};

/* Determine authority from offense category + major_count answer */
const computeAuthority = (offenseId, majorCount) => {
  const cat = OFFENSE_CATEGORIES.find(c => c.id === offenseId);
  if (!cat || cat.bar) return 'NONE';
  if (cat.authority === 'DMPM') return 'DMPM';
  if (cat.level === 'MAJOR') {
    if (majorCount === '1') return 'USAREC';
    return 'USAREC';
  }
  // Juvenile with adverse disposition → USAREC
  return cat.authority || 'BN';
};

const computeVerdictFromAnswers = (offenseId, answers) => {
  const cat = OFFENSE_CATEGORIES.find(c => c.id === offenseId);
  if (!cat) return null;
  if (cat.bar) return { type:'NOT_WAIVABLE', reason: cat.barText, cite: `AR 601-210, ${cat.barPara}` };

  const { is_adult, disposition, pending_charges, civil_restraint, major_count, lautenberg, sex_offender, confinement_days } = answers;

  if (disposition === 'dismissed') return { type:'NO_WAIVER_REQUIRED', reason:'No adverse court disposition — waiver not required.', cite:'AR 601-210, para 4-30' };
  if (disposition === 'self_admit') return { type:'ETP_REQUIRED', reason:'Self-admittal with no court record. An Exception to Policy may be required before submission. Verify with battalion S1.', cite:'AR 601-210, para 4-30' };
  if (pending_charges === 'yes') return { type:'NOT_WAIVABLE', reason:'Applicant has pending criminal or juvenile charges. Cannot process until resolved.', cite:'AR 601-210, para 4-22g' };
  if (civil_restraint === 'yes') return { type:'NOT_WAIVABLE', reason:'Applicant is currently under civil restraint (confinement, parole, or probation). Cannot process.', cite:'AR 601-210, para 4-22h' };
  if (major_count === '2plus') return { type:'NOT_WAIVABLE', reason:'Two or more major misconduct (felony-level) convictions — permanently disqualified.', cite:'AR 601-210, para 4-22i' };
  if (lautenberg === 'yes') return { type:'NOT_WAIVABLE', reason:'Lautenberg Amendment conviction — absolute bar to enlistment.', cite:'AR 601-210, Table 4-4, Code 414' };
  if (sex_offender === 'yes') return { type:'NOT_WAIVABLE', reason:'Sex offense or sex offender registration — absolute bar.', cite:'AR 601-210, para 4-22j' };

  // Waiting period check
  if (confinement_days === '15plus') return { type:'WAITING_PERIOD', waitMonths:6, reason:'6-month waiting period required after release from confinement (15+ days). BN CO may waive up to 3 months of this period.', cite:'AR 601-210, para 4-31' };
  if (confinement_days === 'under15') return { type:'WAITING_PERIOD', waitMonths:3, reason:'3-month waiting period required after release from confinement (under 15 days). BN CO may waive up to 45 days.', cite:'AR 601-210, para 4-31' };

  const authority = computeAuthority(offenseId, major_count);
  return { type:'WAIVABLE', authority, cite:'AR 601-210, Chapter 4' };
};

/* Determine which checklist items are required */
const getRequiredChecklist = (offenseId, authority, isTrafficOnly) => {
  return CHECKLIST_ITEMS.filter(item => {
    if (item.group === 'all') return true;
    if (item.group === 'non_traffic' && !isTrafficOnly) return true;
    if (item.group === 'usarec_dmpm' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    if (item.group === 'major' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    if (item.group === 'major_applicable' && (authority === 'USAREC' || authority === 'DMPM')) return true;
    return false;
  });
};

/* ── Phase 1 ─────────────────────────────────────────────── */
const Phase1 = ({ selectedOffense, setSelectedOffense, answers, setAnswers, verdict, setVerdict }) => {
  const [step, setStep] = useState(-1); // -1 = selecting offense, 0+ = question index
  const [tempAnswer, setTempAnswer] = useState(null);

  // Reset when offense changes
  useEffect(() => {
    if (selectedOffense) {
      const cat = OFFENSE_CATEGORIES.find(c => c.id === selectedOffense);
      if (cat && cat.bar) {
        setVerdict({ type:'NOT_WAIVABLE', reason:cat.barText, cite:`AR 601-210, ${cat.barPara}` });
        setAnswers({});
        setStep(99);
      } else {
        setStep(0);
        setAnswers({});
        setVerdict(null);
        setTempAnswer(null);
      }
    } else {
      setStep(-1);
    }
  }, [selectedOffense]);

  const submitAnswer = () => {
    if (!tempAnswer) return;
    const q = QUALIFYING_QUESTIONS[step];
    const newAnswers = { ...answers, [q.id]: tempAnswer };
    setAnswers(newAnswers);
    setTempAnswer(null);

    // Check for early verdict
    const v = computeVerdictFromAnswers(selectedOffense, newAnswers);
    const isTerminal = v && (v.type === 'NOT_WAIVABLE' || v.type === 'NO_WAIVER_REQUIRED' || v.type === 'ETP_REQUIRED');

    // Early terminate?
    if (q.id === 'disposition' && (tempAnswer === 'dismissed' || tempAnswer === 'self_admit')) {
      setVerdict(v); setStep(99); return;
    }
    if (q.id === 'pending_charges' && tempAnswer === 'yes') { setVerdict(v); setStep(99); return; }
    if (q.id === 'civil_restraint' && tempAnswer === 'yes') { setVerdict(v); setStep(99); return; }
    if (q.id === 'major_count' && tempAnswer === '2plus') { setVerdict(v); setStep(99); return; }
    if (q.id === 'lautenberg' && tempAnswer === 'yes') { setVerdict(v); setStep(99); return; }
    if (q.id === 'sex_offender' && tempAnswer === 'yes') { setVerdict(v); setStep(99); return; }

    // Advance to next question or compute final verdict
    const nextStep = step + 1;
    if (nextStep >= QUALIFYING_QUESTIONS.length) {
      setVerdict(computeVerdictFromAnswers(selectedOffense, newAnswers));
      setStep(99);
    } else {
      setStep(nextStep);
    }
  };

  const goBack = () => {
    if (step === 0) { setSelectedOffense(null); setStep(-1); }
    else {
      const newStep = step - 1;
      setStep(newStep);
      const q = QUALIFYING_QUESTIONS[newStep];
      setTempAnswer(answers[q.id] || null);
      const reduced = { ...answers };
      // Remove answers from current step onwards
      QUALIFYING_QUESTIONS.slice(newStep).forEach(qq => delete reduced[qq.id]);
      setAnswers(reduced);
      setVerdict(null);
    }
  };

  const resetAll = () => { setSelectedOffense(null); setAnswers({}); setVerdict(null); setStep(-1); setTempAnswer(null); };

  const totalQ = QUALIFYING_QUESTIONS.length;

  return (
    <div className="main">
      {step === -1 && (
        <div className="fade-up">
          <div className="card">
            <div className="card-hdr"><div className="section-bar"/><div><div className="card-title">Select Offense Category</div><div className="card-sub">Choose the category that best matches the offense requiring a waiver. Absolute bars (red) are not waivable.</div></div></div>
            <div className="offense-grid">
              {OFFENSE_CATEGORIES.map(cat => (
                <button key={cat.id} className={`offense-card${selectedOffense===cat.id?' selected':''}${cat.bar?' bar':''}`} onClick={()=>setSelectedOffense(cat.id)}>
                  <div className="offense-label">{cat.label}</div>
                  <div className="offense-sub">{cat.sub}</div>
                  <span className={`offense-level-badge lvl-${cat.level}`}>{cat.level === 'BAR' ? 'ABSOLUTE BAR' : cat.level}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {step >= 0 && step < 99 && (
        <div className="q-wrap fade-up">
          <div className="row" style={{marginBottom:16}}>
            <button className="btn btn-outline btn-sm" onClick={step===0?resetAll:goBack}>← Back</button>
            <span className="muted" style={{fontSize:11}}>{OFFENSE_CATEGORIES.find(c=>c.id===selectedOffense)?.label}</span>
          </div>
          <div className="q-progress">
            {QUALIFYING_QUESTIONS.map((q,i) => (
              <div key={q.id} className={`q-prog-dot${i<step?' done':i===step?' active':''}`}/>
            ))}
          </div>
          <div className="q-card">
            <div className="q-num">Question {step+1} of {totalQ}</div>
            <div className="q-text">{QUALIFYING_QUESTIONS[step].q}</div>
            {QUALIFYING_QUESTIONS[step].hint && <div className="q-hint">{QUALIFYING_QUESTIONS[step].hint}</div>}
            <div className="q-options">
              {QUALIFYING_QUESTIONS[step].options.map(opt => (
                <div key={opt.v} className={`q-opt${tempAnswer===opt.v?' selected':''}`} onClick={()=>setTempAnswer(opt.v)}>
                  <div className="q-opt-dot">{tempAnswer===opt.v && <div className="q-opt-dot-inner"/>}</div>
                  <span className="q-opt-label">{opt.l}</span>
                </div>
              ))}
            </div>
            <div className="q-actions">
              <button className="btn btn-gold" disabled={!tempAnswer} onClick={submitAnswer}>Next →</button>
              <button className="btn btn-outline btn-sm" onClick={step===0?resetAll:goBack}>Back</button>
            </div>
          </div>
        </div>
      )}

      {step === 99 && verdict && (
        <div className="fade-up">
          <div className="row" style={{marginBottom:16}}>
            <button className="btn btn-outline btn-sm" onClick={resetAll}>← Start Over</button>
          </div>
          <VerdictCard verdict={verdict} offenseId={selectedOffense} />
        </div>
      )}
    </div>
  );
};

/* ── XFA Injection ───────────────────────────────────────── */
function buildDatasetsXML(applicant, offenses) {
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtD = iso => {
    if (!iso) return '';
    try { const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; } catch { return ''; }
  };
  const calcAge = (fromIso, toIso) => {
    if (!fromIso || !toIso) return '';
    try {
      const [by,bm,bd] = fromIso.split('-').map(Number);
      const [ty,tm,td] = toIso.split('-').map(Number);
      let age = ty - by;
      if (tm < bm || (tm === bm && td < bd)) age--;
      return age >= 0 ? String(age) : '';
    } catch { return ''; }
  };
  const name = [applicant.lastName, [applicant.firstName, applicant.mi].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const currentAge = calcAge(applicant.dob, new Date().toISOString().split('T')[0]);
  const sorted = [...offenses].sort((a,b) => new Date(b.date)-new Date(a.date));
  const get = i => sorted[i] || {};
  const tf = v => v ? `<TextField2>${esc(v)}</TextField2>` : '<TextField2/>';
  const df = v => v ? `<DateField2>${esc(v)}</DateField2>` : '<DateField2/>';
  const nf = v => v ? `<NumericField2>${esc(v)}</NumericField2>` : '<NumericField2/>';

  // VERIFIED field mapping from XFA template analysis:
  // [0]    TextField2     = MARITAL STATUS (page 1 header, x=58mm)
  // [1]    RadioButtonList= PS/NPS (page 1 header, x=20mm)
  // [2-5]  Row 1          = DateField(date), NumericField(age@time), TF(nature), TF(disposition)
  // [6-12] 7 TFs          = COMMENTS / TYPE-OF-WAIVER section (leave blank)
  // [13-76] Rows 2-17     = 16 offense rows × 4 fields each
  // [77]   TF             = DEPENDENT AGES (page 2 header, x=119mm)
  // [78]   TF             = # OF DEPENDENTS (page 2 header, x=91mm)
  // [79]   TF             = NAME Last, First MI (page 2 header, x=12.87mm wide)
  // [80]   TF             = AGE (page 2 header, x=113mm)
  // [81]   TF             = EDUCATION CODE (page 2 header, x=134mm)
  // [82]   TF             = AFQT (page 2 header, x=170mm)
  // [83-182] Rows 18-42   = 25 offense rows × 4 fields each

  const rowXML = i => {
    const o = get(i);
    const age = calcAge(applicant.dob, o.date);
    const star = o.waivedOffense ? '*' : '';
    return `${df(fmtD(o.date))}\n${nf(age)}\n${tf(star + (o.description||''))}\n${tf(o.disposition||'')}\n`;
  };

  let xml = `<xfa:datasets xmlns:xfa="http://www.xfa.org/schema/xfa-data/1.0/">\n<xfa:data>\n<topmostSubform>\n`;
  xml += tf(applicant.maritalStatus) + '\n';                    // [0] Marital Status
  xml += `<RadioButtonList>${esc(applicant.psNps||'')}</RadioButtonList>\n`; // [1] PS/NPS
  xml += rowXML(0);                                              // [2-5] Row 1
  for (let i=0;i<7;i++) xml += '<TextField2/>\n';               // [6-12] Comments (blank)
  for (let i=1;i<=16;i++) xml += rowXML(i);                     // [13-76] Rows 2-17
  xml += tf(applicant.dependentAges) + '\n';                    // [77] Dependent Ages
  xml += tf(applicant.numDependents) + '\n';                    // [78] # of Dependents
  xml += tf(name) + '\n';                                        // [79] NAME
  xml += tf(currentAge) + '\n';                                  // [80] Age
  xml += tf(applicant.educationCode||applicant.educationLevel||'') + '\n'; // [81] Ed Code
  xml += tf(applicant.afqt) + '\n';                             // [82] AFQT
  for (let i=17;i<=41;i++) xml += rowXML(i);                    // [83-182] Rows 18-42
  xml += '</topmostSubform>\n</xfa:data>\n</xfa:datasets>';
  return xml;
}

async function generateFilledUF608(applicant, offenses, onProgress) {
  onProgress('Fetching PDF...');
  const resp = await fetch('./uf-601-210-08.pdf');
  if (!resp.ok) throw new Error('uf-601-210-08.pdf not found in the same folder as this tool.');
  const origBytes = new Uint8Array(await resp.arrayBuffer());

  onProgress('Building XFA datasets...');
  const xml = buildDatasetsXML(applicant, offenses);
  const xmlBytes = new TextEncoder().encode(xml);

  onProgress('Compressing...');
  const compressed = pako.deflate(xmlBytes);

  // Find existing startxref (for /Prev in incremental trailer)
  const tail = new TextDecoder('utf-8',{fatal:false}).decode(origBytes.slice(-512));
  const prevMatch = tail.match(/startxref\s+(\d+)/g);
  const prevXref = prevMatch ? parseInt(prevMatch[prevMatch.length-1].match(/\d+/)[0]) : 0;

  const enc = new TextEncoder();
  const sep = enc.encode('\n');

  // New object 72 content
  const objHeader = enc.encode(`72 0 obj\n<<\n/Filter [/FlateDecode]\n/Length ${compressed.length}\n/Type /EmbeddedFile\n>>\nstream\n`);
  const objFooter = enc.encode('\nendstream\nendobj\n');

  // Byte offsets
  const newObj72At = origBytes.length + sep.length;
  const xrefAt     = newObj72At + objHeader.length + compressed.length + objFooter.length;

  const xrefEntry  = `${String(newObj72At).padStart(10,'0')} 00000 n \r\n`;
  const xrefBlock  = enc.encode(`xref\n72 1\n${xrefEntry}`);
  const trailerBlock = enc.encode(`trailer\n<<\n/Size 100\n/Prev ${prevXref}\n>>\nstartxref\n${xrefAt}\n%%EOF\n`);

  onProgress('Assembling PDF...');
  const parts = [origBytes, sep, objHeader, compressed, objFooter, xrefBlock, trailerBlock];
  const total = parts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(total);
  let pos=0; for (const p of parts){result.set(p,pos);pos+=p.length;}
  return result;
}

/* ── UF608 Card ──────────────────────────────────────────── */
const UF608Card = ({ applicant, offenses }) => {
  const [status, setStatus] = useState('idle'); // idle | loading | done | error
  const [msg, setMsg] = useState('');

  const generate = async () => {
    setStatus('loading'); setMsg('Starting...');
    try {
      const bytes = await generateFilledUF608(applicant, offenses, m => setMsg(m));
      const blob = new Blob([bytes], {type:'application/pdf'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      const lastName = applicant.lastName || 'applicant';
      a.href = url;
      a.download = `UF-601-210.08-${lastName.toUpperCase()}.pdf`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('done'); setMsg('Downloaded — open with Adobe Acrobat Reader.');
    } catch(e) {
      setStatus('error'); setMsg(e.message);
    }
  };

  const canGenerate = offenses.length > 0;

  return (
    <div className="card" style={{marginTop:16,borderColor:status==='error'?'rgba(207,0,0,.3)':status==='done'?'rgba(45,122,79,.3)':'rgba(255,204,1,.2)'}}>
      <div className="card-hdr">
        <div className="section-bar"/>
        <div style={{flex:1}}>
          <div className="card-title">UF 601-210.08 — Pre-Fill &amp; Download</div>
          <div className="card-sub">XFA dataset injection — opens pre-populated in Adobe Acrobat Reader</div>
        </div>
      </div>
      <div style={{padding:'0 4px'}}>
        <div style={{fontSize:12,color:'var(--fg-m)',marginBottom:12,lineHeight:1.6}}>
          Injects applicant name and all logged offenses (newest to oldest) directly into the official UF 601-210.08 form fields. Waived offense(s) are automatically asterisked.
        </div>
        {!canGenerate && (
          <div style={{fontSize:11,color:'var(--fg-m)',marginBottom:12,padding:'6px 10px',background:'rgba(255,204,1,.04)',border:'1px solid var(--bd)'}}>
            Add at least one offense in Phase 2 before generating.
          </div>
        )}
        {msg && (
          <div style={{
            fontSize:11,marginBottom:12,padding:'7px 10px',
            background: status==='error'?'rgba(207,0,0,.1)':status==='done'?'rgba(45,122,79,.1)':'rgba(255,204,1,.06)',
            border:`1px solid ${status==='error'?'rgba(207,0,0,.3)':status==='done'?'rgba(45,122,79,.3)':'rgba(255,204,1,.15)'}`,
            color: status==='error'?'#ff7070':status==='done'?'#5bc989':'var(--gold)',
          }}>{msg}</div>
        )}
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-gold" disabled={!canGenerate||status==='loading'} onClick={generate}>
            {status==='loading'?'Generating...':'Generate & Download PDF'}
          </button>
          {status==='loading' && <span style={{fontSize:11,color:'var(--fg-m)',animation:'pulse 1s ease infinite'}}>{msg}</span>}
          {status!=='idle' && status!=='loading' && (
            <button className="btn btn-outline btn-sm" onClick={()=>{setStatus('idle');setMsg('');}}>Reset</button>
          )}
        </div>
        <div style={{marginTop:10,fontSize:10,color:'var(--fg-d)'}}>
          Open result with Adobe Acrobat Reader — other PDF viewers may not render XFA forms correctly.
        </div>
      </div>
    </div>
  );
};

    lines.push(`SUBJECT: Moral Waiver Packet Submission — ${fullName||'[APPLICANT NAME]'}`);
    lines.push(``);
    lines.push(`1. Submitting moral waiver packet for ${fullName||'[NAME]'}, SSN (last 4): XXXX-XX-${ssnLast4}.`);
    lines.push(``);
    lines.push(`2. Offense(s):`);
    offenseList.forEach((o,i)=>{
      lines.push(`   ${i+1}. ${fmtDate(o.date)} — ${o.description}`);
    });
    lines.push(``);
    lines.push(`3. Approving Authority: ${authorityShort}`);
    lines.push(``);
    lines.push(`4. Required documents attached:`);
    requiredItems.forEach(item=>{
      const status = clStatus[item.id]||'pending';
      const mark = status==='complete'?'[X]':'[ ]';
      lines.push(`   ${mark} ${item.label}`);
    });
    lines.push(``);
    lines.push(`5. Point of contact: [RECRUITER NAME], RSID: ${applicant.rsid||'[RSID]'}`);
    lines.push(``);
    lines.push(`6. Regulation basis: AR 601-210, Chapter 4, 8 November 2023`);
    lines.push(``);
    lines.push(``);
    lines.push(`__________________________________        ____________________`);
    lines.push(`[RECRUITER RANK, NAME]                    Date`);
    return lines.join('\n');
  };

  const docTypes = [
    { id:'cover',     name:'Printable Cover Sheet',       desc:'Formatted summary page for the top of the physical packet — applicant info, offense table, required docs.',  icon:<IcoDoc/>, gen:genCoverSheet, fmt:'text' },
    { id:'statement', name:"Applicant's Statement Draft", desc:'Pre-filled boilerplate structure per AR 601-210 requirements. Applicant personalizes and signs.',              icon:<IcoDoc/>, gen:genStatement, fmt:'text' },
    { id:'mfr',       name:"CO Interview MFR Draft",      desc:'Official Army memo with letterhead, AR 25-50 format. CO completes fill-in lines and signs.',                  icon:<IcoDoc/>, gen:genMFR,       fmt:'html' },
    { id:'routing',   name:'Routing / Transmittal Memo',  desc:'Memo from recruiter routing the complete packet up the chain to battalion S1.',                               icon:<IcoDoc/>, gen:genRouting,   fmt:'text' },
  ];

  const printDoc = (content, fmt='text') => {
    const w = window.open('','_blank');
    if (fmt === 'html') {
      // Insert auto-print script before </body>
      const html = content.replace('</body>', '<script>window.onload=()=>window.print()<\/script></body>');
      w.document.write(html);
    } else {
      w.document.write(`<!DOCTYPE html><html><head><title>Moral Waiver Document</title><style>body{font-family:"Courier New",monospace;font-size:12px;line-height:1.7;padding:48px;color:#000;max-width:700px;margin:auto}@media print{body{padding:24px}}</style></head><body><pre>${content}</pre><script>window.onload=()=>window.print()<\/script></body></html>`);
    }
    w.document.close();
  };

  return (
    <div className="main">
      <div className="fade-up">
        {/* Document Checklist */}
        <div className="card">
          <div className="card-hdr"><div className="section-bar"/><div><div className="card-title">Document Checklist</div><div className="card-sub">Required documents for {authorityShort} level waiver · Click status badge to cycle</div></div></div>
          {requiredItems.map(item=>{
            const status = clStatus[item.id]||'pending';
            return (
              <div key={item.id} className="cl-item">
                <div className={`cl-check${status==='complete'?' checked':''}`} onClick={()=>setClStatus(p=>({...p,[item.id]:p[item.id]==='complete'?'pending':'complete'}))}>
                  {status==='complete'&&<IcoCheck/>}
                </div>
                <div className="cl-body">
                  <div className="cl-label" style={status==='complete'?{textDecoration:'line-through',opacity:.45}:{}}>{item.label}</div>
                  <div className="cl-meta">{item.ref}</div>
                  {item.note&&<div className="cl-note">{item.note}</div>}
                </div>
                <div className="cl-status">
                  <span className={`status-badge status-${status}`} onClick={()=>setClStatus(p=>({...p,[item.id]:statusCycle(p[item.id]||'pending')}))}>
                    {status==='pending'?'Pending':status==='progress'?'In Progress':'Complete'}
                  </span>
                  {item.validity&&<span className="muted" style={{fontSize:10}}><IcoClock/> {item.validity} {item.unit}</span>}
                </div>
              </div>
            );
          })}
        </div>

        {/* Expiration Tracker */}
        {expiringItems.length > 0 && (
          <div className="card" style={{marginTop:16}}>
            <div className="card-hdr"><div className="section-bar"/><div><div className="card-title">Expiration Tracker</div><div className="card-sub">Enter date obtained — app calculates expiry and flags issues before submission</div></div></div>
            {expiringItems.map(item=>{
              const d = expDates[item.id];
              const days = daysUntilExpiry(d, item.validity);
              const expStatus = getExpiryStatus(days);
              return (
                <div key={item.id} className="exp-item">
                  <div>
                    <div className="exp-label">{item.label}</div>
                    <div className="exp-valid">Valid {item.validity} {item.unit}</div>
                  </div>
                  <input type="date" className="form-input" style={{fontSize:11,padding:'5px 8px'}}
                    value={d||''} onChange={e=>setExpDates(p=>({...p,[item.id]:e.target.value}))}
                    placeholder="Date obtained"/>
                  <div className={`exp-status exp-${expStatus}`}>
                    {!d ? '—' : days<0 ? `Expired ${Math.abs(days)}d ago` : `${days}d left`}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Generated Documents */}
        <div className="card" style={{marginTop:16}}>
          <div className="card-hdr"><div className="section-bar"/><div><div className="card-title">Generated Documents</div><div className="card-sub">Pre-filled drafts based on applicant data and offense log</div></div></div>
          <div className="output-grid">
            {docTypes.map(dt=>(
              <div key={dt.id} className="output-card">
                <div className="output-icon">{dt.icon}</div>
                <div className="output-name">{dt.name}</div>
                <div className="output-desc">{dt.desc}</div>
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>setActiveDoc({...dt, content:dt.gen()})}>Preview</button>
                  <button className="btn btn-gold btn-sm" onClick={()=>printDoc(dt.gen(),dt.fmt)}><IcoPrint/> Print</button>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* UF 601-210.08 PDF Injection */}
        <UF608Card applicant={applicant} offenses={offenses} />

        <div style={{fontSize:10,color:'var(--fg-d)',textAlign:'center',marginTop:24,paddingBottom:16}}>
          Eligibility logic based on AR 601-210, 8 November 2023. Verify currency before submission.
        </div>
      </div>

      {/* Document Preview Modal */}
      {activeDoc && (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setActiveDoc(null)}}>
          <div className="modal" style={{maxWidth:activeDoc.fmt==='html'?860:700}}>
            <div className="modal-hdr">
              <span className="modal-title">{activeDoc.name}</span>
              <button className="btn btn-outline btn-sm" onClick={()=>setActiveDoc(null)}><IcoX/></button>
            </div>
            <div className="modal-body" style={{padding:activeDoc.fmt==='html'?0:20}}>
              {activeDoc.fmt==='html'
                ? <iframe srcDoc={activeDoc.content} style={{width:'100%',height:'60vh',border:'none',background:'#fff'}} title="MFR Preview"/>
                : <pre className="doc-preview">{activeDoc.content}</pre>
              }
            </div>
            <div className="modal-ftr">
              <button className="btn btn-outline" onClick={()=>setActiveDoc(null)}>Close</button>
              <button className="btn btn-gold" onClick={()=>printDoc(activeDoc.content,activeDoc.fmt)}><IcoPrint/> Print / Download</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── Resume Modal ────────────────────────────────────────── */
const ResumeModal = ({ draft, onResume, onDiscard }) => (
  <div className="resume-modal">
    <div className="resume-box">
      <div className="resume-title">Resume Previous Applicant?</div>
      <div className="resume-applicant">
        {[draft.applicant?.firstName, draft.applicant?.mi, draft.applicant?.lastName].filter(Boolean).join(' ') || 'Unnamed Applicant'}
      </div>
      <div className="resume-ts">Last saved: {draft.savedAt ? new Date(draft.savedAt).toLocaleString() : 'Unknown'}</div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-gold" style={{flex:1}} onClick={onResume}>Resume</button>
        <button className="btn btn-outline" onClick={onDiscard}>Start Fresh</button>
      </div>
    </div>
  </div>
);

/* ── App ─────────────────────────────────────────────────── */
const App = () => {
  const [theme, setTheme] = useState('dark');
  const [phase, setPhase] = useState(1);

  // Phase 1 state
  const [selectedOffense, setSelectedOffense] = useState(null);
  const [answers, setAnswers] = useState({});
  const [verdict, setVerdict] = useState(null);

  // Phase 2 state
  const blankApplicant = { lastName:'', firstName:'', mi:'', ssn:'', dob:'', rsid:'', educationLevel:'', educationCode:'', afqt:'', psNps:'', maritalStatus:'', numDependents:'', dependentAges:'', recruiterUnit:'', recruiterAddress:'', recruiterOfficeSym:'', recruiterName:'', recruiterRank:'' };
  const [applicant, setApplicant] = useState(blankApplicant);
  const [offenses, setOffenses] = useState([]);

  // Resume modal
  const [pendingDraft, setPendingDraft] = useState(null);

  // Check for saved draft on mount
  useEffect(() => {
    const draft = loadDraft();
    if (draft && (draft.applicant?.lastName || draft.offenses?.length)) {
      setPendingDraft(draft);
    }
  }, []);

  // Apply theme
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  // Autosave
  useEffect(() => {
    saveDraft({ phase, selectedOffense, answers, verdict, applicant, offenses });
  }, [phase, selectedOffense, answers, verdict, applicant, offenses]);

  const resumeDraft = () => {
    if (!pendingDraft) return;
    setPhase(pendingDraft.phase||1);
    setSelectedOffense(pendingDraft.selectedOffense||null);
    setAnswers(pendingDraft.answers||{});
    setVerdict(pendingDraft.verdict||null);
    setApplicant({...blankApplicant,...(pendingDraft.applicant||{})});
    setOffenses(pendingDraft.offenses||[]);
    setPendingDraft(null);
  };

  const discardDraft = () => { clearDraft(); setPendingDraft(null); };

  const newApplicant = () => {
    clearDraft();
    setPhase(1); setSelectedOffense(null); setAnswers({}); setVerdict(null);
    setApplicant(blankApplicant);
    setOffenses([]);
  };

  const loadSample = (scenario) => {
    clearDraft();
    const s = scenario;
    setSelectedOffense(s.screening.offenseId);
    setAnswers(s.screening);
    const v = computeVerdictFromAnswers(s.screening.offenseId, s.screening);
    setVerdict(v);
    setApplicant(s.applicant);
    setOffenses(s.offenses);
    setPhase(2);
  };

  const p1Done = verdict?.type === 'WAIVABLE';
  const p2Done = p1Done && !!applicant.lastName && offenses.length > 0;

  const phase2Answers = { ...answers, offenseId: selectedOffense };

  return (
    <>
      <Header theme={theme} setTheme={setTheme} onLoadSample={loadSample} onNewApplicant={newApplicant}/>
      <PhaseNav phase={phase} setPhase={setPhase} p1Done={p1Done} p2Done={p2Done}/>

      {phase === 1 && (
        <Phase1
          selectedOffense={selectedOffense} setSelectedOffense={setSelectedOffense}
          answers={answers} setAnswers={setAnswers}
          verdict={verdict} setVerdict={setVerdict}
        />
      )}
      {phase === 2 && (
        <Phase2
          applicant={applicant} setApplicant={setApplicant}
          offenses={offenses} setOffenses={setOffenses}
          verdict={verdict} answers={answers}
        />
      )}
      {phase === 3 && (
        <Phase3
          applicant={applicant} offenses={offenses}
          verdict={verdict} answers={phase2Answers}
        />
      )}

      {pendingDraft && <ResumeModal draft={pendingDraft} onResume={resumeDraft} onDiscard={discardDraft}/>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
