<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Moral Waiver Builder — Recruiter Toolbox 4D5E</title>
<style>
@font-face{font-family:"GI";src:url("../fonts/G.I.-400.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-530.ttf");font-weight:500;font-display:swap}
@font-face{font-family:"GI";src:url("../fonts/G.I.-750.ttf");font-weight:700;font-display:swap}

:root,[data-theme="dark"]{
  --bg:#050507;--bg-s:#0a0a0f;--bg-c:#111113;--bg-h:rgba(255,204,1,.03);
  --fg:#FFCC01;--fg2:#F0EDF0;--fg-m:#8A878A;--fg-d:#444;
  --bd:rgba(255,204,1,.12);--bd-m:rgba(255,204,1,.22);--bd-s:rgba(255,204,1,.45);
  --gold:#FFCC01;--danger:#CF0000;--green:#2d7a4f;--blue:#1a5fa8;--amber:#b07800;
  --in-bg:rgba(255,255,255,.03);--in-bd:rgba(255,204,1,.25);
  --sidebar-w:260px;--ref-w:300px;
}
[data-theme="light"]{
  --bg:#F1E4C7;--bg-s:#fff;--bg-c:#fff;--bg-h:rgba(34,31,32,.03);
  --fg:#221F20;--fg2:#221F20;--fg-m:#565557;--fg-d:#BBB;
  --bd:rgba(34,31,32,.1);--bd-m:rgba(34,31,32,.2);--bd-s:rgba(34,31,32,.3);
  --gold:#c9900a;--danger:#B00000;--green:#1a6338;--blue:#0d4a8f;--amber:#8a5e00;
  --in-bg:rgba(34,31,32,.04);--in-bd:rgba(34,31,32,.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"GI",Arial,sans-serif;background:var(--bg);color:var(--fg2);font-weight:500;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#111113 1px,transparent 1px),linear-gradient(90deg,#111113 1px,transparent 1px);background-size:22px 22px;opacity:.75;z-index:-1}
button,select,textarea,input{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd-s)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.4) rotate(-5deg)}60%{transform:scale(.97) rotate(.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes progressFill{from{width:0}to{width:var(--target-w,0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.fade-up{animation:fadeUp .28s ease both}
.fade-in{animation:fadeIn .2s ease both}
.slide-left{animation:slideInLeft .2s ease both}

/* ── LAYOUT ────────────────────────────────────────────────── */
#root{height:100%;display:flex;flex-direction:column}
.app-shell{flex:1;display:flex;overflow:hidden}

/* ── TOP BAR ───────────────────────────────────────────────── */
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg-s);border-bottom:1px solid var(--bd);z-index:20}
.topbar-badge{background:var(--gold);color:#000;font-weight:700;font-size:9px;padding:2px 7px;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
.topbar-title{font-size:13px;font-weight:700;color:var(--fg);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 8px rgba(255,204,1,.3)}
.topbar-sub{font-size:10px;color:var(--fg-m)}
.topbar-center{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
.topbar-actions{display:flex;gap:6px;align-items:center}
.topbar-btn{background:none;border:1px solid var(--bd-m);color:var(--fg-m);padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.topbar-btn:hover{border-color:var(--bd-s);color:var(--fg2)}
.topbar-btn.active{background:var(--gold);border-color:var(--gold);color:#000}

/* ── READINESS RING ────────────────────────────────────────── */
.readiness-wrap{display:flex;align-items:center;gap:10px}
.readiness-ring{position:relative;width:36px;height:36px;flex-shrink:0}
.readiness-ring svg{transform:rotate(-90deg)}
.readiness-ring .ring-bg{fill:none;stroke:var(--bd-m);stroke-width:3}
.readiness-ring .ring-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke .3s}
.readiness-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.readiness-label{font-size:10px;color:var(--fg-m)}
.readiness-pct-big{font-size:12px;font-weight:700;color:var(--fg)}

/* Authority Badge */
.auth-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.auth-BN{background:rgba(26,95,168,.2);border:1px solid rgba(26,95,168,.4);color:#5b9fd4}
.auth-USARD{background:rgba(255,204,1,.12);border:1px solid rgba(255,204,1,.3);color:var(--gold)}
.auth-NONE{background:rgba(255,255,255,.06);border:1px solid var(--bd-m);color:var(--fg-m)}

/* ── SIDEBAR ───────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg-s);overflow:hidden;transition:width .25s ease}
.sidebar.collapsed{width:0}
.sidebar-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m);flex:1}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--bd);flex-shrink:0}

/* Applicant Cards */
.appl-card{border:1px solid var(--bd);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s;position:relative}
.appl-card:hover{border-color:var(--bd-s);background:var(--bg-h)}
.appl-card.active{border-color:var(--gold);background:rgba(255,204,1,.05)}
.appl-card-name{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appl-card-meta{font-size:10px;color:var(--fg-m)}
.appl-card-status{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.status-green{background:#5bc989}
.status-yellow{background:var(--gold)}
.status-red{background:#ff5555}
.status-gray{background:var(--fg-d)}

/* ── MAIN ──────────────────────────────────────────────────── */
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tab-nav{flex-shrink:0;display:flex;background:var(--bg-s);border-bottom:1px solid var(--bd);padding:0 16px}
.tab-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border:none;background:none;color:var(--fg-m);font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:disabled{opacity:.3;cursor:not-allowed}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-btn:not(:disabled):hover:not(.active){color:var(--fg2);border-bottom-color:var(--bd-m)}
.tab-num{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.tab-btn.active .tab-num{background:var(--gold);border-color:var(--gold);color:#000}
.tab-btn.done .tab-num{background:var(--green);border-color:var(--green);color:#fff}
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}

/* ── RIGHT PANEL ───────────────────────────────────────────── */
.ref-panel{width:var(--ref-w);flex-shrink:0;border-left:1px solid var(--bd);background:var(--bg-s);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease}
.ref-panel.collapsed{width:0}
.ref-panel-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ref-panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m);flex:1}
.ref-panel-body{flex:1;overflow-y:auto;padding:12px}
.ref-entry{padding:10px 12px;border:1px solid var(--bd);margin-bottom:8px;background:rgba(255,204,1,.02)}
.ref-para-id{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.ref-para-text{font-size:11px;color:var(--fg2);line-height:1.6}
.ref-tip{font-size:10px;color:var(--fg-m);padding:6px 8px;background:rgba(255,204,1,.04);border-left:2px solid var(--bd-m);margin-top:6px;line-height:1.5}

/* ── CARDS ─────────────────────────────────────────────────── */
.card{background:var(--bg-c);border:1px solid var(--bd);padding:20px}
.card+.card{margin-top:14px}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em}
.card-sub{font-size:11px;color:var(--fg-m);margin-top:2px}
.section-bar{width:3px;align-self:stretch;min-height:16px;background:var(--gold);flex-shrink:0}

/* ── OFFENSE GRID ──────────────────────────────────────────── */
.offense-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-m);padding:8px 4px 4px;margin-top:4px}
.offense-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-bottom:2px}
.offense-card{background:var(--bg-s);border:1px solid var(--bd);padding:11px 13px;cursor:pointer;transition:all .15s;text-align:left}
.offense-card:hover{border-color:var(--bd-s);background:var(--bg-h)}
.offense-card.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.offense-card.bar{border-color:rgba(207,0,0,.25)}
.offense-card.bar:hover{border-color:rgba(207,0,0,.6);background:rgba(207,0,0,.04)}
.offense-card.bar.selected{border-color:var(--danger);background:rgba(207,0,0,.07)}
.offense-card.no-waiver{border-color:rgba(26,95,168,.25)}
.offense-card.no-waiver.selected{border-color:rgba(26,95,168,.6);background:rgba(26,95,168,.07)}
.offense-label{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:3px}
.offense-sub{font-size:10px;color:var(--fg-m);line-height:1.35}
.offense-level-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.lvl-MAJOR{background:rgba(207,0,0,.2);color:#ff6b6b}
.lvl-MISC{background:rgba(255,204,1,.15);color:var(--gold)}
.lvl-TRAFFIC{background:rgba(80,160,255,.15);color:#7eb8ff}
.lvl-VARIES{background:rgba(160,80,255,.15);color:#cc99ff}
.lvl-BAR{background:rgba(207,0,0,.3);color:#ff4444}
.lvl-NO-WAIVER{background:rgba(26,95,168,.2);color:#5b9fd4}

/* ── MULTI-OFFENSE SCREENER ────────────────────────────────── */
.offense-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.offense-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-s);border:1px solid var(--bd-m);position:relative;transition:background .2s,transform .2s;}
.offense-chip.bar{border-color:rgba(207,0,0,.4);background:rgba(207,0,0,.05)}
.offense-chip.waivable{border-color:rgba(45,122,79,.3);background:rgba(45,122,79,.04)}
.offense-chip.waiting{border-color:rgba(176,120,0,.3);background:rgba(176,120,0,.04)}
.offense-chip.etp{border-color:rgba(176,120,0,.3);background:rgba(176,120,0,.04)}
.offense-chip.no-waiver{border-color:rgba(26,95,168,.3);background:rgba(26,95,168,.04)}
.offense-chip.dragging{opacity:0.6;border-style:dashed;transform:scale(0.98);transition:transform .2s;}

/* Tooltip for offense chips using title attribute */
.offense-chip[title]:hover::after {
  content: attr(title);
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  white-space: nowrap;
  z-index: 1000;
}
.chip-verdict{font-size:9px;font-weight:700;padding:2px 6px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.chip-v-bar{background:rgba(207,0,0,.2);color:#ff5555}
.chip-v-waivable{background:rgba(45,122,79,.2);color:#5bc989}
.chip-v-waiting{background:rgba(176,120,0,.2);color:#ffb84d}
.chip-v-etp{background:rgba(176,120,0,.2);color:#ffb84d}
.chip-v-no-waiver{background:rgba(26,95,168,.2);color:#5b9fd4}
.chip-v-unknown{background:rgba(255,255,255,.06);color:var(--fg-m)}
.chip-label{flex:1;font-size:12px;color:var(--fg2);font-weight:600}
.chip-auth{font-size:10px;color:var(--fg-m)}
.chip-del{background:none;border:none;cursor:pointer;color:var(--fg-m);padding:4px;display:flex;align-items:center}
.chip-del:hover{color:#ff6b6b}

/* ── QUESTIONS ─────────────────────────────────────────────── */
.q-wrap{max-width:560px}
.q-card{background:var(--bg-c);border:1px solid var(--bd);padding:24px;animation:fadeUp .25s ease both}
.q-num{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.q-text{font-size:15px;font-weight:700;color:var(--fg2);margin-bottom:6px;line-height:1.4}
.q-hint{font-size:11px;color:var(--fg-m);margin-bottom:16px;padding:8px 10px;background:rgba(255,255,255,.03);border-left:2px solid var(--bd-m);line-height:1.5}
.q-options{display:flex;flex-direction:column;gap:5px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg-s);border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.q-opt:hover{border-color:var(--bd-s);background:var(--bg-h)}
.q-opt.selected{border-color:var(--gold);background:rgba(255,204,1,.07)}
.q-opt-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd-s);flex-shrink:0;margin-top:1px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.q-opt.selected .q-opt-dot{border-color:var(--gold);background:var(--gold)}
.q-opt-dot-inner{width:6px;height:6px;border-radius:50%;background:#000}
.q-opt-label{font-size:13px;color:var(--fg2)}
.q-actions{display:flex;align-items:center;gap:10px;margin-top:16px}
.q-progress{display:flex;gap:4px;margin-bottom:20px}
.q-prog-dot{height:3px;flex:1;background:var(--bd-m);transition:background .2s;border-radius:2px}
.q-prog-dot.done{background:var(--gold)}
.q-prog-dot.active{background:rgba(255,204,1,.5)}

/* ── VERDICT ───────────────────────────────────────────────── */
.verdict-card{padding:24px;animation:stampIn .35s ease both}
.verdict-WAIVABLE{background:#111113;border:3px solid #FFCC01;box-shadow:0 0 0 1px #050507, 0 0 18px rgba(255,204,1,.35)}
.verdict-NO_WAIVER_REQUIRED{background:rgba(26,95,168,.1);border:2px solid rgba(26,95,168,.45)}
.verdict-NOT_WAIVABLE{background:rgba(207,0,0,.1);border:2px solid rgba(207,0,0,.45)}
.verdict-ETP_REQUIRED{background:rgba(176,120,0,.1);border:2px solid rgba(176,120,0,.4)}
.verdict-WAITING_PERIOD{background:rgba(176,120,0,.07);border:2px solid rgba(176,120,0,.35)}
.verdict-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.verdict-WAIVABLE .verdict-tag{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-tag{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-tag{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-tag,.verdict-WAITING_PERIOD .verdict-tag{color:#ffb84d}
.verdict-title{font-size:20px;font-weight:700;margin-bottom:8px}
.verdict-WAIVABLE .verdict-title{color:#5bc989}
.verdict-NO_WAIVER_REQUIRED .verdict-title{color:#5b9fd4}
.verdict-NOT_WAIVABLE .verdict-title{color:#ff5555}
.verdict-ETP_REQUIRED .verdict-title,.verdict-WAITING_PERIOD .verdict-title{color:#ffb84d}
.verdict-body{font-size:13px;color:var(--fg2);line-height:1.55;margin-bottom:12px}
.verdict-cite{font-size:11px;color:#FFCC01;padding:6px 12px;background:#111113;border-left:3px solid #FFCC01;display:inline-block;margin-bottom:12px;font-weight:600}
.authority-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#FFCC01;color:#000;font-weight:700;font-size:12px;letter-spacing:.04em;box-shadow:0 0 14px rgba(255,204,1,.55)}

/* ── APPROVABILITY METER ───────────────────────────────────── */
.approval-meter{padding:14px 16px;border:1px solid var(--bd);background:var(--bg-s);margin-top:12px}
.approval-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.approval-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-m)}
.approval-score{font-size:18px;font-weight:700}
.approval-bar-bg{height:6px;background:var(--bd-m);border-radius:3px;overflow:hidden}
.approval-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.approval-factors{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.approval-factor{font-size:10px;color:var(--fg-m);display:flex;align-items:center;gap:6px}
.factor-up{color:#5bc989}
.factor-down{color:#ff7070}
.approval-disclaimer{font-size:10px;color:var(--fg-d);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-style:italic}

/* ── FORMS ─────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em}
.form-input{background:var(--in-bg);border:1px solid var(--in-bd);color:var(--fg2);padding:8px 10px;font-family:inherit;font-size:12px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--fg-d)}
select.form-input{cursor:pointer}
.form-section{font-size:10px;font-weight:700;color:var(--fg-m);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}

/* ── OFFENSE TABLE ─────────────────────────────────────────── */
.off-table{width:100%;border-collapse:collapse}
.off-table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-m);padding:7px 10px;border-bottom:1px solid var(--bd-m);text-align:left}
.off-table td{font-size:12px;color:var(--fg2);padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.off-table tr:hover td{background:var(--bg-h)}
.off-docs-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;margin-right:3px}
.docs-yes{background:rgba(45,122,79,.2);color:#5bc989}
.docs-no{background:rgba(207,0,0,.15);color:#ff7070}
.waived-star{color:var(--gold);font-weight:700;margin-right:4px}

/* ── CHECKLIST ─────────────────────────────────────────────── */
.cl-item{border-bottom:1px solid var(--bd);overflow:hidden}
.cl-item:last-child{border-bottom:none}
.cl-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;cursor:pointer}
.cl-row:hover{background:var(--bg-h)}
.cl-check{width:18px;height:18px;border:2px solid var(--bd-s);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cl-check.checked{background:var(--gold);border-color:var(--gold)}
.cl-check svg{width:10px;height:8px;display:none}
.cl-check.checked svg{display:block}
.cl-body{flex:1}
.cl-label{font-size:12px;color:var(--fg2);margin-bottom:2px}
.cl-meta{font-size:10px;color:var(--fg-m)}
.cl-note{font-size:10px;color:rgba(255,204,1,.6);font-style:italic;margin-top:2px}
.cl-expand-arrow{color:var(--fg-m);flex-shrink:0;transition:transform .2s;font-size:10px}
.cl-status{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.status-badge{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;text-transform:uppercase;cursor:pointer;transition:all .15s;user-select:none}
.status-pending{background:rgba(255,255,255,.06);color:var(--fg-m)}
.status-progress{background:rgba(255,204,1,.15);color:var(--gold)}
.status-complete{background:rgba(45,122,79,.2);color:#5bc989}
.cl-howto{padding:12px 14px 14px 44px;background:rgba(255,255,255,.02);border-top:1px solid var(--bd);animation:fadeIn .15s ease}
.howto-label{font-size:10px;font-weight:700;color:var(--fg-m);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.howto-text{font-size:12px;color:var(--fg2);line-height:1.6;white-space:pre-wrap}
.howto-tip{font-size:11px;color:#ffb84d;padding:7px 10px;background:rgba(255,184,77,.06);border-left:2px solid rgba(255,184,77,.4);margin-top:8px;line-height:1.5}
.copy-btn{background:none;border:1px solid var(--gold);color:var(--gold);cursor:pointer;font-size:10px;margin-top:8px;padding:2px 6px;border-radius:3px;transition:background .2s;}
.copy-btn:hover{background:var(--gold);color:#000;}

/* ── EXPIRATION TRACKER ────────────────────────────────────── */
.exp-item{display:grid;grid-template-columns:1fr 140px 90px;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.exp-item:last-child{border-bottom:none}
.exp-label{font-size:12px;color:var(--fg2)}
.exp-valid{font-size:10px;color:var(--fg-m)}
.exp-status{font-size:10px;font-weight:700;padding:3px 8px;text-align:center}
.exp-ok{background:rgba(45,122,79,.2);color:#5bc989}
.exp-warn{background:rgba(255,204,1,.15);color:var(--gold)}
.exp-red{background:rgba(207,0,0,.2);color:#ff6b6b}
.exp-none{background:rgba(255,255,255,.05);color:var(--fg-m)}

/* ── OUTPUT CARDS ──────────────────────────────────────────── */
.output-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.output-card{background:var(--bg-c);border:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:8px}
.output-icon{width:30px;height:30px;background:rgba(255,204,1,.1);border:1px solid var(--bd-m);display:flex;align-items:center;justify-content:center}
.output-name{font-size:12px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em}
.output-desc{font-size:11px;color:var(--fg-m);line-height:1.5;flex:1}
.output-actions{display:flex;gap:6px}

/* ── MOS CHECKER ───────────────────────────────────────────── */
.mos-result{border:1px solid var(--bd);padding:14px;margin-top:10px}
.mos-result.high{border-color:rgba(207,0,0,.35);background:rgba(207,0,0,.05)}
.mos-result.medium{border-color:rgba(255,204,1,.3);background:rgba(255,204,1,.04)}
.mos-result.low{border-color:rgba(45,122,79,.3);background:rgba(45,122,79,.04)}
.mos-result-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.mos-result.high .mos-result-label{color:#ff6b6b}
.mos-result.medium .mos-result-label{color:var(--gold)}
.mos-result.low .mos-result-label{color:#5bc989}
.mos-restriction{font-size:11px;color:var(--fg2);padding:4px 0;display:flex;align-items:flex-start;gap:7px;border-bottom:1px solid var(--bd)}
.mos-restriction:last-child{border-bottom:none}

/* ── MODAL ─────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;animation:fadeIn .15s ease}
.modal{background:var(--bg-s);border:1px solid var(--bd-m);width:100%;max-width:680px;animation:fadeUp .2s ease}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.modal-title{font-size:12px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;flex:1}
.modal-body{padding:18px;max-height:72vh;overflow-y:auto}
.modal-ftr{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd)}

/* ── DOC PREVIEW ───────────────────────────────────────────── */
.doc-preview{background:var(--bg);border:1px solid var(--bd);padding:18px;font-family:"Courier New",monospace;font-size:12px;color:var(--fg2);white-space:pre-wrap;line-height:1.7;max-height:55vh;overflow-y:auto}

/* ── BUTTONS ───────────────────────────────────────────────── */
.btn{padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s;border:none;outline:none}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#e6b800;filter:brightness(1.05)}
.btn-outline{background:none;border:1px solid var(--bd-m);color:var(--fg-m)}
.btn-outline:hover{border-color:var(--bd-s);color:var(--fg2)}
.btn-danger{background:rgba(207,0,0,.15);border:1px solid rgba(207,0,0,.35);color:#ff7070}
.btn-danger:hover{background:rgba(207,0,0,.25)}
.btn-green{background:rgba(45,122,79,.2);border:1px solid rgba(45,122,79,.4);color:#5bc989}
.btn-green:hover{background:rgba(45,122,79,.3)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ── ALERTS / BANNERS ──────────────────────────────────────── */
.alert{padding:10px 14px;font-size:12px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.alert-warn{background:rgba(176,120,0,.12);border:1px solid rgba(176,120,0,.35);color:#ffb84d}
.alert-info{background:rgba(26,95,168,.1);border:1px solid rgba(26,95,168,.3);color:#5b9fd4}
.alert-danger{background:rgba(207,0,0,.12);border:1px solid rgba(207,0,0,.35);color:#ff6b6b}
.alert-success{background:rgba(45,122,79,.1);border:1px solid rgba(45,122,79,.3);color:#5bc989}
.alert-icon{font-size:14px;flex-shrink:0;margin-top:1px}

/* ── RESUME MODAL ──────────────────────────────────────────── */
.resume-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.resume-box{background:var(--bg-s);border:1px solid var(--bd-m);padding:28px;max-width:360px;width:100%;margin:16px;animation:fadeUp .2s ease}
.resume-title{font-size:14px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.resume-applicant{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px}
.resume-ts{font-size:11px;color:var(--fg-m);margin-bottom:20px}

/* ── UTILITY ───────────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--fg-m)}
.gold{color:var(--gold)}
.danger{color:#ff6b6b}
.success{color:#5bc989}
.label-sm{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m)}
.divider{height:1px;background:var(--bd);margin:14px 0}
.empty-state{text-align:center;padding:28px 20px;color:var(--fg-m);font-size:12px}
.new-badge{background:rgba(45,122,79,.2);color:#5bc989;font-size:9px;font-weight:700;padding:1px 5px;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;margin-left:5px}

/* ── REF HIGHLIGHT ─────────────────────────────────────────── */
.ref-entry.highlighted{border-color:var(--gold);background:rgba(255,204,1,.07)}
@keyframes refPulse{0%{box-shadow:0 0 0 0 rgba(255,204,1,.5)}70%{box-shadow:0 0 0 6px rgba(255,204,1,0)}100%{box-shadow:0 0 0 0 rgba(255,204,1,0)}}
.ref-entry.pulse{animation:refPulse .6s ease}

/* ══════════════════════════════════════════════════════════════
   TACTICAL OVERRIDE LAYER — "Bold Tactical" aggressive redesign
   Loaded last so it overrides the base styles above.
   ══════════════════════════════════════════════════════════════ */

/* Intensified frame contrast */
:root,[data-theme="dark"]{
  --bd:rgba(255,204,1,.16);
  --bd-m:rgba(255,204,1,.32);
  --bd-s:rgba(255,204,1,.58);
}

/* Heavier, more commanding display type */
.topbar-title{font-size:14px;letter-spacing:.14em}
.card-title{letter-spacing:.09em}
.tab-btn,.btn{letter-spacing:.09em}
.offense-group-label,.form-section,.label-sm,.sidebar-title,
.ref-panel-title,.verdict-tag{letter-spacing:.13em}

/* Top command accent rail on the header */
.topbar{border-bottom:2px solid var(--bd-m);box-shadow:0 2px 0 rgba(0,0,0,.55)}
.topbar::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),rgba(255,204,1,0) 55%);z-index:1}

/* Notched tactical chip badges */
.topbar-badge{clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);
  filter:drop-shadow(0 0 8px rgba(255,204,1,.45))}

/* Buttons — beveled corners + drop-shadow glow (survives clip-path) */
.btn{clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.btn-gold{filter:drop-shadow(0 3px 9px rgba(255,204,1,.22))}
.btn-gold:hover{filter:drop-shadow(0 0 14px rgba(255,204,1,.5));transform:translateY(-1px)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}

/* Tab nav — active tab reads as a lit command block */
.tab-btn{border-bottom-width:3px}
.tab-btn.active{background:linear-gradient(180deg,rgba(255,204,1,.12),rgba(255,204,1,0))}

/* Cards — HUD corner brackets + faint top sheen */
.card{position:relative;background:linear-gradient(180deg,rgba(255,204,1,.018),transparent 40%),var(--bg-c)}
.card::before{content:"";position:absolute;top:-1px;left:-1px;width:13px;height:13px;
  border-top:2px solid var(--gold);border-left:2px solid var(--gold);opacity:.6;pointer-events:none}
.card::after{content:"";position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;
  border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);opacity:.6;pointer-events:none}

/* Section bar — taller, glowing command stripe */
.section-bar{width:4px;box-shadow:0 0 8px rgba(255,204,1,.55)}

/* Verdict card — heavy beveled tactical frame */
.verdict-card{clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
  border-width:2px}
.verdict-title{font-size:23px;letter-spacing:.02em}
.verdict-WAIVABLE{filter:drop-shadow(0 0 16px rgba(255,204,1,.4))}

/* Authority badge — command pill */
.authority-badge{clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}

/* Hazard-stripe accent on absolute-bar / denial states */
.offense-card.bar,.verdict-NOT_WAIVABLE,.alert-danger{
  background-image:repeating-linear-gradient(45deg,rgba(207,0,0,.10) 0 10px,transparent 10px 20px)}
.verdict-NOT_WAIVABLE{border-width:2px}

/* Offense / applicant cards — lift + lock-on highlight */
.offense-card,.appl-card{transition:all .15s}
.offense-card:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.45)}
.offense-card.selected{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(255,204,1,.22)}
.appl-card.active{box-shadow:inset 3px 0 0 var(--gold)}

/* Beveled status / level micro-badges */
.offense-level-badge,.chip-verdict,.status-badge{
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}

/* Inputs — sharper tactical focus ring */
.form-input:focus{box-shadow:0 0 0 1px rgba(255,204,1,.32)}

/* Readiness ring glow */
.readiness-ring .ring-fill{filter:drop-shadow(0 0 3px rgba(255,204,1,.5))}


/* ── CASE SCREENING (Step 1) ───────────────────────────────── */
.case-q{padding:12px 4px;border-bottom:1px solid var(--bd)}
.case-q:last-child{border-bottom:none}
.case-q-text{font-size:13px;font-weight:700;color:var(--fg2);margin-bottom:8px;line-height:1.4}
.case-q-opts{display:flex;flex-wrap:wrap;gap:6px}
.case-opt{padding:7px 12px;font-size:11px;font-weight:600;border:1px solid var(--bd-m);background:var(--bg-s);color:var(--fg2);cursor:pointer;transition:all .15s;font-family:inherit;text-align:left}
.case-opt:hover{border-color:var(--bd-s)}
.case-opt.selected{border-color:var(--gold);background:rgba(255,204,1,.1);color:var(--gold)}
.case-opt.selected.danger{border-color:#ff5555;background:rgba(207,0,0,.12);color:#ff7070}

/* ── RESPONSIVE (phone / narrow) ───────────────────────────── */
@media (max-width: 900px){
  html,body{overflow:auto}
  .app-shell{flex-direction:column;overflow:visible}
  .sidebar{position:fixed;top:52px;left:0;bottom:0;z-index:60;width:min(280px,85vw);box-shadow:4px 0 20px rgba(0,0,0,.5)}
  .sidebar.collapsed{width:0;box-shadow:none}
  .ref-panel{width:100%;border-left:none;border-top:1px solid var(--bd);max-height:40vh}
  .main-panel{overflow:visible}
  .main-scroll{overflow:visible;padding:12px}
  .topbar{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
  .topbar-center{order:3;flex-basis:100%;justify-content:flex-start}
  .tab-btn{padding:9px 8px;font-size:10px;letter-spacing:.04em}
  .form-grid,.form-grid-3,.form-grid-4{grid-template-columns:1fr 1fr}
  .offense-grid{grid-template-columns:1fr}
  .output-grid{grid-template-columns:1fr}
  .case-q-opts{flex-direction:column}
  .case-opt{width:100%}
}
@media (max-width: 540px){
  .form-grid,.form-grid-3,.form-grid-4{grid-template-columns:1fr}
  .exp-item{grid-template-columns:1fr;gap:6px}
}

/* ── PRINT ─────────────────────────────────────────────────── */
@media print{
  body{background:#fff;color:#000}
  .topbar,.sidebar,.tab-nav,.ref-panel,.no-print{display:none!important}
  .main-scroll{overflow:visible;padding:0}
  .app-shell{display:block}
}
</style>

<body>
<div id="root"></div>
<script src="waiver-data.js?v=4"></script>
<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const {
  OFFENSE_CATEGORIES, CASE_QUESTIONS, CHECKLIST_ITEMS,
  DISPOSITION_OPTIONS, CONFINEMENT_OPTIONS, PROBATION_OPTIONS,
  SAMPLE_SCENARIOS, PARA_TEXT, ED_LEVELS, US_STATES,
  MOS_RESTRICTIONS, APPROVABILITY_FACTORS,
  CAT_PARA_MAP, Q_PARA_MAP, REG_VERSION
} = window;

/* ── Icons ─────────────────────────────────────────────── */
const IcoCheck  = () => <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.8L3.8 7L9 1" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoX      = ({s=10,c="currentColor"}) => <svg width={s} height={s} viewBox="0 0 10 10" fill="none"><path d="M1 1L9 9M9 1L1 9" stroke={c} strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoChev   = ({open,size=10}) => <svg width={size} height={size} viewBox="0 0 10 10" fill="none" style={{transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoDoc    = () => <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9H3V2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><path d="M10 2v3h3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M5 8h6M5 10.5h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoPrint  = () => <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="5" width="12" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M4 5V3h8v2M5 10h6M5 12h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoClock  = () => <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.3"/><path d="M7 4v3l2 2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoShield = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.5L2 4v4c0 2.5 2 4.5 5 5 3-0.5 5-2.5 5-5V4L7 1.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>;
const IcoPlus   = () => <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoTrash  = () => <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M1.5 3h9M5 3V2h2v1M3 3l.5 7h5L9 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoUser   = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="3" stroke="currentColor" strokeWidth="1.3"/><path d="M2 13c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const IcoStar   = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1l1.4 3.1H11L8.1 6.4l1.1 3.2L6 7.7l-3.2 1.9L3.9 6.4 1 4.1h3.6z" stroke="currentColor" strokeWidth="1.1" fill="currentColor" fillOpacity=".3"/></svg>;
const IcoGauge  = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 11a5 5 0 1 1 10 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M7 11L4.5 7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;
const IcoMOS    = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="3" width="11" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M5 3V2h4v1M4 7h6M4 9.5h4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;

/* ── Storage ────────────────────────────────────────────── */
const STORAGE_KEY = 'moral-waiver-v4';

const loadRoster = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch { return null; } };
const saveRoster = (roster) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(roster)); } catch {} };

const blankApplicant = () => ({
  id: `a${Date.now()}${Math.floor(Math.random()*1e4)}`,
  savedAt: new Date().toISOString(),
  // Applicant Info (SSN stored as last-4 only — full SSN is never persisted)
  lastName:'', firstName:'', mi:'', ssn:'', dob:'', rsid:'',
  educationLevel:'', educationCode:'', afqt:'', psNps:'', maritalStatus:'',
  numDependents:'', dependentAges:'',
  // Recruiter Info
  recruiterUnit:'', recruiterAddress:'', recruiterOfficeSym:'', recruiterName:'', recruiterRank:'',
  // Screening — case-level answers (asked once) + offense record
  caseAnswers:{},
  offenses: [],   // { id, categoryId, offenseDate, convictionDate, disposition, confinement, releaseDate, probation, description, city, county, state, dispositionText, courtDocs, incidentRpt }
  // Packet
  checklistStatus:{}, checklistNotes:{}, expDates:{},
  // MOS
  mosCode:'',
});

/* ── Helpers ────────────────────────────────────────────── */
const fmtDate = iso => { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return iso; } };
const today = () => new Date().toISOString().split('T')[0];

const daysUntilExpiry = (dateObtained, validityDays) => {
  if (!dateObtained || !validityDays) return null;
  const exp = new Date(dateObtained);
  exp.setDate(exp.getDate() + validityDays);
  return Math.ceil((exp - new Date()) / 86400000);
};

const getExpiryStatus = (days) => {
  if (days === null) return 'none';
  if (days < 0) return 'red';
  if (days <= 30) return 'warn';
  return 'ok';
};

/* ── Core Logic — whole-case verdict engine (AR 601-210, 20 Mar 2026) ───── */
const ADVERSE_DISPS = ['convicted','adverse'];
const isAdverse = o => ADVERSE_DISPS.includes(o.disposition);
const catOf = id => OFFENSE_CATEGORIES.find(c => c.id === id);
// Parse YYYY-MM-DD as LOCAL midnight — bare new Date(iso) parses as UTC and
// shifts clock math by up to a day (or 4 days across month boundaries).
const localDate = iso => new Date(`${iso}T00:00:00`);
const yearsSince = iso => (Date.now() - localDate(iso).getTime()) / (365.25*24*3600*1000);
const addMonthsIso = (iso, m) => { const d = localDate(iso); d.setMonth(d.getMonth() + m); return d; };
const sortNewest = arr => [...arr].sort((a,b) => (b.offenseDate||'').localeCompare(a.offenseDate||''));
const isJuvenileOffense = (applicant, o) => {
  if (!applicant.dob || !o.offenseDate) return false;
  const cut = localDate(applicant.dob); cut.setFullYear(cut.getFullYear() + 18);
  return localDate(o.offenseDate) < cut;
};

// The regulation decides waivers by counting offenses across the WHOLE record
// (paras 4-6 / 4-7), so eligibility is computed from the full case, not per offense.
const computeCaseVerdict = (applicant) => {
  const ca = applicant.caseAnswers || {};
  const offenses = applicant.offenses || [];
  const answered = Object.values(ca).some(v => v);
  if (!offenses.length && !answered) return null;

  const bars = [], waivers = [], waits = [], suitability = [], notes = [];
  const waivedIds = [];
  let etp = false;
  const isPS = applicant.psNps === 'PS';

  /* ── Case-level bars (asked once) ── */
  if (ca.pending_charges === 'yes') bars.push({ perm:false, title:'Pending Charges', cite:'AR 601-210, 4-22g / 4-33', text:'Criminal or juvenile charges are pending — this includes UNPAID traffic tickets. No processing (including waiver submission) until all charges are fully resolved.' });
  if (ca.civil_restraint === 'active') bars.push({ perm:false, title:'Under Civil Restraint', cite:'AR 601-210, 4-22h', text:'Applicant is currently confined, on parole, or on supervised probation. Cannot process. Exception: unsupervised probation for para 4-35 minor offenses only.' });
  if (ca.dependence === 'yes') bars.push({ perm:false, title:'Alcohol / Drug Dependence Not in Remission', cite:'AR 601-210, 4-22b / 4-22c', text:'Not eligible until in sustained remission for 12 consecutive months.' });
  if (ca.lautenberg === 'yes') bars.push({ perm:true, title:'Lautenberg DV Conviction', cite:'AR 601-210, 4-7b · Table 4-4, Code 414', text:'Qualifying misdemeanor domestic violence conviction — enlistment prohibited. No waivers will be approved at any level.' });
  if (ca.sex_offender === 'yes') bars.push({ perm:true, title:'Sex Offense / Registry Listing', cite:'AR 601-210, 4-22j / 4-7d', text:'Sex offense conviction or sex offender registry listing — permanently disqualified. No waiver authorized.' });
  if (ca.civil_restraint === 'unsupervised') notes.push({ label:'Unsupervised probation for a para 4-35 minor offense — may process, provided all fines are paid, all conditions complete, and no further court action is pending.', cite:'4-35' });
  if (ca.dependence === 'remission') notes.push({ label:'Prior dependence in sustained remission 12+ consecutive months — eligible. Document treatment history on DD 2807-2.', cite:'4-22b/c' });

  /* ── Classify each offense ── */
  const majors=[], miscs=[], minors=[], traffics=[], dats=[];
  let duiLast3 = 0, drugPossLast3 = 0;
  const suitSeen = new Set();
  const addSuit = (label, level, cite) => { const k = level + cite; if (!suitSeen.has(k)) { suitSeen.add(k); suitability.push({ label, level, cite }); } };

  offenses.forEach(o => {
    const cat = catOf(o.categoryId); if (!cat) return;

    // Suitability reviews apply REGARDLESS of disposition (4-2f(2)(a))
    if (cat.suitability) addSuit(cat.label, cat.suitability.level, cat.suitability.cite);
    if (cat.class === 'major') addSuit('Major misconduct charge (required regardless of disposition)', 'USARD', '4-2f(2)(a)3');

    // DAT results and PS military discipline are not court cases — handle before disposition
    if (cat.group === 'dat') {
      if (cat.class === 'bar') bars.push({ perm:true, title:cat.label, cite:`AR 601-210, ${cat.barPara}`, text:cat.barText });
      else dats.push(o);
      return;
    }
    if (cat.class === 'ps') {
      notes.push({ label:`${cat.label} — military discipline history is handled through suitability review / RE-code rules, not a civil conduct waiver. Consult S1/EEPD.`, cite:'4-12c' });
      return;
    }

    if (o.disposition === 'dismissed') {
      notes.push({ label:`${cat.label}: dismissed with no adverse disposition — no waiver required. Still list on SF 86 and UF 601-210.08.`, cite:'4-30a' });
      return;
    }
    if (o.disposition === 'self_admit') {
      if (cat.class === 'major' || cat.class === 'misc') {
        etp = true;
        notes.push({ label:`${cat.label}: self-admitted, no court record — run a court check first (UF 601-210.02 if court will not furnish), then coordinate with BN S1. An Exception to Policy may be required before waiver processing.`, cite:'4-30a / QC Checklist' });
      } else {
        notes.push({ label:`${cat.label}: self-admitted with no record — no waiver required. Document on SF 86.`, cite:'4-30a' });
      }
      return;
    }
    if (!isAdverse(o)) return; // disposition not yet selected

    if (cat.class === 'bar') { bars.push({ perm:true, title:cat.label, cite:`AR 601-210, ${cat.barPara}`, text:cat.barText }); waivedIds.push(o.id); return; }
    if (cat.class === 'major') majors.push(o);
    else if (cat.class === 'misc') miscs.push(o);
    else if (cat.class === 'minor') minors.push(o);
    else if (cat.class === 'traffic') traffics.push(o);

    if (cat.dui && o.offenseDate && yearsSince(o.offenseDate) <= 3) duiLast3++;
    if (cat.drugPossession && o.offenseDate && yearsSince(o.offenseDate) <= 3) drugPossLast3++;
  });

  const nMaj = majors.length, nMisc = miscs.length, nMinor = minors.length;

  /* ── Count-based bars ── */
  if (nMaj >= 2) bars.push({ perm:true, title:'Two or More Major Misconduct Convictions', cite:'AR 601-210, 4-22i', text:'Conviction or adverse disposition for more than one major misconduct (felony-level) offense — cannot be waived at any level.' });
  if (nMisc >= 6) bars.push({ perm:true, title:'Six or More Misconduct Offenses', cite:'AR 601-210, 4-6c', text:'Six or more misconduct convictions/adverse dispositions prior to application — a waiver may not be considered.' });
  if (nMaj >= 1) {
    const nonTraffic = nMaj + nMisc + nMinor;
    if (nonTraffic >= 3) bars.push({ perm:true, title:'Major Misconduct + 3 or More Non-Traffic Offenses', cite:'AR 601-210, 4-7c(1)', text:`Major misconduct conviction combined with ${nonTraffic} total non-traffic offenses — a waiver may not be considered.` });
    if (duiLast3 >= 2) bars.push({ perm:true, title:'Major Misconduct + 2 DUIs Within 3 Years', cite:'AR 601-210, 4-7c(4)', text:'Major misconduct conviction combined with two or more DUI convictions/adverse dispositions within 3 years of application — a waiver may not be considered.' });
    if (drugPossLast3 >= 2) bars.push({ perm:true, title:'Major Misconduct + 2 Drug Possession Charges Within 3 Years', cite:'AR 601-210, 4-7c(6)', text:'Major misconduct conviction combined with two or more separate drug/paraphernalia possession charges within 3 years of application — a waiver may not be considered.' });
    if (isPS) bars.push({ perm:true, title:'Prior Service + Major Misconduct', cite:'AR 601-210, 4-7c(5)', text:'PS applicant with a major misconduct conviction incurred DURING or AFTER military service — a waiver may not be considered. Verify offense timing against service dates: if the offense occurred entirely before service, this bar does not apply — confirm with S1.' });
  }

  /* ── Waiver requirements ── */
  if (nMaj >= 1) {
    waivers.push({ label:`Major misconduct (felony-level) — ${nMaj === 1 ? 'single offense' : nMaj + ' offenses'}`, authority:'USARD', cite:'4-7a' });
    majors.forEach(o => {
      waivedIds.push(o.id);
      const cat = catOf(o.categoryId);
      const clock = o.convictionDate || o.offenseDate;
      if (clock) {
        const earliest = addMonthsIso(clock, 24);
        const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
        if (daysLeft > 0) waits.push({ id:`w24_${o.id}`, label:`${cat?.label} — 24-month wait from conviction date`, from:clock, earliest, daysLeft, cite:'4-7a', note: o.convictionDate ? null : 'Estimated from OFFENSE date — enter the conviction date for the correct clock.' });
      } else {
        waits.push({ id:`w24_${o.id}`, label:`${cat?.label} — 24-month wait from conviction date`, needDate:true, cite:'4-7a' });
      }
      if (isJuvenileOffense(applicant, o)) notes.push({ label:`${cat?.label}: committed as a juvenile — if no offenses within 5 years of application, may be considered in meritorious cases.`, cite:'4-7c(2)' });
    });
  }

  if (nMisc >= 2) {
    waivers.push({ label:`${nMisc} misconduct offenses (two to five require a waiver)`, authority:'BN', cite:'4-6a(2)' });
    miscs.forEach(o => waivedIds.push(o.id));
  } else if (nMisc === 1) {
    const o = miscs[0], cat = catOf(o.categoryId);
    if (cat.noWaiverSingle) {
      notes.push({ label:`${cat.label}: single conviction — NO waiver required (20 Mar 2026 change). Must still be listed on UF 601-210.08, SF 86, and RZ. A negative MEPS drug test is still required.`, cite:'4-6a (2026)' });
    } else if (cat.singleWaiver) {
      waivers.push({ label:`${cat.label} — a single conviction requires a waiver`, authority:'BN', cite:'4-6a(4)' });
      waivedIds.push(o.id);
    } else {
      notes.push({ label:`${cat.label}: single misconduct conviction — no waiver required unless combined with other offenses (2–5 misconduct = waiver). List on UF 601-210.08 and SF 86.`, cite:'4-6a(2)' });
    }
  }

  if (nMinor >= 5) {
    waivers.push({ label:`${nMinor} minor nontraffic offenses (five or more require a waiver)`, authority:'BN', cite:'4-6a(1)' });
    minors.forEach(o => waivedIds.push(o.id));
  } else if (nMisc >= 1 && (nMisc + nMinor) >= 5) {
    waivers.push({ label:`Combination of ${nMisc + nMinor} misconduct + minor nontraffic offenses`, authority:'BN', cite:'4-6a(3)' });
    [...miscs, ...minors].forEach(o => { if (!waivedIds.includes(o.id)) waivedIds.push(o.id); });
  } else if (nMinor > 0) {
    notes.push({ label:`${nMinor} minor nontraffic offense(s) — under the five-offense threshold, no waiver required. List on UF 601-210.08 and SF 86.`, cite:'4-6a(1)' });
  }

  if (traffics.length > 0) notes.push({ label:'Minor traffic violations — no waiver required. Verify no UNPAID tickets (unpaid = pending charges, 4-22g). List on UF 601-210.08.', cite:'4-8 / 4-22g' });

  /* ── DAT waivers ── */
  dats.forEach(o => {
    const cat = catOf(o.categoryId);
    waivers.push({ label: cat.label, authority:'BN', cite:'4-18' });
    waivedIds.push(o.id);
    if (isPS) bars.push({ perm:true, title:'Prior Service + Positive DAT', cite:'AR 601-210, 4-18d', text:'A waiver may not be considered for a PS applicant who tested positive at MEPS for any drug use.' });
    if (o.offenseDate && cat.datRetestDays) {
      const earliest = localDate(o.offenseDate); earliest.setDate(earliest.getDate() + cat.datRetestDays);
      const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
      if (daysLeft > 0) waits.push({ id:`wdat_${o.id}`, label:`${cat.label} — ${cat.datRetestDays === 90 ? '90-day' : '1-year'} retest wait from test date`, from:o.offenseDate, earliest, daysLeft, cite:'4-18b' });
    }
  });

  /* ── 4-31 confinement waiting periods (run from RELEASE date) ── */
  if (waivers.length) {
    offenses.filter(isAdverse).forEach(o => {
      if (!waivedIds.includes(o.id)) return;
      const cat = catOf(o.categoryId);
      const wm = o.confinement === '15plus' ? 6 : o.confinement === '1to14' ? 3 : 0;
      if (wm) {
        if (o.releaseDate) {
          const earliest = addMonthsIso(o.releaseDate, wm);
          const daysLeft = Math.ceil((earliest - new Date()) / 86400000);
          if (daysLeft > 0) waits.push({ id:`wc_${o.id}`, label:`${cat?.label} — ${wm}-month wait after release from confinement`, from:o.releaseDate, earliest, daysLeft, cite:`4-31b(${wm === 3 ? '2' : '3'})`, note:`BN CO may waive up to ${wm === 3 ? '45 days' : '3 months'} if sentenced only to a fine and elected confinement instead (court verification required).` });
        } else {
          waits.push({ id:`wc_${o.id}`, label:`${cat?.label} — ${wm}-month wait after RELEASE from confinement`, needDate:true, cite:'4-31b' });
        }
      }
      if (o.probation === 'completed') notes.push({ label:`${cat?.label}: probation/parole completed — obtain probation officer completion documents before submission.`, cite:'4-31b(1) / 4-28e(2)' });
      if (o.probation === 'active') bars.push({ perm:false, title:'Probation / Parole Still Active', cite:'AR 601-210, 4-22h', text:`${cat?.label}: probation or parole is still active — applicant is under civil restraint and cannot process (unless unsupervised probation for a para 4-35 minor offense).` });
    });
  }

  /* ── Count-based suitability reviews (4-2f) ── */
  if (nMisc >= 2) addSuit(`${nMisc} misconduct offenses`, 'BN', '4-2f(2)(a)1');
  if (nMisc + nMinor >= 4) addSuit(`${nMisc + nMinor} combined nontraffic/misconduct offenses`, 'BN', '4-2f(2)(a)2');

  /* ── Overall status ── */
  const authority = waivers.some(w => w.authority === 'USARD') ? 'USARD' : (waivers.length ? 'BN' : null);
  let status;
  if (bars.length) status = 'NOT_WAIVABLE';
  else if (waivers.length) status = waits.some(w => w.needDate || w.daysLeft > 0) ? 'WAITING_PERIOD' : 'WAIVABLE';
  else if (etp) status = 'ETP_REQUIRED';
  else if (offenses.length) status = 'NO_WAIVER_REQUIRED';
  else status = 'PENDING';

  return { status, authority, bars, waivers, waits, suitability, notes, etp,
           permBar: bars.some(b => b.perm), waivedIds,
           counts:{ major:nMaj, misc:nMisc, minor:nMinor, traffic:traffics.length, dat:dats.length } };
};

// UNOFFICIAL approval-odds estimate — weights are heuristic, not regulatory.
const computeApprovabilityScore = (applicant, verdict) => {
  if (!verdict || !verdict.waivers.length || verdict.bars.length) return null;
  let score = 60;
  const factors = [];

  const authMod = APPROVABILITY_FACTORS.authorityMods[verdict.authority] || 0;
  if (authMod) { factors.push({ label:`${verdict.authority} level authority`, mod:authMod }); score += authMod; }

  const cnt = verdict.waivedIds.length;
  const cntMod = cnt <= 1 ? 15 : cnt === 2 ? -10 : cnt === 3 ? -20 : -35;
  factors.push({ label:`${cnt} offense(s) in waiver`, mod:cntMod }); score += cntMod;

  const waivedDates = (applicant.offenses||[]).filter(o => o.offenseDate && verdict.waivedIds.includes(o.id)).map(o => o.offenseDate).sort().reverse();
  if (waivedDates[0]) {
    const y = yearsSince(waivedDates[0]);
    const tf = APPROVABILITY_FACTORS.timeFactors.find(t => y <= t.yearsAgo) || APPROVABILITY_FACTORS.timeFactors[APPROVABILITY_FACTORS.timeFactors.length-1];
    if (tf.mod) { factors.push({ label:tf.label, mod:tf.mod }); score += tf.mod; }
  }

  const afqt = parseInt(applicant.afqt);
  if (!isNaN(afqt)) {
    const am = APPROVABILITY_FACTORS.afqtMods.find(a => afqt >= a.min);
    if (am && am.mod) { factors.push({ label:am.label, mod:am.mod }); score += am.mod; }
  }

  const eduMod = APPROVABILITY_FACTORS.educationMods[applicant.educationLevel] ?? 0;
  if (eduMod) { factors.push({ label:applicant.educationLevel, mod:eduMod }); score += eduMod; }

  if ((applicant.offenses||[]).some(o => verdict.waivedIds.includes(o.id) && isJuvenileOffense(applicant, o))) {
    factors.push({ label:'Juvenile offense', mod:APPROVABILITY_FACTORS.juvenileMod }); score += APPROVABILITY_FACTORS.juvenileMod;
  }
  if (verdict.counts.major === 0) {
    factors.push({ label:'No major misconduct', mod:APPROVABILITY_FACTORS.firstOffenseMod }); score += APPROVABILITY_FACTORS.firstOffenseMod;
  }

  return { score: Math.max(5, Math.min(95, Math.round(score))), factors };
};

// Confinement/probation drive extra checklist items (4-28e(2)/(3), FL 601-210.04)
const offenseFlags = (offenses) => {
  const cats = offenses.map(o => catOf(o.categoryId)).filter(Boolean);
  return {
    trafficOnly: offenses.length > 0 && cats.every(c => c.class === 'traffic'),
    anyProbation: offenses.some(o => o.probation === 'completed' || o.probation === 'active'),
    anyConfined: offenses.some(o => ['under24','1to14','15plus'].includes(o.confinement)),
    anyConfined24: offenses.some(o => ['1to14','15plus'].includes(o.confinement)),
  };
};

const getRequiredChecklist = (authority, flags = {}) => {
  return CHECKLIST_ITEMS.filter(item => {
    switch (item.group) {
      case 'all': return true;
      case 'non_traffic': return !flags.trafficOnly;
      case 'usard':
      case 'major': return authority === 'USARD';
      case 'probation': return !!flags.anyProbation;
      case 'confined': return !!flags.anyConfined;
      case 'confined_24plus': return !!flags.anyConfined24;
      default: return false;
    }
  });
};

const computeReadiness = (applicant, verdict, clStatus) => {
  let score = 0;
  const breakdown = [];

  const caseDone = CASE_QUESTIONS.every(q => (applicant.caseAnswers||{})[q.id]);
  if (caseDone) { score += 10; breakdown.push({ label:'Case screening complete', done:true }); }
  else breakdown.push({ label:'Case screening', done:false });

  if ((applicant.offenses||[]).length > 0) { score += 10; breakdown.push({ label:'Offenses logged', done:true }); }
  else breakdown.push({ label:'Offense record', done:false });

  const infoFilled = ['lastName','firstName','dob','rsid'].every(f => applicant[f]);
  if (infoFilled) { score += 15; breakdown.push({ label:'Applicant info complete', done:true }); }
  else breakdown.push({ label:'Applicant info', done:false });

  const required = getRequiredChecklist(verdict?.authority || 'BN', offenseFlags(applicant.offenses||[]));
  const completedItems = required.filter(i => clStatus[i.id] === 'complete').length;
  score += required.length > 0 ? Math.round((completedItems / required.length) * 65) : 0;
  breakdown.push({ label:`Checklist (${completedItems}/${required.length})`, done: completedItems === required.length && required.length > 0 });

  return { score: Math.min(100, score), breakdown };
};

/* ── Readiness Ring ─────────────────────────────────────── */
const ReadinessRing = ({ score }) => {
  const R = 15, C = 2*Math.PI*R;
  const offset = C - (score/100)*C;
  const color = score >= 80 ? '#5bc989' : score >= 50 ? 'var(--gold)' : '#ff7070';
  return (
    <div className="readiness-ring" title={`Packet ${score}% ready`}>
      <svg width="36" height="36" viewBox="0 0 36 36">
        <circle className="ring-bg" cx="18" cy="18" r={R}/>
        <circle className="ring-fill" cx="18" cy="18" r={R}
          stroke={color} strokeDasharray={C} strokeDashoffset={offset}/>
      </svg>
      <div className="readiness-pct" style={{color}}>{score}%</div>
    </div>
  );
};

/* ── Applicant Card (Sidebar) ───────────────────────────── */
const ApplicantCard = ({ appl, active, onClick, onDelete }) => {
  const verdict = computeCaseVerdict(appl);
  const { score } = computeReadiness(appl, verdict, appl.checklistStatus||{});
  const statusColor = verdict?.status === 'NOT_WAIVABLE' ? 'status-red' :
    score >= 80 ? 'status-green' : score >= 30 ? 'status-yellow' : 'status-gray';
  const name = [appl.firstName, appl.lastName].filter(Boolean).join(' ') || 'Unnamed Applicant';
  return (
    <div className={`appl-card${active?' active':''}`} onClick={onClick}>
      <div className={`appl-card-status ${statusColor}`}/>
      <div className="appl-card-name">{name}</div>
      <div className="appl-card-meta">
        {appl.rsid && <span style={{marginRight:6}}>{appl.rsid}</span>}
        {verdict?.authority === 'USARD' && <span style={{color:'var(--gold)'}}>USARD</span>}
        <span style={{float:'right'}}>{score}% ready</span>
      </div>
      <button className="btn btn-danger btn-sm" style={{marginTop:6,width:'100%',padding:'3px 0',fontSize:10}}
        onClick={e=>{e.stopPropagation();onDelete();}}>Remove</button>
    </div>
  );
};

/* ── Phase 1: Case Screening + Offense Record ───────────── */
const CLASS_BADGE = {
  bar:     { cls:'lvl-BAR',       label:'BAR IF CONVICTED' },
  major:   { cls:'lvl-MAJOR',     label:'MAJOR · TABLE 4-4' },
  misc:    { cls:'lvl-MISC',      label:'MISCONDUCT · TABLE 4-3' },
  minor:   { cls:'lvl-NO-WAIVER', label:'MINOR · TABLE 4-2' },
  traffic: { cls:'lvl-TRAFFIC',   label:'TRAFFIC · TABLE 4-1' },
  dat:     { cls:'lvl-VARIES',    label:'MEPS DAT' },
  ps:      { cls:'lvl-VARIES',    label:'PRIOR SERVICE' },
};

const OFFENSE_GROUPS = [
  { key:'bars',   label:'⛔ Not Waivable if Convicted', color:'#ff5555' },
  { key:'major',  label:'🔴 Major Misconduct — Felony Level (Table 4-4)', color:'#ff6b6b' },
  { key:'misc',   label:'🟡 Misconduct — Misdemeanor Level (Table 4-3)', color:'var(--gold)' },
  { key:'minor',  label:'🔵 Minor Nontraffic (Table 4-2)', color:'#7eb8ff' },
  { key:'traffic',label:'⚪ Traffic (Table 4-1)', color:'var(--fg-m)' },
  { key:'dat',    label:'🧪 MEPS Drug / Alcohol Test (Para 4-18)', color:'#cc99ff' },
  { key:'ps',     label:'🪖 Prior Service — Military Discipline', color:'#cc99ff' },
];

/* One editor per offense — dates, disposition, confinement, and packet details
   all in one place (no repeated question wizard). */
const OffenseEditor = ({ o, applicant, onChange, onDone }) => {
  const cat = catOf(o.categoryId) || {};
  const todayStr = today();
  const isDat = cat.group === 'dat';
  const isPs = cat.class === 'ps';
  const isTraffic = cat.class === 'traffic';
  const set = (field) => (e) => onChange({ [field]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });

  const warnings = [];
  if (o.offenseDate && o.offenseDate > todayStr) warnings.push('Offense date is in the future.');
  if (o.convictionDate && o.convictionDate > todayStr) warnings.push('Conviction date is in the future.');
  if (applicant.dob && o.offenseDate && o.offenseDate < applicant.dob) warnings.push(`Offense date precedes applicant DOB (${fmtDate(applicant.dob)}).`);
  if (o.offenseDate && o.convictionDate && o.convictionDate < o.offenseDate) warnings.push(`Conviction date (${fmtDate(o.convictionDate)}) is BEFORE the offense date (${fmtDate(o.offenseDate)}) — almost always a data-entry error. Fix before continuing.`);
  if (o.releaseDate && o.convictionDate && o.releaseDate < o.convictionDate) warnings.push('Release-from-confinement date is before the conviction date — verify.');

  const juvenile = isJuvenileOffense(applicant, o);
  const confined = ['1to14','15plus'].includes(o.confinement);

  return (
    <div style={{border:'1px solid var(--bd-m)',padding:'14px',marginTop:6,marginBottom:8,background:'var(--bg-s)'}} className="fade-in">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <span className={`offense-level-badge ${CLASS_BADGE[cat.class]?.cls||''}`}>{CLASS_BADGE[cat.class]?.label||''}</span>
        <span style={{fontSize:12,fontWeight:700,color:'var(--fg2)',flex:1}}>{cat.label}</span>
        {juvenile && <span className="offense-level-badge lvl-VARIES" title="Offense date is before the applicant's 18th birthday (computed from DOB)">JUVENILE</span>}
      </div>

      <div className="form-grid" style={{marginBottom:8}}>
        <div className="form-field">
          <label className="form-label">{isDat ? 'Test Date' : 'Offense Date (when the act happened)'} <span style={{color:'#ff6b6b'}}>*</span></label>
          <input className="form-input" type="date" max={todayStr} value={o.offenseDate||''} onChange={set('offenseDate')}/>
        </div>
        {!isDat && !isPs && (
          <div className="form-field">
            <label className="form-label">Conviction / Final Disposition Date</label>
            <input className="form-input" type="date" max={todayStr} value={o.convictionDate||''} onChange={set('convictionDate')}
              style={{borderColor:(o.convictionDate && o.offenseDate && o.convictionDate < o.offenseDate)?'#ff5555':undefined}}/>
            {cat.class==='major' && <div style={{fontSize:9,color:'var(--fg-m)',marginTop:2}}>Starts the 24-month clock (4-7a)</div>}
          </div>
        )}
      </div>

      {!isDat && !isPs && (
        <div className="form-field" style={{marginBottom:8}}>
          <label className="form-label">Court Disposition <span style={{color:'#ff6b6b'}}>*</span></label>
          <select className="form-input" value={o.disposition||''} onChange={set('disposition')}>
            <option value="">Select disposition...</option>
            {DISPOSITION_OPTIONS.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
          </select>
          <div style={{fontSize:9,color:'var(--fg-m)',marginTop:2}}>Diversion, deferred adjudication, fines, and probated sentences all count as ADVERSE dispositions (4-30b). Expunged/sealed records still count.</div>
        </div>
      )}

      {!isDat && !isPs && !isTraffic && isAdverse(o) && (
        <div className="form-grid" style={{marginBottom:8}}>
          <div className="form-field">
            <label className="form-label">Confinement Served</label>
            <select className="form-input" value={o.confinement||'no'} onChange={set('confinement')}>
              {CONFINEMENT_OPTIONS.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
            </select>
          </div>
          {confined ? (
            <div className="form-field">
              <label className="form-label">Release from Confinement Date <span style={{color:'#ff6b6b'}}>*</span></label>
              <input className="form-input" type="date" max={todayStr} value={o.releaseDate||''} onChange={set('releaseDate')}/>
              <div style={{fontSize:9,color:'var(--fg-m)',marginTop:2}}>The 4-31 waiting period runs from THIS date</div>
            </div>
          ) : (
            <div className="form-field">
              <label className="form-label">Probation / Parole</label>
              <select className="form-input" value={o.probation||'no'} onChange={set('probation')}>
                {PROBATION_OPTIONS.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}
              </select>
            </div>
          )}
        </div>
      )}
      {!isDat && !isPs && !isTraffic && isAdverse(o) && confined && (
        <div className="form-field" style={{marginBottom:8}}>
          <label className="form-label">Probation / Parole</label>
          <select className="form-input" value={o.probation||'no'} onChange={set('probation')}>
            {PROBATION_OPTIONS.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}
          </select>
        </div>
      )}

      {warnings.length > 0 && (
        <div style={{marginBottom:8}}>
          {warnings.map((w,i)=>(
            <div key={i} style={{padding:'6px 10px',background:'rgba(207,0,0,.13)',border:'1px solid rgba(207,0,0,.4)',color:'#ff7070',fontSize:11,marginTop:4,display:'flex',gap:6}}>
              <span>⛔</span><span>{w}</span>
            </div>
          ))}
        </div>
      )}

      <div className="form-field" style={{marginBottom:8}}>
        <label className="form-label">Description (as it will appear on UF 601-210.08)</label>
        <input className="form-input" value={o.description||''} onChange={set('description')} placeholder={isDat?'e.g. Positive DAT — THC, MEPS Nashville':'Brief factual description of the offense'}/>
      </div>

      {!isDat && (
        <>
          <div className="form-grid-3" style={{marginBottom:8}}>
            <div className="form-field">
              <label className="form-label">City / Jurisdiction</label>
              <input className="form-input" value={o.city||''} onChange={set('city')} placeholder="City"/>
            </div>
            <div className="form-field">
              <label className="form-label">County</label>
              <input className="form-input" value={o.county||''} onChange={set('county')} placeholder="County"/>
            </div>
            <div className="form-field">
              <label className="form-label">State</label>
              <select className="form-input" value={o.state||''} onChange={set('state')}>
                <option value="">State...</option>
                {US_STATES.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="form-field" style={{marginBottom:8}}>
            <label className="form-label">Disposition — Exact Wording for Documents</label>
            <input className="form-input" value={o.dispositionText||''} onChange={set('dispositionText')} placeholder='e.g. Convicted — Misdemeanor, $500 fine, 12-month probation (completed)'/>
          </div>
          <div className="row" style={{gap:16,flexWrap:'wrap'}}>
            <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:12,color:'var(--fg2)'}}>
              <input type="checkbox" checked={o.courtDocs||false} onChange={set('courtDocs')}/> Court dockets obtained
            </label>
            <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:12,color:'var(--fg2)'}}>
              <input type="checkbox" checked={o.incidentRpt||false} onChange={set('incidentRpt')}/> Police incident report obtained
            </label>
          </div>
        </>
      )}

      <div className="row" style={{marginTop:12,justifyContent:'flex-end'}}>
        <button className="btn btn-gold btn-sm" onClick={onDone}>Done</button>
      </div>
    </div>
  );
};

const Phase1 = ({ applicant, setApplicant, onHighlight }) => {
  const [addOpen, setAddOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [hoverCat, setHoverCat] = useState(null);

  const ca = applicant.caseAnswers || {};
  const offenses = sortNewest(applicant.offenses || []);
  const verdict = computeCaseVerdict(applicant);
  const approv = computeApprovabilityScore(applicant, verdict);
  const caseDone = CASE_QUESTIONS.every(q => ca[q.id]);

  const setCase = (qid, v) => setApplicant(prev => ({ ...prev, caseAnswers:{ ...(prev.caseAnswers||{}), [qid]:v } }));
  const updateOffenses = (offs) => setApplicant(prev => ({ ...prev, offenses:offs }));
  const patchOffense = (id, patch) => updateOffenses((applicant.offenses||[]).map(o => o.id === id ? { ...o, ...patch } : o));
  const removeOffense = (id) => { updateOffenses((applicant.offenses||[]).filter(o => o.id !== id)); if (editId === id) setEditId(null); };

  // Regulation-panel highlights follow what the recruiter is touching
  useEffect(() => {
    if (!onHighlight) return;
    const paras = new Set();
    if (hoverCat) (CAT_PARA_MAP[hoverCat]||[]).forEach(p => paras.add(p));
    CASE_QUESTIONS.forEach(q => { if (ca[q.id] && ca[q.id] !== 'no') (Q_PARA_MAP[q.id]||[]).forEach(p => paras.add(p)); });
    (applicant.offenses||[]).forEach(o => (CAT_PARA_MAP[o.categoryId]||[]).forEach(p => paras.add(p)));
    onHighlight([...paras]);
  }, [hoverCat, applicant.caseAnswers, applicant.offenses]);

  const addOffense = (catId) => {
    const cat = catOf(catId);
    const o = { id:`o${Date.now()}`, categoryId:catId, offenseDate:'', convictionDate:'',
      disposition: (cat.group === 'dat' || cat.class === 'ps') ? 'convicted' : '',
      confinement:'no', releaseDate:'', probation:'no',
      description:'', city:'', county:'', state:'', dispositionText:'', courtDocs:false, incidentRpt:false };
    updateOffenses([...(applicant.offenses||[]), o]);
    setAddOpen(false); setEditId(o.id);
  };

  const chipInfo = (o) => {
    const cat = catOf(o.categoryId) || {};
    if (!o.disposition && cat.group !== 'dat' && cat.class !== 'ps') return { cls:'', v:'chip-v-unknown', label:'Needs disposition' };
    if (o.disposition === 'dismissed') return { cls:'no-waiver', v:'chip-v-no-waiver', label:'Dismissed — no waiver' };
    if (o.disposition === 'self_admit') return { cls:'etp', v:'chip-v-etp', label:'Self-admit — verify' };
    if (cat.class === 'bar' && isAdverse(o)) return { cls:'bar', v:'chip-v-bar', label:'NOT WAIVABLE' };
    if (verdict?.waivedIds.includes(o.id)) return { cls:'waivable', v:'chip-v-waivable', label:'★ In waiver' };
    if (cat.class === 'ps') return { cls:'', v:'chip-v-unknown', label:'See S1 / RE code' };
    return { cls:'no-waiver', v:'chip-v-no-waiver', label:'Counted — no waiver alone' };
  };

  const missingDisposition = offenses.some(o => { const c = catOf(o.categoryId)||{}; return !o.disposition && c.group !== 'dat' && c.class !== 'ps'; });

  return (
    <div className="main-scroll">
      <div className="fade-up">
        {/* 2026 policy banner — verified against AR 601-210, 20 Mar 2026 */}
        <div className="alert alert-success" style={{marginBottom:14}}>
          <span className="alert-icon">📋</span>
          <div>
            <strong>AR 601-210 (20 Mar 2026):</strong> A single conviction for marijuana possession or drug paraphernalia no longer requires a waiver (para 4-6). Sale/distribution/trafficking (incl. intent) is <strong>not waivable</strong> (4-7c(3)). Major misconduct waivers go to <strong>CG, USARD</strong> with a 24-month wait from conviction (4-7a).
          </div>
        </div>

        {/* Overall case determination */}
        {verdict && verdict.status !== 'PENDING' && (
          <div style={{marginBottom:14}}>
            <OverallVerdictBanner verdict={verdict} approv={approv} applicant={applicant}/>
            {missingDisposition && (
              <div className="alert alert-warn" style={{marginTop:8,marginBottom:0}}>
                <span className="alert-icon">⚠️</span>
                <div>One or more offenses have no disposition selected — they are NOT counted yet. The verdict above may change.</div>
              </div>
            )}
          </div>
        )}

        {/* STEP 1 — Case screening (asked once) */}
        <div className="card" style={{marginBottom:14}}>
          <div className="card-hdr">
            <div className="section-bar"/>
            <div style={{flex:1}}>
              <div className="card-title">Step 1 — Case Screening <span style={{color:caseDone?'#5bc989':'var(--fg-m)',fontSize:10,marginLeft:6}}>{caseDone?'✓ COMPLETE':`${CASE_QUESTIONS.filter(q=>ca[q.id]).length}/${CASE_QUESTIONS.length}`}</span></div>
              <div className="card-sub">Five applicant-level questions — answered once, they apply to the whole case</div>
            </div>
          </div>
          {CASE_QUESTIONS.map(q => (
            <div key={q.id} className="case-q">
              <div className="case-q-text">{q.q}</div>
              <div className="case-q-opts">
                {q.options.map(opt => {
                  const sel = ca[q.id] === opt.v;
                  const danger = ['yes','active'].includes(opt.v);
                  return (
                    <button key={opt.v} className={`case-opt${sel?' selected':''}${sel&&danger?' danger':''}`} onClick={()=>setCase(q.id,opt.v)}>
                      {opt.l}
                    </button>
                  );
                })}
              </div>
              {ca[q.id] && ca[q.id] !== 'no' && <div className="q-hint" style={{marginTop:6,marginBottom:0}}>{q.hint}</div>}
            </div>
          ))}
        </div>

        {/* STEP 2 — Offense record */}
        <div className="card">
          <div className="card-hdr">
            <div className="section-bar"/>
            <div style={{flex:1}}>
              <div className="card-title">Step 2 — Offense Record</div>
              <div className="card-sub">Add EVERY offense in the applicant's history, including traffic — the regulation counts them (4-6/4-7) and UF 601-210.08 requires all of them. Auto-sorted newest to oldest.</div>
            </div>
            {!addOpen && <button className="btn btn-gold btn-sm" onClick={()=>setAddOpen(true)}><IcoPlus/> Add Offense</button>}
            {addOpen && <button className="btn btn-outline btn-sm" onClick={()=>setAddOpen(false)}>Cancel</button>}
          </div>

          {offenses.length === 0 && !addOpen && (
            <div className="empty-state">
              <div style={{fontSize:24,marginBottom:8}}>⚖️</div>
              <div>No offenses logged yet. Click <strong>Add Offense</strong> to begin.</div>
              <div style={{fontSize:10,marginTop:6}}>The verdict is computed from the whole record — single minor offenses often need no waiver at all.</div>
            </div>
          )}

          {/* Offense chips + inline editor */}
          <div className="offense-stack">
            {offenses.map(o => {
              const cat = catOf(o.categoryId) || {};
              const info = chipInfo(o);
              const juvenile = isJuvenileOffense(applicant, o);
              return (
                <React.Fragment key={o.id}>
                  <div data-id={o.id} className={`offense-chip ${info.cls}`}>
                    <span className={`chip-verdict ${info.v}`}>{info.label}</span>
                    <div className="chip-label">{o.description || cat.label}</div>
                    {juvenile && <span className="chip-auth" title="Before applicant's 18th birthday">JUV</span>}
                    {o.offenseDate && <span className="chip-auth">{fmtDate(o.offenseDate)}</span>}
                    <button className="btn btn-outline btn-sm" style={{padding:'2px 8px',fontSize:10}} onClick={()=>setEditId(editId===o.id?null:o.id)}>{editId===o.id?'Close':'Edit'}</button>
                    <button className="chip-del" onClick={()=>removeOffense(o.id)} title="Remove this offense"><IcoX s={9}/></button>
                  </div>
                  {editId === o.id && (
                    <OffenseEditor o={o} applicant={applicant} onChange={patch=>patchOffense(o.id,patch)} onDone={()=>setEditId(null)}/>
                  )}
                </React.Fragment>
              );
            })}
          </div>

          {/* Category picker */}
          {addOpen && (
            <div style={{marginTop:12}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:'var(--fg2)'}}>What kind of offense?</div>
              {OFFENSE_GROUPS.map(grp => {
                const cats = OFFENSE_CATEGORIES.filter(c => c.group === grp.key);
                if (!cats.length) return null;
                return (
                  <div key={grp.key} style={{marginBottom:10}}>
                    <div className="offense-group-label" style={{color:grp.color}}>{grp.label}</div>
                    <div className="offense-grid">
                      {cats.map(cat => (
                        <button key={cat.id}
                          className={`offense-card${cat.class==='bar'?' bar':''}${cat.noWaiverSingle?' no-waiver':''}`}
                          onMouseEnter={()=>setHoverCat(cat.id)} onMouseLeave={()=>setHoverCat(null)}
                          onClick={()=>addOffense(cat.id)}>
                          <div className="offense-label">{cat.label}</div>
                          <div className="offense-sub">{cat.sub}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

/* ── Overall Case Verdict Banner ─────────────────────────── */
const OverallVerdictBanner = ({ verdict, approv, applicant }) => {
  const [showMeter, setShowMeter] = useState(false);
  if (!verdict) return null;
  const AUTH_FULL = { BN:'Battalion Commander', USARD:'CG, U.S. Army Recruiting Division (USARD)' };
  const st = verdict.status;
  const fmtD = d => (d && !isNaN(d)) ? d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—';

  /* NOT WAIVABLE — full red banner */
  if (st === 'NOT_WAIVABLE') {
    const permBars = verdict.bars.filter(b => b.perm);
    const tempBars = verdict.bars.filter(b => !b.perm);
    return (
      <div style={{background:'linear-gradient(135deg,#3a0f0f 0%,#1f0808 100%)',border:'3px solid #ff3b3b',borderRadius:8,padding:'20px 24px',color:'#ffdddd',boxShadow:'0 0 0 1px #ff3b3b44 inset'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
          <div style={{fontSize:32}}>⛔</div>
          <div>
            <div style={{fontSize:22,fontWeight:800,color:'#ff5555'}}>
              {permBars.length ? 'NOT WAIVABLE — DO NOT SUBMIT' : 'CANNOT PROCESS NOW'}
            </div>
            <div style={{fontSize:13,color:'#ffaaaa',marginTop:2}}>
              {permBars.length ? 'One or more permanent bars — no waiver authority exists at any level.' : 'Temporary block — resolve the items below, then re-screen.'}
            </div>
          </div>
        </div>
        {permBars.length > 0 && (
