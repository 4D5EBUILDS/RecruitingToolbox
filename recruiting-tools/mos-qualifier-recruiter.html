const _CLR={none:'None',secret:'Secret',ts:'TS/SCI'};
const _PD={1:'Heavy',2:'Moderate',3:'Light'};
const _ICO={
  Infantry:'helmet',Armor:'helmet',
  Engineer:'tools',Ordnance:'tools',Chemical:'tools',
  'Field Artillery':'insignia','Air Defense':'insignia',
  Aviation:'helicopter',
  Cyber:'radio',Signal:'radio',
  'Special Forces':'star','Special Operations':'star',Special:'star','Enlistment Option':'star',
  'Military Police':'insignia',
  Intelligence:'document','Public Affairs':'document',Legal:'document',
  Finance:'pay',Contracting:'pay',
  'Adjutant General':'soldier',Chaplain:'soldier',Recruiting:'soldier','Officer Accessions':'soldier',
  Medical:'healthcare',
  Transportation:'vehicle',Quartermaster:'vehicle',
};

const MOS_CATALOG=_RAW.map(m=>{
  const wk=(m.ait_len||'').match(/\d+/);
  return {
    code:m.code,title:m.title,field:m.cmf,
    icon:_ICO[m.cmf]||'star',
    reqs:m.reqs||null,combo:m.combo||null,
    weeks:wk?parseInt(wk[0]):null,
    ait_len:m.ait_len||'',train:m.ait||'—',
    term:m.term||'',acasp:m.acasp,vision:m.vision,
    clearance:_CLR[m.clearance]||'None',
    physicalDemand:_PD[m.opat]||'Moderate',
    longDesc:m.notes||'',duties:[],
    advancement:'',civilianCareers:m.civilian||'',
  };
});

function evalMos(mos,scores){
  if(!mos.reqs&&!mos.combo) return{...mos,reqs:[],met:false,gap:0,margin:0,unknown:true,verify:true,comboReqs:[]};
  function trySet(obj){
    const reqs=Object.entries(obj||{}).map(([key,min])=>{
      const have=scores[key];
      const entered=have!==null&&have!==undefined;
      return{key,min,have:have??0,delta:entered?have-min:null,met:entered&&have>=min,entered};
    });
    return{reqs,allMet:reqs.every(r=>r.met),anyUnknown:reqs.some(r=>!r.entered)};
  }
  const comboReqs=(mos.combo||[]).map(c=>trySet(Object.fromEntries(c.map(({s,v})=>[s,v]))).reqs);
  const pri=trySet(mos.reqs);
  if(pri.allMet) return{...mos,reqs:pri.reqs,met:true,gap:0,margin:Math.min(...pri.reqs.map(r=>r.delta??0)),unknown:false,verify:false,comboReqs};
  if(mos.combo){
    for(const c of mos.combo){
      const r=trySet(Object.fromEntries(c.map(({s,v})=>[s,v])));
      if(r.allMet) return{...mos,reqs:pri.reqs,met:true,gap:0,margin:Math.min(...r.reqs.map(x=>x.delta??0)),unknown:false,verify:false,comboReqs};
    }
  }
  const fails=pri.reqs.filter(r=>r.entered&&!r.met);
  const gap=fails.length>0?Math.max(...fails.map(r=>r.min-r.have)):0;
  return{...mos,reqs:pri.reqs,met:false,gap,margin:-gap,unknown:pri.anyUnknown,verify:false,comboReqs};
}

function summarize(scores){
  const evals=MOS_CATALOG.map(m=>evalMos(m,scores));
  const qualified=evals.filter(e=>e.met);
  const near=evals.filter(e=>!e.met&&!e.unknown&&!e.verify&&e.gap>0&&e.gap<=5).sort((a,b)=>a.gap-b.gap);
  const fields=[...new Set(qualified.map(e=>e.field))];
  return{evals,qualified,near,fields,total:MOS_CATALOG.length};
}
Object.assign(window,{LINE_SCORES,MOS_CATALOG,evalMos,summarize});
</script>

/* ─────────────────────────────────────────────────────────────────
   INTRO SPLASH
   ───────────────────────────────────────────────────────────────── */
const R_Intro=({onDone})=>{
  const[exiting,setExiting]=React.useState(false);
  const[textPhase,setTextPhase]=React.useState(0); // 0=hidden 1=scrambling 2=settled
  const[displayText,setDisplayText]=React.useState('');
  const FINAL='U.S. ARMY';
  const GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#%&';

  // generate noise texture once
  const noiseUrl=React.useMemo(()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=96;
      const ctx=c.getContext('2d'),id=ctx.createImageData(96,96);
      for(let i=0;i<id.data.length;i+=4){
        const v=Math.random()*255|0;
        id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;
      }
      ctx.putImageData(id,0,0);return c.toDataURL();
    }catch{return '';}
  },[]);

  const exit=React.useCallback(()=>setExiting(true),[]);

  // when exiting, wait for CSS transition then call onDone
  React.useEffect(()=>{
    if(!exiting) return;
    const t=setTimeout(onDone,470);
    return()=>clearTimeout(t);
  },[exiting,onDone]);

  // main timeline
  React.useEffect(()=>{
    let scramble=null;
    // text scramble starts at 1.3s
    const t1=setTimeout(()=>{
      setTextPhase(1);
      let frame=0,total=22;
      scramble=setInterval(()=>{
        frame++;
        if(frame>=total){setDisplayText(FINAL);setTextPhase(2);clearInterval(scramble);}
        else{
          const lock=Math.floor((frame/total)*FINAL.length);
          setDisplayText(FINAL.split('').map((ch,i)=>
            (ch===' '||ch==='.')?ch:(i<lock?ch:GLYPHS[Math.random()*GLYPHS.length|0])
          ).join(''));
        }
      },42);
    },1300);
    // auto-exit at 3.1s
    const t2=setTimeout(()=>setExiting(true),3100);
    return()=>{clearTimeout(t1);clearTimeout(t2);if(scramble)clearInterval(scramble);};
  },[]);

  const dur='2.2s';
  return(
    <div onClick={exit} style={{
      position:'fixed',inset:0,zIndex:9999,background:'#000',
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      cursor:'pointer',overflow:'hidden',userSelect:'none',
      opacity:exiting?0:1,transition:exiting?'opacity 0.45s ease-in':'none'
    }}>

      {/* animated noise */}
      {noiseUrl&&(
        <div style={{position:'absolute',inset:0,
          backgroundImage:`url(${noiseUrl})`,backgroundRepeat:'repeat',
          opacity:.04,animation:'r4NoiseAnim 0.45s steps(9) infinite',
          pointerEvents:'none',zIndex:1}}/>
      )}

      {/* CRT scanlines */}
      <div style={{position:'absolute',inset:0,
        background:'repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.2) 2px,rgba(0,0,0,.2) 4px)',
        pointerEvents:'none',zIndex:2}}/>

      {/* vignette */}
      <div style={{position:'absolute',inset:0,
        background:'radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(0,0,0,.8) 100%)',
        pointerEvents:'none',zIndex:2}}/>

      {/* horizontal scan-sweep */}
      <div style={{position:'absolute',left:0,right:0,height:3,
        background:'linear-gradient(90deg,transparent,rgba(255,204,1,.45) 25%,rgba(255,204,1,.85) 50%,rgba(255,204,1,.45) 75%,transparent)',
        animation:`r4ScanSweep 1.55s linear forwards`,
        pointerEvents:'none',zIndex:3}}/>

      {/* white flash burst on logo slam */}
      <div style={{position:'absolute',inset:0,background:'#fff',
        animation:`r4IntroFlash ${dur} linear forwards`,
        pointerEvents:'none',zIndex:3}}/>

      {/* ── logo cluster ── */}
      <div style={{position:'relative',width:300,height:300,zIndex:4}}>

        {/* red chromatic ghost */}
        <img src="../assets/logos/army-star.svg"
          onError={e=>e.currentTarget.style.display='none'}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',
            filter:'sepia(1) saturate(14) hue-rotate(300deg) brightness(2)',
            mixBlendMode:'screen',opacity:0,
            animation:`r4GlitchRed ${dur} linear forwards`}}/>

        {/* blue chromatic ghost */}
        <img src="../assets/logos/army-star.svg"
          onError={e=>e.currentTarget.style.display='none'}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',
            filter:'sepia(1) saturate(14) hue-rotate(158deg) brightness(2)',
            mixBlendMode:'screen',opacity:0,
            animation:`r4GlitchBlue ${dur} linear forwards`}}/>

        {/* main star — white, clip-path glitch */}
        <img src="../assets/logos/army-star.svg"
          onError={e=>e.currentTarget.style.display='none'}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',
            filter:'brightness(20) saturate(0)',
            animation:`r4GlitchMain ${dur} linear forwards`}}/>
      </div>

      {/* U.S. ARMY heading */}
      <div style={{
        fontFamily:'"GI",monospace',fontWeight:750,fontSize:48,
        letterSpacing:'0.22em',marginTop:20,zIndex:4,
        minWidth:340,textAlign:'center',
        color:textPhase===2?'#FFCC01':'rgba(255,255,255,.92)',
        textShadow:textPhase===2?'0 0 40px rgba(255,204,1,.4)':'none',
        transition:textPhase===2?'color .35s ease,text-shadow .35s ease':'none',
        animation:textPhase===1?'r4TextGlitch .28s linear infinite':'none',
        opacity:textPhase>0?1:0
      }}>{displayText||' '}</div>

      {/* click-to-skip hint */}
      <div style={{
        position:'absolute',bottom:28,zIndex:4,
        fontFamily:'"GI",monospace',fontWeight:530,fontSize:9.5,
        color:'rgba(255,255,255,.2)',letterSpacing:'0.14em',
        animation:'r4FadeIn .5s ease .4s both'
      }}>CLICK TO SKIP</div>

    </div>
  );
};

const RecruiterTool=()=>{
  const initScores=Object.fromEntries(LINE_SCORES.map(ls=>[ls.key,null]));
  const[scores,setScores]=React.useState(initScores);
  const[clearFilter,setClearFilter]=React.useState('All');
  const[branchFilter,setBranchFilter]=React.useState('');
  const[search,setSearch]=React.useState('');
  const[sort,setSort]=React.useState({key:'status',dir:1});
  const[selCode,setSelCode]=React.useState(null);
  const[detailVisible,setDetailVisible]=React.useState(false);
  const[displayCount,setDisplayCount]=React.useState(0);
  const[flashes,setFlashes]=React.useState({});
  const prevQual=React.useRef(new Set());
  const countRef=React.useRef(null);

  const setScore=(key,val)=>{
    if(val===''||val===null){setScores(s=>({...s,[key]:null}));return;}
    const n=parseInt(val,10);
    if(isNaN(n))return;
    setScores(s=>({...s,[key]:Math.max(0,Math.min(150,n))}));
  };

  const s=React.useMemo(()=>summarize(scores),[JSON.stringify(scores)]);

  React.useEffect(()=>{
    const target=s.qualified.length;
    if(displayCount===target)return;
    const dir=target>displayCount?1:-1;
    let cur=displayCount;
    const step=()=>{cur+=dir;setDisplayCount(cur);if(cur!==target)countRef.current=setTimeout(step,50);};
    clearTimeout(countRef.current);
    countRef.current=setTimeout(step,30);
    return()=>clearTimeout(countRef.current);
  },[s.qualified.length]);

  React.useEffect(()=>{
    const curr=new Set(s.qualified.map(e=>e.code));
    const nf={};
    curr.forEach(c=>{if(!prevQual.current.has(c))nf[c]='qual';});
    prevQual.current.forEach(c=>{if(!curr.has(c))nf[c]='lock';});
    if(Object.keys(nf).length){setFlashes(nf);setTimeout(()=>setFlashes({}),750);}
    prevQual.current=curr;
  },[s.qualified.length,scores]);

  React.useEffect(()=>{
    const k=ev=>{if(ev.key==='Escape'&&detailVisible)closeDetail();};
    document.addEventListener('keydown',k);
    return()=>document.removeEventListener('keydown',k);
  },[detailVisible]);

  const openDetail=React.useCallback(code=>{setSelCode(code);setDetailVisible(true);},[]);
  const closeDetail=React.useCallback(()=>setDetailVisible(false),[]);

  const CLR_OPTIONS=['All','None','Secret','TS/SCI'];
  const branches=React.useMemo(()=>
    [''].concat([...new Set(MOS_CATALOG.map(m=>m.field))].sort()),[]);

  const evals=[...s.evals].sort((a,b)=>{
    const d=sort.dir;
    if(sort.key==='status'){
      const rk=e=>e.met?0:e.unknown||e.verify?2:1;
      return d*((rk(a)-rk(b))||a.code.localeCompare(b.code));
    }
    if(sort.key==='code')  return d*a.code.localeCompare(b.code);
    if(sort.key==='title') return d*a.title.localeCompare(b.title);
    if(sort.key==='field') return d*a.field.localeCompare(b.field);
    if(sort.key==='weeks') return d*((a.weeks||0)-(b.weeks||0));
    return 0;
  });

  const rows=evals
    .filter(e=>clearFilter==='All'||e.clearance===clearFilter)
    .filter(e=>!branchFilter||e.field===branchFilter)
    .filter(e=>{
      if(!search.trim())return true;
      const q=search.trim().toLowerCase();
      return e.code.toLowerCase().includes(q)||e.title.toLowerCase().includes(q)||e.field.toLowerCase().includes(q);
    });

  const selected=selCode?s.evals.find(e=>e.code===selCode):null;
  const unlockPct=Math.round((s.qualified.length/s.total)*100);

  return(
    <div style={{width:'100vw',height:'100vh',overflow:'hidden',display:'flex',
      flexDirection:'column',background:R.tan,fontFamily:GI.display,position:'relative'}}>

      {/* HEADER */}
      <div style={{flex:'0 0 auto',height:56,display:'flex',alignItems:'center',
        gap:16,padding:'0 20px',background:R.ink,borderBottom:`2px solid ${R.gold}`}}>
        <img src="../assets/logos/army-logo-reverse.svg" alt="U.S. Army" style={{height:26}}
          onError={e=>{e.target.style.display='none';}}/>
        <div style={{width:1,height:26,background:'rgba(255,204,1,.3)'}}/>
        <div>
          <div style={{fontFamily:GI.display,fontWeight:700,fontSize:13,color:R.white,
            textTransform:'uppercase',letterSpacing:'0.06em',lineHeight:1}}>ASVAB MOS QUALIFIER</div>
          <div style={{fontFamily:GI.display,fontWeight:700,fontSize:8,color:R.g1,
            letterSpacing:'0.08em',marginTop:2}}>RECRUITER EDITION · DA PAM 611-21 · 4/28/2026</div>
        </div>
        {/* stat chips */}
        <div style={{display:'flex',gap:8,marginLeft:16}}>
          {[['QUALIFIED',displayCount,`/${s.total}`],['FIELDS',s.fields.length,''],['NEAR MISS',s.near.length,'']].map(([k,v,suf])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:5,
              padding:'4px 10px',border:`1px solid rgba(255,204,1,.3)`}}>
              <span style={{fontFamily:GI.display,fontWeight:700,fontSize:8,color:R.g2,letterSpacing:'0.07em'}}>{k}</span>
              <span key={`${k}-${v}`} style={{fontFamily:GI.mono,fontWeight:700,fontSize:17,
                color:R.gold,lineHeight:1,animation:'r4Counter .25s ease both'}}>{v}</span>
              {suf&&<span style={{fontFamily:GI.mono,fontSize:13,color:R.g2}}>{suf}</span>}
            </div>
          ))}
        </div>
        {/* branch dropdown */}
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:'auto'}}>
          <span style={{fontFamily:GI.display,fontWeight:700,fontSize:8.5,color:R.g1,
            letterSpacing:'0.05em',whiteSpace:'nowrap'}}>BRANCH</span>
          <select value={branchFilter} onChange={e=>setBranchFilter(e.target.value)}
            style={{fontFamily:GI.display,fontWeight:700,fontSize:9.5,
              background:R.ink,color:branchFilter?R.gold:R.g2,
              border:`1.5px solid ${branchFilter?R.gold:'rgba(255,204,1,.25)'}`,
              padding:'5px 8px',outline:'none',cursor:'pointer',letterSpacing:'0.04em',maxWidth:160}}>
            <option value="">ALL</option>
            {branches.filter(b=>b).map(b=>(
              <option key={b} value={b}>{b.toUpperCase()}</option>
            ))}
          </select>
        </div>
        {/* clearance tabs */}
        <div style={{display:'flex',gap:4}}>
          <span style={{fontFamily:GI.display,fontWeight:700,fontSize:8.5,color:R.g1,
            letterSpacing:'0.05em',alignSelf:'center',marginRight:4}}>CLEARANCE</span>
          {CLR_OPTIONS.map(opt=>{
            const active=clearFilter===opt;
            const cc=CLR_COLORS[opt];
            return(
              <button key={opt} onClick={()=>setClearFilter(opt)} style={{
                fontFamily:GI.display,fontWeight:700,fontSize:9.5,letterSpacing:'0.04em',
                textTransform:'uppercase',cursor:'pointer',padding:'5px 10px',
                border:`1.5px solid ${active?(cc?.border||R.gold):'rgba(255,204,1,.25)'}`,
                background:active?(cc?.border||R.gold):'transparent',
                color:active?(opt==='TS/SCI'?R.white:R.ink):R.g2,
                transition:'all 160ms cubic-bezier(.2,.6,0,1)'}}>
                {opt}
              </button>
            );
          })}
        </div>
      </div>

      {/* BODY */}
      <div style={{flex:1,display:'grid',gridTemplateColumns:'274px 1fr',minHeight:0}}>

        {/* score rail */}
        <div style={{background:R.ink,display:'flex',flexDirection:'column',
          overflow:'hidden',borderRight:`2px solid ${R.gold}`}}>
          <div style={{padding:'12px 16px 8px',borderBottom:`1px solid rgba(255,204,1,.12)`}}>
            <div style={{fontFamily:GI.display,fontWeight:700,fontSize:9.5,color:R.gold,
              letterSpacing:'0.08em'}}>LINE SCORES — PASTE TO EXPLORE</div>
            <div style={{fontFamily:GI.display,fontWeight:500,fontSize:9,color:R.g1,marginTop:3}}>
              Qualifying specialties update live.
            </div>
          </div>
          <div style={{flex:1,overflowY:'auto'}}>
            {LINE_SCORES.map(ls=>(
              <R_ScoreInput key={ls.key} ls={ls} value={scores[ls.key]} onChange={setScore}/>
            ))}
          </div>
          <div style={{padding:'14px 16px',borderTop:`1px solid rgba(255,204,1,.15)`,
            background:R.green,flex:'0 0 auto'}}>
            <div style={{fontFamily:GI.display,fontWeight:700,fontSize:8.5,color:R.tan,
              letterSpacing:'0.07em',marginBottom:4}}>UNLOCK RATE</div>
            <div style={{display:'flex',alignItems:'baseline',gap:6}}>
              <span style={{fontFamily:GI.mono,fontWeight:700,fontSize:30,color:R.gold}}>{unlockPct}%</span>
              <span style={{fontFamily:GI.display,fontSize:11,color:'rgba(241,228,199,.7)'}}>
                {s.qualified.length} of {s.total} MOS
              </span>
            </div>
            <div style={{marginTop:6,height:4,background:'rgba(255,255,255,.12)',position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',left:0,top:0,bottom:0,
                width:`${(s.qualified.length/s.total)*100}%`,
                background:R.gold,transition:'width 400ms cubic-bezier(.2,.6,0,1)'}}/>
            </div>
          </div>
        </div>

        {/* catalog */}
        <div style={{display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
          {/* search */}
          <div style={{padding:'7px 12px',borderBottom:`1px solid ${R.lineDark}`,
            background:R.tanDark,flex:'0 0 auto',display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:GI.mono,fontSize:14,color:R.g1,flex:'0 0 auto'}}>⌕</span>
            <input type="text" placeholder="Search by code, title, or branch…"
              value={search} onChange={e=>setSearch(e.target.value)}
              style={{flex:1,fontFamily:GI.display,fontWeight:500,fontSize:12.5,
                background:'transparent',border:'none',outline:'none',
                color:R.ink,letterSpacing:'0.01em',padding:'2px 0'}}/>
            {search&&<>
              <button onClick={()=>setSearch('')} style={{fontFamily:GI.mono,fontSize:12,
                background:'transparent',border:'none',cursor:'pointer',color:R.g1,padding:'0 4px',lineHeight:1}}>✕</button>
              <span style={{fontFamily:GI.display,fontWeight:700,fontSize:9,
                color:R.g1,letterSpacing:'0.05em',whiteSpace:'nowrap'}}>
                {rows.length} RESULT{rows.length!==1?'S':''}
              </span>
            </>}
          </div>
          {/* col headers */}
          <div style={{display:'grid',gridTemplateColumns:'20px 62px 1fr 76px 192px 78px 44px',
            alignItems:'center',gap:0,padding:'0 12px',height:34,background:R.tanDark,
            borderBottom:`1.5px solid rgba(34,31,32,.25)`,flex:'0 0 auto'}}>
            <div/>
            <R_HeadCell id="code"   label="Code"     sort={sort} setSort={setSort}/>
            <R_HeadCell id="title"  label="Specialty" sort={sort} setSort={setSort}/>
            <div style={{fontFamily:GI.display,fontWeight:700,fontSize:9,
              letterSpacing:'0.07em',textTransform:'uppercase',color:R.g1}}>Clearance</div>
            <div style={{fontFamily:GI.display,fontWeight:700,fontSize:9,
              letterSpacing:'0.07em',textTransform:'uppercase',color:R.g1}}>Score Req.</div>
            <R_HeadCell id="status" label="Demand" sort={sort} setSort={setSort}/>
            <R_HeadCell id="weeks"  label="Wks" sort={sort} setSort={setSort} style={{textAlign:'right'}}/>
          </div>
          {/* rows */}
          <div key={`${clearFilter}-${branchFilter}`} style={{flex:1,overflowY:'auto'}}>
            {rows.map(e=>(
              <R_Row key={e.code} e={e} flash={flashes[e.code]||null} onClick={()=>openDetail(e.code)}/>
            ))}
            {rows.length===0&&(
              <div style={{padding:'48px 24px',textAlign:'center',fontFamily:GI.display,
                fontWeight:700,fontSize:18,color:'rgba(34,31,32,.4)',
                textTransform:'uppercase',letterSpacing:'0.06em'}}>
                No specialties match this filter.
              </div>
            )}
          </div>
        </div>
      </div>

      <R_Detail e={selected} onClose={closeDetail} visible={detailVisible}/>
    </div>
  );
};

const App=()=>{
  const[intro,setIntro]=React.useState(true);
  if(intro) return <R_Intro onDone={()=>setIntro(false)}/>;
  return <RecruiterTool/>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
